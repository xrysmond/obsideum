<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSIDEUM</title>
  <link rel="stylesheet" href="core.css">
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    /* ── Desktop grid ── */
    .app-desktop {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: var(--app-h, 100svh);
      height: var(--app-h, 100svh);
      overflow: hidden;
    }

    .content-area {
      display: grid;
      grid-template-columns: 360px 1fr;
      overflow: hidden;
    }

    .markets-layout { display: contents; }

    .token-list-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--trace);
    }

    .token-list { flex: 1; overflow-y: auto; }

    .right-panel { overflow: hidden; min-width: 360px; }

    .settings-layout {
      grid-column: 1 / -1;
      overflow-y: auto;
    }

    /* Accounts tab — desktop. Same grid slot as settings.
     * Content constrained to 520px so it doesn't stretch on
     * wide screens — matches wallet sheet proportions. */
    .accounts-layout {
      grid-column: 1 / -1;
      overflow-y: auto;
      padding: var(--sp-5);
    }

    .accounts-layout > .accounts-inner {
      max-width: 520px;
    }

    /* ── Sidebar shell ── */
    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #sidebar {
      background: rgba(7,7,9,.40);
      -webkit-backdrop-filter: blur(26px) saturate(175%);
      backdrop-filter: blur(26px) saturate(175%);
      border: none;
      border-right: 1px solid rgba(156,61,187,.22);
      box-shadow:
        0 0 0 0.5px rgba(156,61,187,.10),
        inset -1px 0 0 rgba(190,128,220,.08),
        6px 0 32px -4px  rgba(0,0,0,.60),
        20px 0 60px -12px rgba(0,0,0,.80);
    }

    .sidebar-wordmark {
      font-family: var(--fd);
      font-weight: 400;
      font-size: .92rem;
      letter-spacing: .20em;
      color: var(--br);
      padding: var(--sp-4) var(--sp-3) var(--sp-5);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
    }

    .sidebar-nav-indicator {
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      height: 46px;
      background: var(--em-2);
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.70),
        0 0 18px 4px rgba(156,61,187,.30);
      transition:
        transform 450ms var(--ease-spr),
        height    350ms var(--ease-spr);
      pointer-events: none;
      z-index: 10;
    }

    .sidebar-nav .nav-item {
      opacity: .28;
      color: var(--em-2);
      padding: .82rem .75rem;
      transition:
        opacity    200ms var(--ease-std),
        background 140ms var(--ease-std),
        transform  300ms var(--ease-spr);
    }
    .sidebar-nav .nav-item::before { display: none; }
    .sidebar-nav .nav-item.active {
      opacity: 1;
      color: var(--em-2);
      background: transparent;
    }
    .sidebar-nav .nav-item:hover:not(.active) {
      opacity: .55;
      background: transparent;
    }
    .sidebar-nav .nav-item:active {
      transform: scale(.96);
      transition: transform 80ms var(--ease-spr);
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      flex-shrink: 0;
    }

    .nav-label {
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      line-height: 1;
    }

    .nav-item--settings {
      border-top: 1px solid var(--trace);
      margin-top: auto;
    }

    /* ── Wallet block ── */
    .sidebar-wallet-block {
      padding: var(--sp-2) var(--sp-3) var(--sp-3);
      border-bottom: 1px solid var(--trace);
    }

    .swb-card {
      background: rgba(156,61,187,.05);
      border: 1px solid rgba(156,61,187,.13);
      box-shadow:
        inset 0 1px 0 rgba(190,128,220,.07),
        inset 0 -1px 0 rgba(0,0,0,.18);
      padding: 9px 10px 8px 12px;
    }

    .swb-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
    }

    .swb-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      background: rgba(156,61,187,.30);
      transition: background 300ms var(--ease-std), box-shadow 300ms var(--ease-std);
    }
    .swb-dot.connected {
      background: var(--up);
      box-shadow: 0 0 6px 1px rgba(52,211,153,.50);
    }

    #sidebar-wallet {
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: .05em;
      color: var(--bd);
      flex: 1;
      min-height: 14px;
      transition: opacity 120ms var(--ease-std);
    }
    #sidebar-wallet:empty::before {
      content: 'no wallet connected';
      color: var(--dim);
      font-size: .58rem;
      letter-spacing: .08em;
      opacity: .50;
    }

    #sidebar-network {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
      padding-left: 12px;
      min-height: 12px;
      transition: color 140ms var(--ease-std);
    }
    #sidebar-network:empty::before {
      content: '— — —';
      opacity: .22;
    }

    .nav-item {
      background: transparent;
      border: none;
    }

    .nav-gear { flex-shrink: 0; }

    /* ── Search bar ── */
    .search-wrap {
      padding: var(--sp-3);
      border-bottom: 1px solid var(--trace);
      flex-shrink: 0;
    }

    /* ── Right panel transitions ── */
    .panel-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: opacity 160ms var(--ease-std);
    }

    .panel-content.leaving  { opacity: 0; }

    .panel-content.entering {
      animation: panelIn 240ms var(--ease-std) forwards;
    }

    @keyframes panelIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .panel-null-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-null-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .44em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ── Responsive ── */
    @media (max-width: 767px) {
      .app-desktop { display: none; }
      .app-mobile {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        position: relative;
        z-index: 1;
      }
    }
    @media (min-width: 768px) {
      .app-desktop { display: grid; }
      .app-mobile  { display: none; }
    }

    /* ── Mobile layout ── */
    .mobile-top-bar {
      display: grid;
      grid-template-columns: 80px 1fr 80px;
      align-items: center;
      padding: 0 var(--sp-2);
      height: 56px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(156,61,187,.18);
      background: rgba(7,7,9,.40);
      -webkit-backdrop-filter: blur(26px) saturate(175%);
      backdrop-filter: blur(26px) saturate(175%);
    }

    .mobile-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .mobile-view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
    }

    /* ── Mobile bottom nav ── */
    .mobile-bottom-nav {
      display: flex;
      height: 62px;
      flex-shrink: 0;
      margin: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: rgba(7,7,9,.40);
      -webkit-backdrop-filter: blur(26px) saturate(175%);
      backdrop-filter: blur(26px) saturate(175%);
      border: 1px solid rgba(156,61,187,.22);
      box-shadow:
        0 0 0 0.5px rgba(156,61,187,.12),
        inset 0 1px 0 rgba(190,128,220,.08),
        0 8px 32px -8px rgba(0,0,0,.6),
        0 24px 60px -20px rgba(0,0,0,.85);
      position: relative;
      z-index: 200;
      transition: opacity 280ms var(--ease-out), transform 300ms var(--ease-spr);
    }

    .mobile-bottom-nav.nav-hidden {
      opacity: 0;
      transform: translateY(110%);
      pointer-events: none;
      height: 0;
      margin: 0;
      overflow: hidden;
      transition: opacity 200ms var(--ease-in), transform 240ms var(--ease-in),
                  height 220ms var(--ease-in), margin 220ms var(--ease-in);
    }

    .mobile-nav-indicator {
      position: absolute;
      top: -1px;
      left: 0;
      height: 2px;
      width: calc(100% / 4);
      background: var(--em-2);
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.7),
        0 0 18px 4px rgba(156,61,187,.3);
      transition: transform 450ms var(--ease-spr);
      pointer-events: none;
    }

    .mobile-wordmark {
      font-family: var(--fd);
      font-weight: 400;
      font-size: .88rem;
      letter-spacing: .24em;
      color: var(--br);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      text-transform: uppercase;
      transition:
        color        220ms var(--ease-std),
        letter-spacing 220ms var(--ease-std),
        font-size    220ms var(--ease-std);
    }

    .mobile-wordmark.ctx-token {
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .42em;
      color: var(--em-2);
    }

    .mobile-wordmark.ctx-section {
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: .48em;
      color: var(--dim);
    }

    .mobile-back,
    .mobile-icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--dim);
      cursor: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition:
        color        160ms var(--ease-std),
        border-color 160ms var(--ease-std),
        background   160ms var(--ease-std);
    }

    .mobile-back {
      opacity: 0;
      pointer-events: none;
      transition:
        color        160ms var(--ease-std),
        border-color 160ms var(--ease-std),
        background   160ms var(--ease-std),
        opacity      200ms var(--ease-std);
    }
    .mobile-back.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-back:hover,
    .mobile-icon-btn:hover {
      color: var(--em-2);
      border-color: var(--em-lo);
      background: var(--em-tr);
    }
    .mobile-back:active,
    .mobile-icon-btn:active {
      transform: scale(.90);
      background: rgba(156,61,187,.14);
      transition: transform 80ms var(--ease-spr), background 80ms var(--ease-spr);
    }
    .mobile-back:focus-visible,
    .mobile-icon-btn:focus-visible {
      outline: 1.5px solid rgba(156,61,187,.50);
      outline-offset: 2px;
    }

    .mobile-top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
    }

    .mobile-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: transparent;
      border: none;
      opacity: .30;
      padding: 8px 0;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 200ms var(--ease-std), transform 300ms var(--ease-spr);
    }
    .mobile-nav-item:active              { transform: scale(.92); transition: transform 80ms var(--ease-spr); }
    .mobile-nav-item.active              { opacity: 1; }
    .mobile-nav-item:hover:not(.active)  { opacity: .52; }

    .mobile-nav-icon {
      width: 18px;
      height: 18px;
      stroke: var(--em-2);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    .mobile-nav-label {
      font-family: var(--fm);
      font-size: 7.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--em-2);
      line-height: 1;
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 3A — TOKEN ROW COMPONENT
       ══════════════════════════════════════════════════════════════ */

    .skeleton {
      background: linear-gradient(
        90deg,
        var(--trace)              0%,
        rgba(156,61,187,.08)     50%,
        var(--trace)             100%
      );
      background-size: 200% 100%;
      animation: skeleton-sweep 1.8s var(--ease-std) infinite;
      border-radius: 2px;
    }
    @keyframes skeleton-sweep {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .token-row--skeleton { pointer-events: none; }

    .token-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      position: relative;
      border-bottom: 1px solid var(--trace);
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      min-height: 58px;
      transition: background 140ms var(--ease-std);
    }

    .token-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--em);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 160ms var(--ease-spr);
      pointer-events: none;
    }

    .token-row:hover                 { background: var(--hi); }
    .token-row:hover::before         { transform: scaleY(1); }
    .token-row:active                { background: var(--em-tr); transition: background 80ms var(--ease-spr); }
    .token-row:focus-visible         { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: -1.5px; }

    .token-row-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      position: relative;
    }

    .token-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: 0;
      color: #ffffff;
      flex-shrink: 0;
    }

    .token-row-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .token-row-name {
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-row-symbol {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .18em;
      color: var(--em-2);
      text-transform: uppercase;
      line-height: 1;
    }

    .token-row-chain {
      font-family: var(--fm);
      font-size: .54rem;
      letter-spacing: .22em;
      color: var(--dim);
      text-transform: uppercase;
      line-height: 1;
    }

    .token-row-sparkline {
      width: 56px;
      height: 24px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 200ms var(--ease-std);
      display: none;
    }

    .token-row-sparkline.sparkline-up { color: var(--up); }
    .token-row-sparkline.sparkline-dn { color: var(--dn); }

    @media (min-width: 768px) {
      .token-row-sparkline { display: block; }
    }

    .token-row:hover .token-row-sparkline { opacity: 1; }

    .token-row-price {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    .token-row-usd {
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1.1;
      transition: opacity 80ms var(--ease-in), color 600ms var(--ease-std);
    }

    .token-row-change {
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: .04em;
      line-height: 1;
    }
    .token-row-change.up                    { color: var(--up); }
    .token-row-change.dn                    { color: var(--dn); }
    .token-row-change:not(.up):not(.dn)     { color: var(--dim); }

    .token-row-volume {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .06em;
      color: var(--dim);
      line-height: 1;
    }

    #mobile-markets {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .token-list-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
      min-height: 160px;
    }

    .token-list-empty-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .28em;
      color: var(--dim);
      text-transform: uppercase;
    }

    .token-list-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      padding: var(--sp-6);
      min-height: 160px;
    }

    .token-list-error-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .22em;
      color: var(--dn);
      text-transform: uppercase;
    }

    .token-list-retry {
      background: transparent;
      border: 1px solid var(--trace);
      color: var(--dim);
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: none;
      transition:
        border-color 120ms var(--ease-std),
        color        120ms var(--ease-std);
    }
    .token-list-retry:hover {
      border-color: var(--em-lo);
      color: var(--em-2);
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 4A — TOKEN PANEL: HEADER + PRICE DISPLAY
       ══════════════════════════════════════════════════════════════ */

    .token-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: var(--sp-5) var(--sp-5) var(--sp-6);
    }

    @media (max-width: 767px) {
      .token-panel { padding: var(--sp-4) var(--sp-3) var(--sp-5); }
    }

    .token-panel-header {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-bottom: var(--sp-4);
      flex-shrink: 0;
    }

    .token-panel-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: block;
      object-fit: cover;
    }

    .token-logo-fallback-lg {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .88rem;
      letter-spacing: 0;
      color: #ffffff;
      flex-shrink: 0;
    }

    .token-panel-identity {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      min-width: 0;
    }

    .token-panel-name {
      font-family: var(--fd);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: .08em;
      color: var(--br);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-panel-symbol {
      font-family: var(--fm);
      font-size: .72rem;
      font-weight: 300;
      letter-spacing: .52em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1;
    }

    .token-panel-price {
      margin-bottom: var(--sp-5);
      flex-shrink: 0;
    }

    .token-panel-usd {
      display: block;
      font-family: var(--fm);
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1;
      margin-bottom: var(--sp-2);
      transition: color 80ms var(--ease-std);
    }

    .token-panel-change {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-family: var(--fm);
      font-size: .82rem;
      font-weight: 300;
      letter-spacing: .04em;
      line-height: 1;
    }

    .token-panel-change.up { color: var(--up); }
    .token-panel-change.dn { color: var(--dn); }

    .token-panel-change-period {
      font-family: var(--fm);
      font-size: .64rem;
      font-weight: 300;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--dim);
      margin-left: var(--sp-1);
    }

    .token-panel-chart-slot {
      flex-shrink: 0;
    }

    .tp-skel-logo   { width: 40px;  height: 40px;  border-radius: 50%;  }
    .tp-skel-name   { width: 140px; height: 22px;  margin-bottom: 6px;  }
    .tp-skel-sym    { width: 56px;  height: 10px;  }
    .tp-skel-price  { width: 180px; height: 34px;  margin-bottom: 10px; }
    .tp-skel-change { width: 120px; height: 13px;  }

    /* ══════════════════════════════════════════════════════════════
       PHASE 4B — PRICE CHART (Lightweight Charts)
       ══════════════════════════════════════════════════════════════ */

    .price-chart {
      width: 100%;
      height: 200px;
      position: relative;
    }

    .chart-time-toggles {
      display: flex;
      align-items: center;
      gap: 0;
      position: relative;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .chart-toggle-indicator {
      position: absolute;
      bottom: 0;
      height: 1.5px;
      background: var(--em);
      border-radius: 1px;
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.55),
        0 0 14px 3px rgba(156,61,187,.22);
      pointer-events: none;
      transition: left 220ms var(--ease-spr), width 220ms var(--ease-spr);
    }

    .chart-toggle {
      font-family: var(--fm);
      font-size: .64rem;
      font-weight: 300;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--dim);
      background: transparent;
      border: none;
      padding: var(--sp-1) var(--sp-3) var(--sp-2);
      cursor: none;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      line-height: 1;
      transition: color 200ms var(--ease-std);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .chart-toggle.active             { color: var(--em-2); }
    .chart-toggle:hover:not(.active) { color: var(--bd); }
    .chart-toggle:active             { transform: scale(.94); transition: transform 80ms var(--ease-spr); }
    .chart-toggle:focus-visible      { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: 2px; }

    /* Lightweight Charts v4 injects <a href="tradingview..."> inside the chart container — hide it */
    .price-chart a { display: none !important; }

    /* ══════════════════════════════════════════════════════════════
       PHASE 4C — STAT CELLS + SWAP BUTTON
       ══════════════════════════════════════════════════════════════ */

    /* Stat row — three equal glass-s cells */
    .token-panel-stats {
      display: flex;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
      flex-shrink: 0;
    }

    /* Individual stat cell */
    .token-stat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: var(--sp-3) var(--sp-2) calc(var(--sp-3) - 2px);
      background: rgba(9,7,14,.48);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      backdrop-filter: blur(12px) saturate(120%);
      border: 1px solid rgba(156,61,187,.13);
      box-shadow:
        inset 0 1px 0 rgba(156,61,187,.18),
        0 2px 12px rgba(0,0,0,.22);
      position: relative;
      overflow: hidden;
      cursor: default;
      transition:
        background    180ms var(--ease-std),
        border-color  180ms var(--ease-std),
        box-shadow    180ms var(--ease-std);
    }

    /* Subtle left edge accent — slides in on hover */
    .token-stat::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 1.5px;
      background: var(--em);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 220ms var(--ease-spr);
      pointer-events: none;
    }

    .token-stat:hover {
      background: rgba(156,61,187,.06);
      border-color: rgba(156,61,187,.16);
    }
    .token-stat:hover::before { transform: scaleY(1); }

    .token-stat-label {
      font-family: var(--fm);
      font-size: .54rem;
      letter-spacing: .40em;
      color: var(--dim);
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-stat-value {
      font-family: var(--fm);
      font-size: .84rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sub-detail — hidden until hover, slides up into view */
    .token-stat-sub {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .14em;
      color: var(--dim);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(5px);
      transition:
        opacity   220ms var(--ease-out),
        transform 220ms var(--ease-spr);
      /* prevents layout shift — the cell height accounts for this line always */
      max-height: 12px;
    }

    .token-stat:hover .token-stat-sub {
      opacity: .65;
      transform: translateY(0);
    }

    /* Skeleton stat cells */
    .tp-skel-stats {
      display: flex;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
      flex-shrink: 0;
    }

    .tp-skel-stat {
      flex: 1;
      padding: var(--sp-3) var(--sp-2);
      background: rgba(156,61,187,.03);
      border: 1px solid rgba(156,61,187,.07);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* SWAP button — no pulse rings, no scan animation.
       Glass sheen + fill gradient + left bar on hover. Active scale only. */
    .token-panel-action {
      margin-top: var(--sp-4);
      flex-shrink: 0;
    }

    .tp-swap-btn {
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .40em;
      text-transform: uppercase;
      padding: 0;
      background: transparent;
      border: none;
      outline: none;
      display: flex;
      width: 100%;
      cursor: none;
      position: relative;
    }

    .tp-swap-btn:disabled {
      opacity: .28;
      pointer-events: none;
    }

    .tp-swap-btn .tp-btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 0;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: rgba(156,61,187,.06);
      color: var(--br);
      border: 1px solid var(--em);
      transition:
        border-color 300ms var(--ease-std),
        box-shadow   400ms var(--ease-std);
    }

    /* Left violet accent bar — scaleY on hover */
    .tp-swap-btn .tp-btn-inner::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: rgba(190,128,220,.22);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 300ms var(--ease-spr);
      z-index: 2;
      pointer-events: none;
    }

    /* Fill gradient sweeps bottom → top on hover */
    .tp-swap-btn .tp-btn-inner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        155deg,
        rgba(180,60,220,.26)  0%,
        rgba(156,61,187,.14) 35%,
        rgba(156,61,187,.20) 65%,
        rgba(100,20,150,.28) 100%
      );
      transform: translateY(101%);
      transition: transform 400ms var(--ease-spr);
      z-index: 0;
      pointer-events: none;
    }

    /* Label — above all pseudo-layers */
    .tp-swap-btn .tp-btn-inner span {
      position: relative;
      z-index: 3;
    }

    /* Diagonal sheen sweep — passes left to right on hover */
    .tp-swap-btn .tp-sheen {
      position: absolute;
      top: 0; bottom: 0;
      width: 55%;
      background: linear-gradient(
        115deg,
        transparent 25%,
        rgba(255,255,255,.10) 48%,
        transparent 72%
      );
      transform: translateX(-160%) skewX(-15deg);
      transition: transform 700ms var(--ease-spr);
      z-index: 1;
      pointer-events: none;
      will-change: transform;
    }

    .tp-swap-btn:hover .tp-btn-inner {
      border-color: var(--em);
      box-shadow:
        0 0 28px rgba(156,61,187,.28),
        0 0 56px rgba(156,61,187,.10);
    }
    .tp-swap-btn:hover .tp-sheen              { transform: translateX(160%) skewX(-15deg); }
    .tp-swap-btn:hover .tp-btn-inner::before  { transform: scaleY(1); }
    .tp-swap-btn:hover .tp-btn-inner::after   { transform: translateY(0); }
    .tp-swap-btn:active .tp-btn-inner         { transform: scale(.97); transition: transform 80ms var(--ease-spr); }
    .tp-swap-btn:focus-visible .tp-btn-inner  { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: 3px; }

    /* Mobile stat cells — tighter padding, reduced tracking to prevent truncation */
    @media (max-width: 767px) {
      .token-stat {
        padding: var(--sp-2) var(--sp-2) 10px;
      }
      .token-stat-label {
        letter-spacing: .12em;
      }
      .token-stat-value {
        font-size: .76rem;
      }
      /* Touch: sub-detail always visible on mobile — no hover */
      .token-stat-sub {
        opacity: .50;
        transform: none;
      }
    }


    /* ══════════════════════════════════════════════════════════════
       PHASE 5A — SWAP CARD
       Architecture: each side (FROM/TO) is a unified glass slot —
       token selector + amount input share one bordered surface.
       Slot glows on :focus-within. No nested backdrop-filter.
       ══════════════════════════════════════════════════════════════ */

    /* ── Outer scroll container ── */
    .swap-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: var(--sp-4) var(--sp-4) var(--sp-5);
      align-items: center;
    }

    @media (max-width: 767px) {
      .swap-view {
        padding: var(--sp-4) var(--sp-3);
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
        align-items: stretch;
      }
    }

    /* ── Swap card — glass-p, centered, constrained ── */
    .swap-card {
      max-width: 440px;
      width: 100%;
      border-radius: 14px;
      padding: var(--sp-4) var(--sp-4) var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    /* ── Network bar — appears above swap card, shows active chain ── */
    .swap-network-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 440px;
      width: 100%;
      padding: 6px var(--sp-2);
      margin-bottom: var(--sp-1);
      border-radius: 8px;
      cursor: pointer;
      transition: background 120ms;
      user-select: none;
    }
    .swap-network-bar:hover {
      background: rgba(156,61,187,.08);
    }
    .swap-network-bar:active {
      background: rgba(156,61,187,.14);
    }
    .swap-network-bar-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--up);
      flex-shrink: 0;
      box-shadow: 0 0 5px var(--up);
    }
    .swap-network-bar-name {
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--em-2);
      flex: 1;
    }
    .swap-network-bar-chevron {
      color: var(--dim);
      opacity: .6;
      flex-shrink: 0;
    }

    /* ── SIDE LABEL — eyebrow above each slot ── */
    .swap-side-label {
      display: block;
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: .52em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 6px;
      padding-left: 2px;
      line-height: 1;
    }

    /* ── SLOT — the unified FROM/TO surface ──
       No backdrop-filter: nested inside glass-p.
       Active/focus glow achieved via border + box-shadow only.     ── */
    .swap-slot {
      background: rgba(156,61,187,.025);
      border: 1px solid rgba(156,61,187,.09);
      border-radius: 10px;
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(156,61,187,.06);
      transition:
        border-color 160ms var(--ease-std),
        box-shadow   200ms var(--ease-std),
        background   160ms var(--ease-std);
      position: relative;
    }
    .swap-slot:focus-within {
      border-color: rgba(156,61,187,.28);
      background: rgba(156,61,187,.04);
      box-shadow:
        inset 0 1px 0 rgba(156,61,187,.10),
        0 0 0 3px rgba(156,61,187,.06),
        0 0 20px rgba(156,61,187,.08);
    }

    /* ── TOKEN SELECTOR ROW inside slot ── */
    .swap-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      background: transparent;
      border: none;
      /* clickable width */
      align-self: flex-start;
      min-width: 0;
    }
    .swap-selector:focus-visible {
      outline: 1.5px solid rgba(156,61,187,.50);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* selector hover: token symbol brightens */
    .swap-selector:hover .swap-token-symbol  { color: var(--br); }
    .swap-selector:hover .swap-chevron-path  { stroke: var(--em-2); }
    .swap-selector:active .swap-token-symbol { opacity: .70; }

    /* ── Token logo in selector ── */
    .swap-token-logo {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: block;
      flex-shrink: 0;
      object-fit: cover;
    }

    .swap-token-logo-fallback {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: 0;
      color: #fff;
      flex-shrink: 0;
    }

    /* ── Token symbol in selector ── */
    .swap-token-symbol {
      font-family: var(--fm);
      font-size: .78rem;
      letter-spacing: .06em;
      color: var(--bd);
      line-height: 1;
      white-space: nowrap;
      transition: color 120ms var(--ease-std);
    }

    /* ── Chevron ── */
    .swap-chevron {
      width: 8px;
      height: 5px;
      flex-shrink: 0;
      display: block;
      overflow: visible;
    }
    .swap-chevron-path {
      transition: stroke 120ms var(--ease-std);
    }

    /* ── Amount input — large, no own border (slot IS the border) ── */
    .swap-amount {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none;
      width: 100%;
      padding: 0;
      font-family: var(--fm);
      font-size: 1.68rem;
      letter-spacing: -.01em;
      color: var(--br);
      line-height: 1;
      caret-color: var(--em-2);
    }
    .swap-amount::placeholder {
      color: rgba(222,228,244,.14);
      opacity: 1;
    }
    .swap-amount::-webkit-inner-spin-button,
    .swap-amount::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Balance / price hint ── */
    .swap-balance {
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .10em;
      color: var(--dim);
      display: block;
      line-height: 1;
    }

    /* ── Output amount display (TO slot — read-only large number) ── */
    .swap-amount-out {
      font-family: var(--fm);
      font-size: 1.68rem;
      letter-spacing: -.01em;
      color: rgba(222,228,244,.18);
      line-height: 1;
      min-height: 1.68rem;
      display: block;
      transition: color 280ms var(--ease-std);
    }
    .swap-amount-out.has-value { color: var(--br); }

    /* ── DIRECTION FLIP BUTTON — architectural centerpiece ──
       Sits between the two slots. Ring pulse on hover.            ── */
    .swap-dir-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 32px;
      flex-shrink: 0;
    }

    /* Horizontal rule — decorative line across */
    .swap-dir-wrap::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(156,61,187,.14) 20%,
        rgba(156,61,187,.20) 50%,
        rgba(156,61,187,.14) 80%,
        transparent
      );
    }

    .swap-dir-btn {
      position: relative;
      z-index: 1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(7,7,9,.80);
      border: 1px solid rgba(156,61,187,.24);
      color: var(--em-2);
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 0 4px rgba(7,7,9,.80);
      transition:
        background    180ms var(--ease-std),
        border-color  180ms var(--ease-std),
        box-shadow    180ms var(--ease-std);
    }
    .swap-dir-btn::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid transparent;
      transition: border-color 180ms var(--ease-std);
    }
    .swap-dir-btn:hover {
      background: rgba(156,61,187,.14);
      border-color: rgba(156,61,187,.55);
      box-shadow: 0 0 0 4px rgba(7,7,9,.80), 0 0 16px rgba(156,61,187,.22);
    }
    .swap-dir-btn:hover::after {
      border-color: rgba(156,61,187,.12);
    }
    .swap-dir-btn:active {
      transform: scale(.88);
      transition: transform 80ms var(--ease-spr);
    }
    .swap-dir-btn:focus-visible {
      outline: 1.5px solid rgba(156,61,187,.50);
      outline-offset: 4px;
    }

    /* ── META ROW — rate + fee ── */
    .swap-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 2px;
      min-height: 18px;
    }

    .swap-rate {
      font-family: var(--fm);
      font-size: .70rem;
      letter-spacing: .02em;
      color: var(--dim);
      line-height: 1;
      transition: color 200ms var(--ease-std);
    }
    .swap-rate.has-rate { color: var(--bd); }

    /* Gas estimate — revealed after quote resolves, hidden on reset */
    .swap-gas {
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1;
    }

    /* UniswapX routing indicator — hidden until Dutch Auction route resolves */
    .swap-routing {
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--em-2);
      line-height: 1;
    }

    /* ── PRICE IMPACT — hidden until > 1% ── */
    .swap-impact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(220,180,40,.04);
      border: 1px solid rgba(220,180,40,.12);
      box-shadow: inset 0 1px 0 rgba(220,180,40,.06);
    }
    .swap-impact.high {
      background: rgba(220,80,80,.05);
      border-color: rgba(220,80,80,.16);
      box-shadow: inset 0 1px 0 rgba(220,80,80,.06);
    }

    .swap-impact-label {
      font-family: var(--fm);
      font-size: .50rem;
      letter-spacing: .44em;
      text-transform: uppercase;
      color: var(--warn);
      line-height: 1;
    }
    .swap-impact.high .swap-impact-label { color: var(--dn); }

    .swap-impact-value {
      font-family: var(--fm);
      font-size: .72rem;
      letter-spacing: .02em;
      color: var(--warn);
      line-height: 1;
    }
    .swap-impact.high .swap-impact-value { color: var(--dn); }

    /* ── EXECUTE BUTTON — full width, btn-primary ── */
    .swap-execute {
      width: 100%;
      display: flex;
      margin-top: 6px;
    }
    .swap-execute .btn-inner {
      width: 100%;
      min-width: 0;
      padding: 17px 0;
    }
    /* Loading/confirming state: dim the text, no pointer */
    .swap-execute.confirming .btn-inner span { opacity: .55; }
    .swap-execute.confirming { pointer-events: none; }

    /* ── SUCCESS STATE ── */
    .swap-success {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      flex: 1;
      padding: var(--sp-5) var(--sp-4);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }

    .success-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(52,211,153,.06);
      border: 1px solid rgba(52,211,153,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 24px rgba(52,211,153,.10);
    }

    .success-check  { display: block; overflow: visible; }

    .check-line {
      stroke-dasharray: 52;
      stroke-dashoffset: 52;
    }

    .success-label {
      font-family: var(--fd);
      font-size: 1.4rem;
      letter-spacing: .08em;
      color: var(--br);
      line-height: 1;
    }

    .success-sublabel {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: -8px;
    }

    .success-hash {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .04em;
      color: var(--bd);
      word-break: break-all;
      max-width: 320px;
      opacity: .60;
      padding: 10px 14px;
      background: rgba(156,61,187,.03);
      border: 1px solid var(--trace);
      border-radius: 6px;
      width: 100%;
    }

    .success-etherscan {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--em-2);
      text-decoration: none;
      opacity: 0;
      transition: opacity 240ms var(--ease-out);
    }
    .success-etherscan.visible  { opacity: 1; }
    .success-etherscan:hover    { text-decoration: underline; }

    .swap-again {
      align-self: center;
      opacity: 0;
      transition: opacity 240ms var(--ease-out);
    }
    .swap-again.visible { opacity: 1; }

    /* ── SKELETON — loading state ── */
    .swap-skeleton {
      max-width: 440px;
      width: 100%;
      border-radius: 14px;
      background: rgba(7,7,9,.45);
      border: 1px solid rgba(156,61,187,.13);
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }
    .swap-skel-slot  { height: 90px; border-radius: 10px; }
    .swap-skel-dir   { height: 32px; border-radius: 0; background: transparent !important; animation: none !important; }
    .swap-skel-btn   { height: 54px; margin-top: 6px; }

    /* ── ERROR STATE ── */
    .swap-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-5) var(--sp-4);
      text-align: center;
    }
    .swap-error-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .30em;
      text-transform: uppercase;
      color: var(--dn);
    }
    .swap-retry {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--trace);
      color: var(--dim);
      padding: 6px 16px;
      cursor: none;
      transition: border-color 120ms var(--ease-std), color 120ms var(--ease-std);
    }
    .swap-retry:hover { border-color: var(--em-lo); color: var(--em-2); }

    /* ══════════════════════════════════════════════════════════════
       EXPLORE TAB
       Market browse. CoinGecko data. Search + chain filter +
       category tabs + sortable columns. In-place price updates.
       Reuses .asset-row / .asset-row-* from core.css.
       ══════════════════════════════════════════════════════════════ */

    .explore-view {
      display: flex;
      flex-direction: column;
      height: 100%;       /* fills #mobile-explore which is position:absolute;inset:0 */
      padding-top: var(--sp-3);
      overflow: hidden;   /* prevents the view itself from scrolling; padding-bottom moves to .explore-list */
    }

    .explore-search-row {
      padding: 0 var(--sp-3) 10px;
    }
    .explore-search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--trace);
      border: 1px solid rgba(156,61,187,.18);
      border-radius: 12px;
      padding: 0 12px;
      height: 40px;
      transition: border-color 160ms var(--ease-std), box-shadow 160ms var(--ease-std);
    }
    .explore-search-wrap:focus-within {
      border-color: var(--em-lo);
      box-shadow: 0 0 0 2px var(--em-dim);
    }
    .explore-search-icon { flex-shrink:0; opacity:.45; pointer-events:none; }
    .explore-search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--br);
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .02em;
      min-width: 0;
    }
    .explore-search-input::placeholder { color: var(--dim); opacity:.65; }
    .explore-search-clear {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      padding: 4px;
      cursor: none;
      color: var(--dim);
      border-radius: 50%;
      opacity: .55;
      flex-shrink: 0;
      transition: opacity 120ms var(--ease-std), color 120ms var(--ease-std);
    }
    .explore-search-clear:hover { opacity:1; color:var(--br); }

    .explore-chain-pills {
      display: flex;
      gap: 6px;
      padding: 0 var(--sp-3) 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .explore-chain-pills::-webkit-scrollbar { display:none; }
    .explore-chain-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(156,61,187,.20);
      background: transparent;
      color: var(--dim);
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: none;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: color 140ms var(--ease-std), border-color 140ms var(--ease-std), background 140ms var(--ease-std);
    }
    .explore-chain-pill:hover  { color:var(--em-2); border-color:var(--em-lo); }
    .explore-chain-pill.active { color:var(--br); border-color:var(--em-lo); background:rgba(156,61,187,.10); }
    /* ── Chain pill image logo ── */
    .ex-pill-img {
      width: 18px; height: 18px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .ex-pill-fb {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .44rem;
      font-weight: 700;
      color: #fff;
      font-family: var(--fd);
      letter-spacing: 0;
      text-transform: none;
    }
    .ex-pill-name {
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .explore-categories {
      display: flex;
      padding: 0 var(--sp-3);
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      border-bottom: 1px solid var(--trace);
      margin-bottom: 2px;
    }
    .explore-categories::-webkit-scrollbar { display:none; }
    .explore-cat {
      padding: 6px 12px 7px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--dim);
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .20em;
      text-transform: uppercase;
      cursor: none;
      white-space: nowrap;
      flex-shrink: 0;
      margin-bottom: -1px;
      -webkit-tap-highlight-color: transparent;
      transition: color 140ms var(--ease-std), border-color 140ms var(--ease-std);
    }
    .explore-cat:hover  { color:var(--em-2); }
    .explore-cat.active { color:var(--br); border-bottom-color:var(--em); }

    .explore-col-header {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: var(--sp-3);
      align-items: center;
      padding: 8px var(--sp-3) 6px;
    }
    .explore-col-token {
      font-family: var(--fm);
      font-size: .46rem;
      letter-spacing: .36em;
      text-transform: uppercase;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .explore-count-badge {
      font-family: var(--fm);
      font-size: .46rem;
      letter-spacing: .08em;
      color: var(--em-2);
      opacity: .65;
    }
    .explore-col-sortable {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--fm);
      font-size: .46rem;
      letter-spacing: .36em;
      text-transform: uppercase;
      color: var(--dim);
      cursor: none;
      user-select: none;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: color 140ms var(--ease-std);
    }
    .explore-col-sortable:hover      { color:var(--em-2); }
    .explore-col-sortable.sort-active { color:var(--br); }
    .explore-col-price  { min-width:60px; justify-content:flex-end; }
    .explore-col-change { min-width:44px; justify-content:flex-end; }

    .explore-sort-arrow {
      display: inline-flex;
      align-items: center;
      opacity: .35;
      transition: opacity 140ms var(--ease-std);
    }
    .explore-col-sortable:hover       .explore-sort-arrow { opacity:.65; }
    .explore-col-sortable.sort-active .explore-sort-arrow { opacity:1; }
    .sort-up-path, .sort-dn-path { stroke: currentColor; }
    .explore-col-sortable.sort-desc .sort-up-path { opacity:1; }
    .explore-col-sortable.sort-desc .sort-dn-path { opacity:.25; }
    .explore-col-sortable.sort-asc  .sort-up-path { opacity:.25; }
    .explore-col-sortable.sort-asc  .sort-dn-path { opacity:1; }

    .explore-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(156,61,187,.18) transparent;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); /* scroll room below last row — safe area + nav height */
    }
    .explore-list::-webkit-scrollbar       { width:3px; }
    .explore-list::-webkit-scrollbar-track { background:transparent; }
    .explore-list::-webkit-scrollbar-thumb { background:rgba(156,61,187,.20); border-radius:99px; }

    .explore-row { cursor:none; }
    .explore-arrow { font-size:.50rem; margin-right:2px; vertical-align:baseline; line-height:1; }

    /* ── Chain badge on token logo (bottom-right overlay) ── */
    .explore-logo-wrap {
      position: relative;        /* needed for badge positioning */
    }
    .explore-badge-wrap {
      position: absolute;
      bottom: -3px; right: -3px;
      display: flex;
    }
    .ex-badge {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1.5px solid rgba(10,10,18,1);
      object-fit: cover;
      display: block;
    }
    .ex-badge-fb {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .36rem;
      font-weight: 700;
      color: #fff;
      font-family: var(--fd);
      letter-spacing: 0;
    }

    .explore-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      padding: var(--sp-6) var(--sp-4);
      color: var(--dim);
      font-family: var(--fm);
      font-size: .66rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-align: center;
      min-height: 180px;
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 5 (swap.js rewrite) — CHAIN CHIPS + PCT BUTTONS
       Replaces .swap-network-bar with inline chain selector.
       Adds 25% / 50% / MAX buttons below FROM slot.
       ══════════════════════════════════════════════════════════════ */

    /* ── Chain chip row (sits above .swap-card inside .swap-view) ── */
    .swap-chain-chips {
      max-width: 440px;
      width: 100%;
      display: flex;
      gap: var(--sp-2);
      overflow-x: auto;
      padding: 0 2px var(--sp-2);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .swap-chain-chips::-webkit-scrollbar { display: none; }

    .swap-chain-chip {
      flex-shrink: 0;
      height: 26px;
      padding: 0 var(--sp-3);
      border-radius: 13px;
      border: 1px solid var(--trace);
      background: transparent;
      font-family: var(--fm);
      font-size: .54rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      cursor: none;
      white-space: nowrap;
      transition:
        border-color 140ms var(--ease-std),
        color        140ms var(--ease-std),
        background   140ms var(--ease-std),
        opacity      120ms var(--ease-std);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .swap-chain-chip:hover {
      border-color: var(--em-lo);
      color: var(--em-2);
    }
    .swap-chain-chip.active {
      border-color: var(--em);
      background: rgba(156,61,187,.10);
      color: var(--em-2);
    }
    .swap-chain-chip.switching {
      opacity: .35;
      pointer-events: none;
    }

    /* ── Picker chain chips (inside token picker overlay) ── */
    .picker-chain-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: var(--sp-3);
    }
    .picker-chain-chips::-webkit-scrollbar { display: none; }

    .picker-chain-chip {
      flex-shrink: 0;
      height: 24px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1px solid var(--trace);
      background: transparent;
      font-family: var(--fm);
      font-size: .50rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      cursor: pointer;
      white-space: nowrap;
      transition:
        border-color 140ms var(--ease-std),
        color        140ms var(--ease-std),
        background   140ms var(--ease-std),
        opacity      120ms var(--ease-std);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .picker-chain-chip:active {
      border-color: var(--em-lo);
      color: var(--em-2);
    }
    .picker-chain-chip.active {
      border-color: var(--em);
      background: rgba(156,61,187,.10);
      color: var(--em-2);
    }
    .picker-chain-chip.switching {
      opacity: .35;
      pointer-events: none;
    }

    /* ── FROM section wrapper (label + slot + pct row stacked) ── */
    .swap-from-section { display: block; }

    /* ── 25% / 50% / MAX percentage fill buttons ── */
    .swap-pct-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .swap-pct-btn {
      flex: 1;
      height: 26px;
      border: 1px solid var(--trace);
      border-radius: 6px;
      background: transparent;
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: .20em;
      text-transform: uppercase;
      color: var(--dim);
      cursor: none;
      transition:
        border-color 120ms var(--ease-std),
        color        120ms var(--ease-std),
        background   120ms var(--ease-std),
        transform     80ms var(--ease-spr);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .swap-pct-btn:hover {
      border-color: var(--em-lo);
      color: var(--em-2);
      background: rgba(156,61,187,.06);
    }
    .swap-pct-btn:active {
      transform: scale(.93);
      transition: transform 60ms var(--ease-spr);
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 5A — TOKEN PICKER OVERLAY
       ══════════════════════════════════════════════════════════════ */

    .token-picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.68);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms var(--ease-std);
    }
    .token-picker-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .token-picker {
      width: 380px;
      max-width: calc(100vw - 32px);
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      overflow: hidden;
      transform: translateY(14px) scale(.97);
      opacity: 0;
      transition:
        transform 220ms var(--ease-spr),
        opacity   180ms var(--ease-std);
    }
    .token-picker-overlay.open .token-picker {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .token-picker-header {
      padding: var(--sp-4) var(--sp-4) var(--sp-3);
      border-bottom: 1px solid var(--trace);
      flex-shrink: 0;
    }

    .token-picker-title {
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: .52em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: var(--sp-2);
      line-height: 1;
    }

    .token-picker-search { border-radius: 6px; }

    .token-picker-list   { flex: 1; overflow-y: auto; }

    /* ── Picker token rows ── */
    .picker-token-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: none;
      border-bottom: 1px solid var(--trace);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 120ms var(--ease-std);
    }
    .picker-token-row:hover            { background: var(--hi); }
    .picker-token-row:active           { background: var(--em-tr); transition: background 80ms var(--ease-spr); }
    .picker-token-row:focus-visible    { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: -1.5px; }
    .picker-token-row.selected         { opacity: .35; pointer-events: none; }

    .picker-token-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    .picker-token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: 0;
      color: #fff;
      flex-shrink: 0;
    }

    .picker-token-info { flex: 1; min-width: 0; }

    .picker-token-name {
      display: block;
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .02em;
      color: var(--br);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      line-height: 1.1;
    }

    .picker-token-symbol {
      display: block;
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--em-2);
      line-height: 1;
    }

    .picker-token-price {
      font-family: var(--fm);
      font-size: .72rem;
      letter-spacing: .02em;
      color: var(--bd);
      flex-shrink: 0;
      line-height: 1;
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 6C — MOBILE WALLET PILL
       ══════════════════════════════════════════════════════════════ */

    .mobile-wallet-pill {
      height: 30px;
      padding: 0 13px;
      border-radius: 15px;
      border: 1px solid var(--em-lo);
      color: var(--em-2);
      background: rgba(156,61,187,.06);
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 76px;
      max-width: 120px;
      flex-shrink: 0;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      text-overflow: ellipsis;
      transition:
        border-color  140ms var(--ease-std),
        background    140ms var(--ease-std),
        color         140ms var(--ease-std),
        box-shadow    200ms var(--ease-std);
    }
    .mobile-wallet-pill:hover {
      border-color: var(--em);
      background: rgba(156,61,187,.10);
      box-shadow: 0 0 14px rgba(156,61,187,.16);
    }
    .mobile-wallet-pill:active {
      transform: scale(.93);
      transition: transform 80ms var(--ease-spr);
    }
    .mobile-wallet-pill:focus-visible {
      outline: 1.5px solid rgba(156,61,187,.50);
      outline-offset: 2px;
    }
    .mobile-wallet-pill.disconnected {
      border-color: var(--trace);
      color: var(--dim);
      background: transparent;
    }
    .mobile-wallet-pill.disconnected:hover {
      border-color: var(--em-lo);
      color: var(--em-2);
      background: rgba(156,61,187,.04);
      box-shadow: none;
    }
    #mobile-wallet-label {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 108px;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 6C — WALLET BOTTOM SHEET
       ══════════════════════════════════════════════════════════════ */

    /* Dim overlay — behind sheet, above everything else */
    #wallet-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.62);
      z-index: 399;
      opacity: 0;
      transition: opacity 240ms var(--ease-out);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }

    /* Sheet — slides up from bottom, glass-m */
    #wallet-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 400;
      border-radius: 20px 20px 0 0;
      max-height: 80vh;
      overflow-y: auto;
      overflow-x: hidden;
      transform: translateY(100%);
      transition: transform 320ms var(--ease-spr);
      /* ultra-thin scrollbar */
      scrollbar-width: thin;
      scrollbar-color: rgba(156,61,187,.18) transparent;
    }
    #wallet-sheet::-webkit-scrollbar       { width: 2px; }
    #wallet-sheet::-webkit-scrollbar-track { background: transparent; }
    #wallet-sheet::-webkit-scrollbar-thumb { background: rgba(156,61,187,.18); border-radius: 1px; }

    #wallet-sheet.panel-visible { transform: translateY(0); }

    /* Drag handle */
    .wsh-handle {
      width: 34px;
      height: 3px;
      background: var(--trace);
      border-radius: 2px;
      margin: 14px auto 4px;
      flex-shrink: 0;
      pointer-events: none;
    }

    /* Section — consistent padding + divider */
    .wsh-section {
      padding: 16px 20px 18px;
      border-bottom: 1px solid var(--trace);
    }
    .wsh-section:last-of-type { border-bottom: none; }

    /* Eyebrow label */
    .wsh-label {
      display: block;
      font-family: var(--fm);
      font-size: .50rem;
      letter-spacing: .52em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 10px;
      line-height: 1;
      opacity: .70;
    }

    /* ── Identity section ── */
    .wsh-id-addr {
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .04em;
      color: var(--dim);
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .wsh-subname {
      font-family: var(--fm);
      font-size: .92rem;
      letter-spacing: .03em;
      color: var(--em-2);
      line-height: 1.2;
      margin-bottom: 5px;
    }

    .wsh-subname-note {
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1;
      opacity: .65;
    }

    /* Claim prompt */
    .wsh-claim-prompt {
      display: flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      border: none;
      color: var(--em-2);
      font-family: var(--fm);
      font-size: .66rem;
      letter-spacing: .06em;
      padding: 0;
      cursor: none;
      -webkit-tap-highlight-color: transparent;
      opacity: .68;
      transition: opacity 140ms var(--ease-std);
      text-align: left;
    }
    .wsh-claim-prompt:hover  { opacity: 1; }
    .wsh-claim-prompt:active { opacity: .50; }
    .wsh-claim-arrow {
      display: inline-block;
      transition: transform 220ms var(--ease-spr);
      flex-shrink: 0;
    }
    .wsh-claim-prompt.expanded .wsh-claim-arrow { transform: rotate(90deg); }

    /* Claim form — appears below prompt on expand */
    .wsh-claim-form {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      animation: wshFormIn 220ms var(--ease-spr);
    }
    @keyframes wshFormIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ENS input + suffix row */
    .wsh-ens-row {
      display: flex;
      align-items: stretch;
    }

    .wsh-ens-input {
      flex: 1;
      min-width: 0;
      background: rgba(156,61,187,.04) !important;
      border: 1px solid rgba(156,61,187,.14) !important;
      border-right: none !important;
      border-radius: 7px 0 0 7px !important;
      font-family: var(--fm) !important;
      font-size: .76rem !important;
      letter-spacing: .02em !important;
      color: var(--br) !important;
      padding: 9px 11px !important;
      box-shadow: none !important;
      outline: none !important;
      transition: border-color 140ms var(--ease-std) !important;
      caret-color: var(--em-2) !important;
    }
    .wsh-ens-input:focus {
      border-color: rgba(156,61,187,.32) !important;
      background: rgba(156,61,187,.06) !important;
    }
    .wsh-ens-input::placeholder {
      color: rgba(222,228,244,.18);
      opacity: 1;
    }

    .wsh-ens-suffix {
      display: flex;
      align-items: center;
      padding: 0 11px;
      font-family: var(--fm);
      font-size: .66rem;
      letter-spacing: .02em;
      color: var(--dim);
      background: rgba(156,61,187,.03);
      border: 1px solid rgba(156,61,187,.14);
      border-left: none;
      border-radius: 0 7px 7px 0;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1;
    }

    /* Availability status line */
    .wsh-ens-status {
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: .08em;
      min-height: 14px;
      line-height: 1;
      transition: opacity 160ms var(--ease-std);
    }
    .wsh-ens-status.available { color: var(--up); }
    .wsh-ens-status.taken     { color: var(--dn); }
    .wsh-ens-status.checking  { color: var(--dim); }

    .wsh-register-btn {
      width: 100%;
      padding: 12px 0;
      text-align: center;
    }
    .wsh-register-btn:disabled {
      opacity: .30;
      pointer-events: none;
    }

    /* ── Address section ── */
    .wsh-address-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .wsh-full-addr {
      font-family: var(--fm);
      font-size: .70rem;
      letter-spacing: .03em;
      color: var(--bd);
      word-break: break-all;
      line-height: 1.55;
      flex: 1;
      min-width: 0;
    }

    .wsh-copy-btn {
      font-family: var(--fm);
      font-size: .50rem;
      letter-spacing: .28em;
      padding: 6px 10px;
      flex-shrink: 0;
      color: var(--dim);
      border: 1px solid var(--trace);
      background: transparent;
      cursor: none;
      -webkit-tap-highlight-color: transparent;
      transition:
        color        120ms var(--ease-std),
        border-color 120ms var(--ease-std),
        background   120ms var(--ease-std);
    }
    .wsh-copy-btn:hover { color: var(--bd); border-color: rgba(156,61,187,.22); }
    .wsh-copy-btn.copied {
      color: var(--up) !important;
      border-color: rgba(52,211,153,.30) !important;
      background: rgba(52,211,153,.05) !important;
    }

    /* ── Trades section ── */
    .wsh-trade-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--trace);
    }
    .wsh-trade-row:last-child { border-bottom: none; }

    .wsh-trade-pair {
      font-family: var(--fm);
      font-size: .74rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wsh-trade-amount {
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: .03em;
      color: var(--dim);
      line-height: 1;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .wsh-trade-time {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1;
      white-space: nowrap;
      flex-shrink: 0;
      opacity: .60;
    }

    .wsh-trade-link {
      font-size: .68rem;
      color: var(--em-2);
      text-decoration: none;
      opacity: .50;
      flex-shrink: 0;
      transition: opacity 120ms var(--ease-std);
      line-height: 1;
    }
    .wsh-trade-link:hover { opacity: 1; }

    .wsh-view-all-btn {
      width: 100%;
      margin-top: 14px;
      padding: 10px 0;
      text-align: center;
      font-size: .54rem;
      letter-spacing: .30em;
      color: var(--em-2);
      border: 1px solid var(--em-lo);
      background: transparent;
      cursor: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 120ms var(--ease-std), background 120ms var(--ease-std);
    }
    .wsh-view-all-btn:hover { border-color: var(--em); background: rgba(156,61,187,.06); }

    /* ── Network section ── */
    .wsh-network-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wsh-network-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .wsh-net-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: rgba(156,61,187,.30);
      transition: background 300ms var(--ease-std), box-shadow 300ms var(--ease-std);
    }
    .wsh-net-dot.ok {
      background: var(--up);
      box-shadow: 0 0 6px 1px rgba(52,211,153,.40);
    }
    .wsh-net-dot.warn {
      background: var(--warn);
      box-shadow: 0 0 6px 1px rgba(220,180,40,.40);
    }

    .wsh-net-name {
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .04em;
      color: var(--bd);
      line-height: 1;
    }
    .wsh-net-name.warn { color: var(--warn); }

    .wsh-switch-btn {
      font-family: var(--fm);
      font-size: .50rem;
      letter-spacing: .24em;
      padding: 6px 10px;
      color: var(--em-2);
      border: 1px solid var(--em-lo);
      background: transparent;
      cursor: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      transition:
        border-color 120ms var(--ease-std),
        background   120ms var(--ease-std);
    }
    .wsh-switch-btn:hover    { border-color: var(--em); background: rgba(156,61,187,.06); }
    .wsh-switch-btn:active   { opacity: .65; transition: opacity 80ms var(--ease-spr); }
    .wsh-switch-btn:disabled { opacity: .28; pointer-events: none; }

    /* ── Connected via section ── */
    .wsh-via-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wsh-via-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(156,61,187,.45);
      flex-shrink: 0;
    }

    .wsh-via-name {
      font-family: var(--fm);
      font-size: .72rem;
      letter-spacing: .04em;
      color: var(--dim);
      line-height: 1;
    }

    /* ── State A — connect section ── */
    .wsh-connect-section {
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .wsh-connect-eyebrow {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .44em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1;
    }

    .wsh-connect-btn {
      width: 100%;
      max-width: 300px;
      padding: 17px 0;
      text-align: center;
      font-size: .72rem;
      letter-spacing: .34em;
    }

    /* ── Disconnect button — full width, bottom of sheet ── */
    .wsh-disconnect-btn {
      display: block;
      width: calc(100% - 40px);
      margin: 10px 20px;
      margin-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }
    .wsh-disconnect-btn .btn-inner {
      width: 100%;
      min-width: 0;
      padding: 14px 0;
      justify-content: center;
    }

    /* Shake on invalid ENS input */
    @keyframes wsh-shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-5px); }
      40%      { transform: translateX(5px); }
      60%      { transform: translateX(-3px); }
      80%      { transform: translateX(3px); }
    }
    .wsh-shake { animation: wsh-shake 380ms var(--ease-std); }

  /* ══════════════════════════════════════════════════════════════════
     GATE SCREEN
     Guards app entry until wallet is confirmed.
     z-index 400: above canvases (1,2), app overlays, below loading (500) and cursor (999).
     Background: exact match of html,body in core.css — seamless visual.
  ══════════════════════════════════════════════════════════════════ */

  #gate {
    position: fixed;
    inset: 0;
    z-index: 400;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--void);
    background-image:
      radial-gradient(ellipse 75% 55% at 18% 85%, rgba(156,61,187,.18) 0%, transparent 58%),
      radial-gradient(ellipse 65% 48% at 82% 14%, rgba(100,30,140,.14) 0%, transparent 52%),
      radial-gradient(ellipse 90% 35% at 50% 50%, rgba(60,10,80,.10)   0%, transparent 62%);
    transition: opacity 700ms var(--ease-out);
    will-change: opacity;
    cursor: none;
  }

  /* Fade-out state — opacity 0 but still in layout until gate-gone removes it */
  #gate.gate-off {
    opacity: 0;
    pointer-events: none;
  }

  /* Removed from layout — stops any residual interaction blocking */
  #gate.gate-gone {
    display: none;
  }

  /* ── Mark SVG ── */
  .gate-mark-svg {
    width: 160px;
    height: 160px;
    overflow: visible;
    display: block;
  }

  /* Inner group — opacity and rotation animated by JS */
  #gm-inner {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: rotate(0deg);
  }

  /* Diagonal lines — hidden via dashoffset, revealed by JS */
  .gate-dl {
    stroke-dasharray: 32;
    stroke-dashoffset: 32;
  }

  /* Corner squares — hidden, revealed by flashCorner() */
  .gate-cs { opacity: 0; }

  /* Outer frame lines — hidden via dashoffset, revealed by JS */
  .gate-of {
    stroke-dasharray: 76;
    stroke-dashoffset: 76;
    fill: none;
  }

  /* ── Wordmark — fades in after outer frame completes ── */
  .gate-wordmark {
    font-family: var(--fd);
    font-weight: 400;
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    letter-spacing: .34em;
    color: var(--br);
    line-height: 1;
    margin-top: var(--sp-5);
    text-indent: .34em; /* visual centering compensation for letter-spacing */
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 1000ms var(--ease-out), transform 1000ms var(--ease-out);
  }
  .gate-wordmark.wm-on {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Connect button wrapper ── */
  .gate-btn-wrap {
    margin-top: var(--sp-6);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
  }
  .gate-btn-wrap.btn-on {
    opacity: 1;
    transform: translateY(0);
  }

  </style>
</head>
<body>

<!-- Custom cursor — desktop only -->
<div id="cur"></div>

<!-- Toast container -->
<div id="toast-wrap"></div>

<!-- Canvas layers -->
<canvas id="crystal-canvas"></canvas>
<canvas id="particle-canvas"></canvas>

<!-- ── Gate Screen — guards app entry until wallet is confirmed ──── -->
<div id="gate">

  <!-- Mark — geometry and animation exact from OBS-LOGO.html -->
  <svg class="gate-mark-svg" id="gate-mark-svg" viewBox="0 0 100 100" fill="none">

    <!-- Diagonal lines: inner corners → outer frame corners -->
    <!-- TL: inner(34,34) → outer(12,12) -->
    <line class="gate-dl" id="gm-dl0" x1="34" y1="34" x2="12" y2="12" stroke="#F0EDE8" stroke-width="0.5"/>
    <!-- TR: inner(66,34) → outer(88,12) -->
    <line class="gate-dl" id="gm-dl1" x1="66" y1="34" x2="88" y2="12" stroke="#F0EDE8" stroke-width="0.5"/>
    <!-- BR: inner(66,66) → outer(88,88) -->
    <line class="gate-dl" id="gm-dl2" x1="66" y1="66" x2="88" y2="88" stroke="#F0EDE8" stroke-width="0.5"/>
    <!-- BL: inner(34,66) → outer(12,88) -->
    <line class="gate-dl" id="gm-dl3" x1="34" y1="66" x2="12" y2="88" stroke="#F0EDE8" stroke-width="0.5"/>

    <!-- Outer frame: TL→TR, TR→BR, BR→BL, BL→TL — all 4 simultaneously -->
    <line class="gate-of" id="gm-of0" x1="12" y1="12" x2="88" y2="12" stroke="#F0EDE8" stroke-width="1.5"/>
    <line class="gate-of" id="gm-of1" x1="88" y1="12" x2="88" y2="88" stroke="#F0EDE8" stroke-width="1.5"/>
    <line class="gate-of" id="gm-of2" x1="88" y1="88" x2="12" y2="88" stroke="#F0EDE8" stroke-width="1.5"/>
    <line class="gate-of" id="gm-of3" x1="12" y1="88" x2="12" y2="12" stroke="#F0EDE8" stroke-width="1.5"/>

    <!-- Corner squares — flashed by JS on frame arrival -->
    <rect class="gate-cs" id="gm-cs0" x="8.5"  y="8.5"  width="7" height="7" fill="#F0EDE8"/>
    <rect class="gate-cs" id="gm-cs1" x="84.5" y="8.5"  width="7" height="7" fill="#F0EDE8"/>
    <rect class="gate-cs" id="gm-cs2" x="84.5" y="84.5" width="7" height="7" fill="#F0EDE8"/>
    <rect class="gate-cs" id="gm-cs3" x="8.5"  y="84.5" width="7" height="7" fill="#F0EDE8"/>

    <!-- Inner square — facets built at runtime by gate boot script -->
    <g id="gm-inner">
      <rect x="34" y="34" width="32" height="32" stroke="#F0EDE8" stroke-width="1.5" fill="none"/>
    </g>

  </svg>

  <!-- Wordmark — appears as outer frame completes -->
  <div class="gate-wordmark" id="gate-wordmark">OBSIDEUM</div>

  <!-- Connect Wallet — revealed after Privy confirms no existing session -->
  <div class="gate-btn-wrap" id="gate-btn-wrap">
    <button class="btn btn-white" id="gate-connect-btn" type="button"
      aria-label="Connect your wallet to enter OBSIDEUM">
      <div class="btn-pulse-ring"></div>
      <div class="btn-inner">
        <div class="glass-sheen"></div>
        <span>CONNECT WALLET</span>
      </div>
    </button>
  </div>

</div>

<!-- ── DESKTOP LAYOUT (≥ 768px) ─────────────────────────────────── -->
<div id="app-desktop" class="app-desktop">

  <aside id="sidebar" class="sidebar glass-m">

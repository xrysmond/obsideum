        </svg>
        <span class="nav-label">Settings</span>
      </button>
    </nav>
  </aside>

  <div id="content-area" class="content-area">

    <div id="markets-layout" class="markets-layout">

      <div id="token-list-col" class="token-list-col">
        <div id="portfolio-main" class="portfolio-main">
          <!-- Rendered by portfolio.js -->
        </div>
      </div>

      <div id="right-panel" class="right-panel glass-m" hidden>
        <div id="right-panel-content" class="panel-content">
          <div class="panel-null-state" id="panel-null">
            <span class="panel-null-label">Select a token to begin</span>
          </div>

    </div>

    <div id="settings-layout" class="settings-layout" hidden></div>

      <div class="accounts-inner"><!-- mountAccountsTab() renders here --></div>

  </div>
</div>

<!-- ── MOBILE LAYOUT (< 768px) ──────────────────────────────────── -->
<div id="app-mobile" class="app-mobile">

  <div id="mobile-top-bar" class="mobile-top-bar">
    <button id="mobile-back" class="mobile-back" aria-label="Back">

    </button>
    <span class="mobile-wordmark">OBSIDEUM</span>
    <div class="mobile-top-actions">
      <button id="mobile-settings-btn" class="mobile-icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20"
          fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

  <div id="mobile-content" class="mobile-content">
    <div id="mobile-portfolio" class="mobile-view">
      <!-- portfolio-balance-section and portfolio-assets-section rendered by portfolio.js -->
    </div>

<!-- ── Phase 8D — Navigation wiring refactor ──────────────────────── -->
<script>
(function () {
  'use strict';

  /* ─────────────────────────────────────────
     DOM REFS
  ───────────────────────────────────────── */
  var marketsLayout  = document.getElementById('markets-layout');
  var settingsLayout = document.getElementById('settings-layout');
  var accountsLayout = document.getElementById('desktop-accounts');
  var rightPanel     = document.getElementById('right-panel');
  var rightContent   = document.getElementById('right-panel-content');
  var panelNull      = document.getElementById('panel-null');
  var mobileBack     = document.getElementById('mobile-back');
  var mobileBottomNav = document.getElementById('mobile-bottom-nav');
  var mobileWordmark  = document.querySelector('.mobile-wordmark');
  var sidebarWallet  = document.getElementById('sidebar-wallet');
  var sidebarNetwork = document.getElementById('sidebar-network');

  /* ─────────────────────────────────────────
     CONSTANTS
  ───────────────────────────────────────── */
  var TAB_KEYS = ['portfolio', 'explore', 'swap', 'accounts'];

  var NETWORK_NAMES = {
    1:        'Ethereum',
    10:       'Optimism',
    56:       'BNB Chain',
    130:      'Unichain',
    137:      'Polygon',
    8453:     'Base',
    42161:    'Arbitrum One',
    43114:    'Avalanche',
    11155111: 'Sepolia',
  };

  /* ─────────────────────────────────────────
     MOBILE STATE
     currentSubView: active sub-view key or null (null = tab is showing)
     prevSubView:    sub-view we came from — used by back stack
  ───────────────────────────────────────── */
  var currentSubView = null;
  var prevSubView    = null;

  /* ─────────────────────────────────────────
     HELPERS
  ───────────────────────────────────────── */
  function truncateAddress(addr) {
    return addr ? addr.slice(0, 6) + '...' + addr.slice(-4) : '';
  }

  function hideAllMobileViews() {
    document.querySelectorAll('.mobile-view').forEach(function (el) {
      el.hidden = true;
    });
  }

  /* ─────────────────────────────────────────
     MOBILE — Tab navigation
     Hides all views, shows tab view.
     Resets sub-view state. Updates STATE.mobileTab.
     Tab indicator tracks active tab.
  ───────────────────────────────────────── */
  function setMobileTab(tab) {
    hideAllMobileViews();

    var el = document.getElementById('mobile-' + tab);
    if (el) el.hidden = false;

    currentSubView = null;
    prevSubView    = null;

    /* Update both mobileTab (new) and mobileView (legacy — swap.js + chart scripts depend on it) */
    setState({ mobileTab: tab, mobileView: tab });
    updateMobileNavIndicator(tab);
    updateMobileTopBar(tab);

    if (mobileBottomNav) mobileBottomNav.classList.remove('nav-hidden');
    if (mobileBack)      mobileBack.classList.remove('visible');
  }

  /* ─────────────────────────────────────────
     MOBILE — Sub-view navigation
     Shows a non-tab view (token / send / receive / settings).
     Tab indicator does NOT change.
     Null → return to active tab.
  ───────────────────────────────────────── */
  function setMobileSubView(view) {
    if (view === null) {
      /* Return to active tab */
      hideAllMobileViews();
      var activeTab = STATE.mobileTab || 'portfolio';
      var tabEl = document.getElementById('mobile-' + activeTab);
      if (tabEl) tabEl.hidden = false;

      prevSubView    = currentSubView;
      currentSubView = null;

      /* Restore mobileView to active tab for legacy listeners */
      setState({ prevMobileView: STATE.mobileView, mobileView: activeTab });

      if (mobileBottomNav) mobileBottomNav.classList.remove('nav-hidden');
      if (mobileBack)      mobileBack.classList.remove('visible');
      updateMobileTopBar(activeTab);
      return;
    }

    /* Show sub-view */
    hideAllMobileViews();
    var subEl = document.getElementById('mobile-' + view);
    if (subEl) subEl.hidden = false;

    prevSubView    = currentSubView;
    currentSubView = view;

    /* Update mobileView for legacy listeners (chart scripts, token panel inject) */
    setState({ prevMobileView: STATE.mobileView, mobileView: view });

    if (mobileBottomNav) mobileBottomNav.classList.add('nav-hidden');
    if (mobileBack)      mobileBack.classList.add('visible');
    updateMobileTopBar(view);
  }

  function updateMobileNavIndicator(tab) {
    var items = Array.from(document.querySelectorAll('.mobile-nav-item'));
    items.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.mobileTab === tab);
    });
    var idx = TAB_KEYS.indexOf(tab);
    var indicator = document.getElementById('mobile-nav-indicator');
    if (indicator && idx > -1) {
      indicator.style.transform = 'translateX(' + (idx * 100) + '%)';
    }
  }

  function updateMobileTopBar(view) {
    if (!mobileWordmark) return;
    mobileWordmark.classList.remove('ctx-token', 'ctx-section');
    if (view === 'token') {
      var tList = window.STATE && STATE.tokenList;
      var match = tList && tList.find(function (t) { return t.address === STATE.token; });
      mobileWordmark.textContent = match ? match.symbol : 'OBSIDEUM';
      mobileWordmark.classList.add('ctx-token');
    } else if (view === 'settings') {
      mobileWordmark.textContent = 'SETTINGS';
      mobileWordmark.classList.add('ctx-section');
    } else {
      mobileWordmark.textContent = 'OBSIDEUM';
    }
  }

  /* ─────────────────────────────────────────
     DESKTOP — Right panel
     openRightPanel: removes hidden, animates in, dispatches panel:render.
     closeRightPanel: animates out, restores hidden.
  ───────────────────────────────────────── */
  function openRightPanel(type) {
    setState({ rightPanel: type });
    rightPanel.hidden = false;

    rightContent.classList.remove('leaving');
    void rightContent.offsetWidth; /* force reflow for animation restart */
    rightContent.classList.add('entering');
    setTimeout(function () { rightContent.classList.remove('entering'); }, 240);

    if (panelNull) panelNull.hidden = (type !== null);
    document.dispatchEvent(new CustomEvent('panel:render', { detail: type }));
    updateSidebarActive();
  }

  function closeRightPanel() {
    rightContent.classList.add('leaving');
    setTimeout(function () {
      rightContent.classList.remove('leaving');
      rightPanel.hidden = true;
      setState({ rightPanel: null });
      updateSidebarActive();
    }, 160);
  }

  /* ─────────────────────────────────────────
     DESKTOP — View routing
     setDesktopView maps sidebar data-view to the correct action.
  ───────────────────────────────────────── */
  function setDesktopView(view) {
    if (view === 'settings') {
      setState({ view: 'settings' });
      marketsLayout.style.display = 'none';
      settingsLayout.hidden       = false;
      if (accountsLayout) accountsLayout.hidden = true;
      closeRightPanel();
    } else if (view === 'accounts') {
      setState({ view: 'accounts' });
      marketsLayout.style.display = 'none';
      settingsLayout.hidden       = true;
      if (accountsLayout) {
        accountsLayout.hidden = false;
        /* mountAccountsTab targets the .accounts-inner wrapper so content
         * stays within the 520px max-width constraint */
        var inner = accountsLayout.querySelector('.accounts-inner');
        if (typeof mountAccountsTab === 'function') mountAccountsTab(inner || accountsLayout);
      }
      closeRightPanel();
    } else {
      setState({ view: 'markets' });
      marketsLayout.style.display = '';
      settingsLayout.hidden       = true;
      if (accountsLayout) accountsLayout.hidden = true;
      if      (view === 'portfolio') closeRightPanel();
      else if (view === 'swap')      openRightPanel('swap');
      else if (view === 'history')   openRightPanel('history');
    }
  }

  /* ─────────────────────────────────────────
     DESKTOP — Sidebar active state + indicator
  ───────────────────────────────────────── */
  function updateSidebarActive() {
    var panel      = STATE.rightPanel;
    var inSettings = settingsLayout && !settingsLayout.hidden;

    document.querySelectorAll('.sidebar-nav .nav-item').forEach(function (btn) {
      var dv = btn.dataset.view;
      var active;
      if (inSettings) {
        active = (dv === 'settings');
      } else if (accountsLayout && !accountsLayout.hidden) {
        active = (dv === 'accounts');
      } else {
        /* portfolio is active when panel is closed or showing a portfolio sub-context */
        active =
          (dv === 'portfolio' && (panel === null || panel === 'token' || panel === 'send' || panel === 'receive')) ||
          (dv === 'swap'      && panel === 'swap')    ||
          (dv === 'history'   && panel === 'history');
      }
      btn.classList.toggle('active', active);
    });
    updateSidebarIndicator();
  }

  function updateSidebarIndicator() {
    var indicator = document.getElementById('sidebar-nav-indicator');
    if (!indicator) return;
    var activeItem = document.querySelector('.sidebar-nav .nav-item.active');
    if (!activeItem) { indicator.style.opacity = '0'; return; }

    if (!indicator._ready) {
      indicator.style.transition = 'none';
      indicator.style.height     = activeItem.offsetHeight + 'px';
      indicator.style.transform  = 'translateY(' + activeItem.offsetTop + 'px)';
      indicator.style.opacity    = '1';
      indicator._ready = true;
      requestAnimationFrame(function () { indicator.style.transition = ''; });
      return;
    }
    indicator.style.opacity   = '1';
    indicator.style.height    = activeItem.offsetHeight + 'px';
    indicator.style.transform = 'translateY(' + activeItem.offsetTop + 'px)';
  }

  /* ─────────────────────────────────────────
     SIDEBAR — Wallet + network display
  ───────────────────────────────────────── */
  document.addEventListener('state:wallet', function (e) {
    var addr = e.detail;
    if (!sidebarWallet) return;
    sidebarWallet.textContent = addr ? truncateAddress(addr) : '';
    sidebarWallet.style.color = '';
    var dot = document.getElementById('swb-dot');
    if (dot) dot.classList.toggle('connected', !!addr);
  });

  document.addEventListener('state:ens', function (e) {
    var ens = e.detail;
    if (!ens || !STATE.wallet || !sidebarWallet) return;
    sidebarWallet.style.opacity = '0';
    setTimeout(function () {
      sidebarWallet.textContent   = ens;
      sidebarWallet.style.color   = 'var(--em-2)';
      sidebarWallet.style.opacity = '1';
    }, 100);
  });

  document.addEventListener('state:network', function (e) {
    var id = e.detail;
    if (!sidebarNetwork) return;
    sidebarNetwork.textContent = id ? (NETWORK_NAMES[id] || ('Chain ' + id)) : '';
    var wrong = id && STATE.settings && STATE.settings.defaultNetwork && id !== STATE.settings.defaultNetwork;
    sidebarNetwork.style.color = wrong ? 'var(--warn)' : '';
  });

  /* ─────────────────────────────────────────
     TOKEN NAVIGATION
     portfolio.js calls setState({ token }) on row tap.
     This wiring handles the navigation response.
  ───────────────────────────────────────── */
  document.addEventListener('state:token', function () {
    if (!STATE.token) return;
    if (window.innerWidth < 768) setMobileSubView('token');
    else                         openRightPanel('token');
    /* Update mobile top bar if already in token sub-view (symbol may have changed) */
    if (currentSubView === 'token') updateMobileTopBar('token');
  });

  /* ─────────────────────────────────────────
     ACTION BUTTONS
     Delegated click handler — works for portfolio and token detail buttons.
  ───────────────────────────────────────── */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.action-btn');
    if (!btn) return;
    var action    = btn.dataset.action;
    var fromToken = btn.dataset.fromToken === 'true';
    var isMobile  = window.innerWidth < 768;

    if (action === 'swap') {
      if (isMobile) setMobileTab('swap');
      else          openRightPanel('swap');
      /* swap.js reads STATE.token on mount — preselection handled there */
    }
    if (action === 'send') {
      if (isMobile) setMobileSubView('send');
      else          openRightPanel('send');
      document.dispatchEvent(new CustomEvent('send:mount', { detail: { fromToken: fromToken } }));
    }
    if (action === 'receive') {
      if (isMobile) setMobileSubView('receive');
      else          openRightPanel('receive');
      document.dispatchEvent(new CustomEvent('receive:mount'));
    }
  });

  /* ─────────────────────────────────────────
     CLICK HANDLERS — Desktop sidebar
  ───────────────────────────────────────── */
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var v = btn.dataset.view;
      if (v) setDesktopView(v);
    });
  });

  /* ─────────────────────────────────────────
     CLICK HANDLERS — Mobile bottom nav
  ───────────────────────────────────────── */
  document.querySelectorAll('.mobile-nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var tab = btn.dataset.mobileTab;
      if (tab) setMobileTab(tab);
    });
  });

  /* Mobile settings — sub-view (not a tab) */
  var mobileSettingsBtn = document.getElementById('mobile-settings-btn');
  if (mobileSettingsBtn) {
    mobileSettingsBtn.addEventListener('click', function () {
      setMobileSubView('settings');
    });
  }

  /* Mobile back — return to active tab when in a sub-view */
  if (mobileBack) {
    mobileBack.addEventListener('click', function () {
      if (currentSubView !== null) setMobileSubView(null);
    });
  }

  /* ─────────────────────────────────────────
     RESIZE — sidebar indicator + app height
  ───────────────────────────────────────── */
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  }

  window.addEventListener('resize', function () {
    updateSidebarIndicator();
    setAppHeight();
  });

  /* ─────────────────────────────────────────
     WINDOW EXPORTS
     Other modules call these directly rather than setState-routing.
  ───────────────────────────────────────── */
  window.setMobileTab     = setMobileTab;
  window.setMobileSubView = setMobileSubView;
  window.openRightPanel   = openRightPanel;
  window.closeRightPanel  = closeRightPanel;
  window.setDesktopView   = setDesktopView;

  /* ─────────────────────────────────────────
     INIT
  ───────────────────────────────────────── */
  setAppHeight();

  /* Desktop: markets layout visible, settings hidden, right panel already hidden (Phase 8B) */
  marketsLayout.style.display = '';
  settingsLayout.hidden = true;
  updateSidebarActive();
  requestAnimationFrame(updateSidebarIndicator);

  /* Mobile: default to portfolio tab */
  setMobileTab(STATE.mobileTab || 'portfolio');

}());
</script>

  function buildSkeletonRow() {
    var row = document.createElement('div');
    row.className = 'token-row token-row--skeleton';
    row.innerHTML =
      '<div class="token-row-logo">'
      +   '<div class="skeleton" style="width:28px;height:28px;border-radius:50%"></div>'
      + '</div>'
      + '<div class="token-row-info">'
      +   '<div class="skeleton" style="width:90px;height:11px;margin-bottom:6px"></div>'
      +   '<div class="skeleton" style="width:40px;height:9px"></div>'
      + '</div>'
      + '<div class="token-row-price">'
      +   '<div class="skeleton" style="width:72px;height:11px;margin-bottom:6px"></div>'
      +   '<div class="skeleton" style="width:48px;height:9px"></div>'
      + '</div>';
    return row;
  }

  function buildTokenRow(token, price) {
    var row = document.createElement('div');
    row.className = 'token-row';
    row.setAttribute('data-address', token.address);
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');

    var change      = price ? price.change24h : 0;
    var changeClass = change > 0 ? 'up' : change < 0 ? 'dn' : '';
    var changeText  = price ? formatChange(change) : '\u2014';
    var priceText   = price ? formatPrice(price.usd) : '\u2014';
    var volumeText  = ''; /* Phase 7C wires real volume — blank until then */
    var isUp        = change >= 0;

    row.innerHTML =
      '<div class="token-row-logo">'
      +   '<img class="token-logo" src="' + getLogoUrl(token.address) + '"'
      +   ' alt="' + token.symbol + '" width="28" height="28">'
      +   '<div class="token-logo-fallback" style="display:none">' + token.symbol[0] + '</div>'
      + '</div>'
      + '<div class="token-row-info">'
      +   '<span class="token-row-name">'   + token.name   + '</span>'
      +   '<span class="token-row-symbol">' + token.symbol + '</span>'
      +   '<span class="token-row-chain">Ethereum</span>'
      + '</div>'
      + '<div class="token-row-sparkline ' + (isUp ? 'sparkline-up' : 'sparkline-dn') + '">'
      +   buildSparklineSVG(isUp)
      + '</div>'
      + '<div class="token-row-price">'
      +   '<span class="token-row-usd" data-address="' + token.address + '">' + priceText + '</span>'
      +   '<span class="token-row-change ' + changeClass + '">' + changeText + '</span>'
      +   (volumeText ? '<span class="token-row-volume">' + volumeText + '</span>' : '')
      + '</div>';

    var img      = row.querySelector('.token-logo');
    var fallback = row.querySelector('.token-logo-fallback');
    img.onerror  = function () {
      img.style.display      = 'none';
      fallback.style.display = 'flex';
    };

    row.addEventListener('click',   function () { navigateToToken(token.address); });
    row.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        navigateToToken(token.address);
      }
    });

    return row;
  }

  function buildEmptyState(query) {
    var div = document.createElement('div');
    div.className = 'token-list-empty';
    div.innerHTML = '<span class="token-list-empty-label">'
      + (query ? 'No results for \u201c' + query + '\u201d' : 'No tokens available')
      + '</span>';
    return div;
  }

  function buildErrorState() {
    var div = document.createElement('div');
    div.className = 'token-list-error';
    div.innerHTML =
      '<span class="token-list-error-label">Price feed unavailable</span>'
      + '<button class="token-list-retry">Retry</button>';
    div.querySelector('.token-list-retry').addEventListener('click', boot);
    return div;
  }

  function navigateToToken(address) {
    if (!window.STATE || !window.setState) return;
    if (window.innerWidth >= 768) {
      setState({ rightPanel: 'token', token: address });
    } else {
      setState({ prevMobileView: STATE.mobileView, mobileView: 'token', token: address });
    }
  }

  function renderToContainer(container, tokens, prices, animate) {
    if (!container) return;
    container.innerHTML = '';
    if (!tokens || !tokens.length) {
      container.appendChild(buildEmptyState(currentQuery));
      return;
    }
    tokens.forEach(function (token, i) {
      var row = buildTokenRow(token, prices ? prices[token.address] : null);
      if (animate) {
        row.style.opacity   = '0';
        row.style.transform = 'translateY(4px)';
      }
      container.appendChild(row);
      if (animate) {
        setTimeout(function (r) {
          r.style.transition = 'opacity 220ms var(--ease-out), transform 220ms var(--ease-spr)';
          r.style.opacity    = '1';
          r.style.transform  = 'translateY(0)';
        }.bind(null, row), i * 40);
      }
    });
  }

  function renderBoth(tokens, prices, animate) {
    renderToContainer(desktopList, tokens, prices, animate);
    renderToContainer(mobileList,  tokens, prices, animate);
  }

  function showSkeletons() {
    [desktopList, mobileList].forEach(function (c) {
      if (!c) return;
      c.innerHTML = '';
      for (var s = 0; s < 3; s++) { c.appendChild(buildSkeletonRow()); }
    });
  }

  function fadeSkeletonsThenRender(tokens, prices) {
    var skeletons = (desktopList ? Array.from(desktopList.querySelectorAll('.token-row--skeleton')) : [])
      .concat(mobileList ? Array.from(mobileList.querySelectorAll('.token-row--skeleton')) : []);
    if (!skeletons.length) { renderBoth(tokens, prices, true); return; }
    skeletons.forEach(function (s) {
      s.style.transition = 'opacity 160ms var(--ease-in)';
      s.style.opacity    = '0';
    });
    setTimeout(function () { renderBoth(tokens, prices, true); }, 160);
  }

  function applyFilter(query) {
    currentQuery = query;
    var all    = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    var lower  = query.toLowerCase().trim();
    var filtered = lower ? all.filter(function (t) {
      return t.name.toLowerCase().indexOf(lower)    > -1
          || t.symbol.toLowerCase().indexOf(lower)  > -1
          || t.address.toLowerCase().indexOf(lower) > -1;
    }) : all;
    renderBoth(filtered, prices, false);
  }

  function wireSearch(input, peer) {
    if (!input) return;
    input.addEventListener('input', function () {
      if (peer) peer.value = input.value;
      applyFilter(input.value);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        input.value = '';
        if (peer) peer.value = '';
        applyFilter('');
      }
    });
  }

  document.addEventListener('state:tokenList', function () {
    var tokens = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    if (!tokens.length) return;
    currentQuery = '';
    if (desktopSearch) desktopSearch.value = '';
    if (mobileSearch)  mobileSearch.value  = '';
    fadeSkeletonsThenRender(tokens, prices);
  });

  document.addEventListener('state:prices', function () {
    var tokens = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    if (!tokens.length) return;
    if (currentQuery) { applyFilter(currentQuery); }
    else              { renderBoth(tokens, prices, false); }
  });

  function boot() {
    showSkeletons();
    setTimeout(function () {
      setState({ tokenList: MOCK_TOKEN_LIST });
      /* Prices come from Chainlink via prices.js — no mock seed */
    }, 800);
  }

  wireSearch(desktopSearch, mobileSearch);
  wireSearch(mobileSearch,  desktopSearch);
  boot();

}());
</script>

<!-- ── Phase 4B — Price Chart ───────────────────────────────────── -->
<script>
(function () {
  'use strict';

  var MOCK_PRICE_HISTORY = (function () {
    var now = Date.now();

    function pr(n) {
      var x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }
    function randn(seed) {
      var u1 = Math.max(1e-10, pr(seed));
      var u2 = pr(seed + 0.5);
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    }

    function walk(base, count, stepMs, stepVol, seed) {
      var pts   = [];
      var kappa = 0.08;
      var p = base * (1 + randn(seed) * stepVol);
      for (var i = count; i >= 0; i--) {
        p = Math.max(base * 0.001, p);
        pts.push([now - i * stepMs, +(p.toFixed(p >= 1 ? 2 : 6))]);
        var drift = kappa * (base - p) / base;
        var noise = randn(seed + i * 3 + 7) * stepVol;
        p = p * (1 + drift + noise);
      }
      pts[pts.length - 1][1] = base;
      return { prices: pts };
    }

    var T = {
      '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2': { b: 3247.82,  s: 10,  dv: 0.044  },
      '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599': { b: 67420.00, s: 20,  dv: 0.035  },
      '0x514910771AF9Ca656af840dff83E8264EcF986CA': { b: 14.23,    s: 30,  dv: 0.057  },
      '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984': { b: 8.20,     s: 40,  dv: 0.060  },
      '0x6B175474E89094C44Da98b954EedeAC495271d0F': { b: 1.00,     s: 50,  dv: 0.0006 },
      '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48': { b: 1.00,     s: 60,  dv: 0.0003 },
    };

    var h = {};
    for (var addr in T) {
      var t = T[addr];
      h[addr] = {
        '24H': walk(t.b, 24, 3600000,  t.dv / Math.sqrt(24), t.s),
        '7D':  walk(t.b, 28, 21600000, t.dv / 2,             t.s + 100),
        '30D': walk(t.b, 30, 86400000, t.dv,                 t.s + 200),
      };
    }
    return h;
  }());

  (function () {
    var h = (window.STATE && STATE.priceHistory) || {};
    for (var addr in MOCK_PRICE_HISTORY) {
      if (!h[addr]) h[addr] = MOCK_PRICE_HISTORY[addr];
    }
    setState({ priceHistory: h });
  }());

  function fmtP(usd) {
    if (usd === null || usd === undefined) return '\u2014';
    if (usd >= 10000) return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (usd >= 1)     return '$' + usd.toFixed(2);
    return '$' + usd.toFixed(6);
  }

  function fmtTs(ts, tf) {
    var d  = new Date(ts);
    var M  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    var dy = d.getDate();
    var hh = String(d.getHours()).padStart(2, '0');
    var mn = String(d.getMinutes()).padStart(2, '0');
    if (tf === '24H' || tf === '7D') return M + '\u2009' + dy + '  ' + hh + ':' + mn;
    return M + '\u2009' + dy + ',\u2009' + d.getFullYear();
  }

  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

  var _C = null;
  function C() {
    if (_C) return _C;
    var s = getComputedStyle(document.documentElement);
    function hex(v) {
      v = v.trim();
      if (!v || v[0] !== '#') return [156, 61, 187];
      var n = parseInt(v.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    _C = {
      em:  hex(s.getPropertyValue('--em')  || '#9C3DBB'),
      br:  hex(s.getPropertyValue('--br')  || '#DEE4F4'),
    };
    return _C;
  }

  function renderChart(slot, address, tf) {
    slot.innerHTML =
      '<div class="chart-section">'
      +   '<div class="chart-toggles">'
      +     '<div class="chart-toggle-indicator"></div>'
      +     '<button class="chart-toggle-btn active" data-tf="24H">24H</button>'
      +     '<button class="chart-toggle-btn" data-tf="7D">7D</button>'
      +     '<button class="chart-toggle-btn" data-tf="30D">30D</button>'
      +   '</div>'
      +   '<div class="chart-wrap"><canvas class="chart-canvas"></canvas></div>'
      + '</div>';

    var indicator = slot.querySelector('.chart-toggle-indicator');
    var btns      = Array.from(slot.querySelectorAll('.chart-toggle-btn'));
    var activeTf  = tf;

    function posInd(btn) {
      indicator.style.left  = btn.offsetLeft  + 'px';
      indicator.style.width = btn.offsetWidth + 'px';
    }

    btns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        btns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        activeTf = btn.dataset.tf;
        posInd(btn);
        mountChart(slot, address, activeTf);
      });
    });

    requestAnimationFrame(function () {
      posInd(slot.querySelector('.chart-toggle-btn.active'));
      mountChart(slot, address, activeTf);
    });
  }

  function mountChart(slot, address, tf) {
    return; /* neutralized — prices.js (Lightweight Charts) owns chart mounting */
    var wrap = slot.querySelector('.chart-wrap');
    if (!wrap) return;

    var old = wrap.querySelector('.chart-canvas');
    var cv  = old ? old.cloneNode(false) : document.createElement('canvas');
    cv.className = 'chart-canvas';
    if (old) wrap.replaceChild(cv, old);
    else     wrap.appendChild(cv);

    var dpr = window.devicePixelRatio || 1;
    var W   = wrap.clientWidth  || 400;
    var H   = wrap.clientHeight || 220;

    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';

    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);

    var raw = (window.STATE &&
               STATE.priceHistory &&
               STATE.priceHistory[address] &&
               STATE.priceHistory[address][tf] &&
               STATE.priceHistory[address][tf].prices) || [];

    var points = raw
      .filter(function (p) { return Array.isArray(p) && p.length >= 2 && typeof p[1] === 'number'; })
      .map(function (p)    { return { ts: p[0], val: p[1] }; })
      .sort(function (a, b){ return a.ts - b.ts; });

    var padL = 0, padR = 76, padT = 18, padB = 10;
    var cW   = W - padL - padR;
    var cH   = H - padT - padB;

    var minVal = 0, maxVal = 1;
    if (points.length) {
      minVal = Math.min.apply(null, points.map(function (p) { return p.val; }));
      maxVal = Math.max.apply(null, points.map(function (p) { return p.val; }));
      var mid  = (minVal + maxVal) / 2;
      var rng  = maxVal - minVal;
      var minRng = mid * 0.012;
      if (rng < minRng) {
        minVal = mid - minRng / 2;
        maxVal = mid + minRng / 2;
        rng    = minRng;
      }
      var pad = rng * 0.10;
      minVal -= pad;
      maxVal += pad;
    }

    var tsMin   = points.length ? points[0].ts                    : 0;
    var tsMax   = points.length ? points[points.length - 1].ts    : 1;
    var tSpan   = Math.max(tsMax - tsMin, 1);
    var valSpan = Math.max(maxVal - minVal, 0.000001);

    var T = {
      toX: function (ts)  { return padL + ((ts  - tsMin) / tSpan)   * cW; },
      toY: function (val) { return padT + cH - ((val - minVal) / valSpan) * cH; },
    };
    function toX(ts)  { return T.toX(ts); }
    function toY(val) { return T.toY(val); }

    var V = { lo: minVal, hi: maxVal };

    function nearest(x) {
      var best = null, bd = Infinity;
      for (var i = 0; i < points.length; i++) {
        var d = Math.abs(toX(points[i].ts) - x);
        if (d < bd) { bd = d; best = points[i]; }
      }
      return best;
    }

    var col = C();
    var er  = col.em[0], eg = col.em[1], eb = col.em[2];
    var brr = col.br[0], brg = col.br[1], brb = col.br[2];

    function draw(clipPct, xhair) {
      ctx.clearRect(0, 0, W, H);

      if (!points.length) {
        ctx.font      = "9px 'Electrolize'";
        ctx.fillStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.20)';
        ctx.textAlign = 'center';
        ctx.fillText('NO DATA', W / 2, H / 2);
        return;
      }

      ctx.font      = "9px 'Electrolize'";
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.26)';
      ctx.fillText(fmtP(V.hi), W - 2, padT + 7);
      ctx.fillStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.16)';
      ctx.fillText(fmtP(V.lo), W - 2, padT + cH - 2);

      ctx.save();
      if (clipPct < 1) {
        ctx.beginPath();
        ctx.rect(0, 0, padL + cW * clipPct + 12, H);
        ctx.clip();
      }

      var grd = ctx.createLinearGradient(0, padT, 0, padT + cH);
      grd.addColorStop(0, 'rgba(' + er + ',' + eg + ',' + eb + ',.13)');
      grd.addColorStop(1, 'rgba(' + er + ',' + eg + ',' + eb + ',0)');

      if (points.length >= 2) {
        ctx.beginPath();
        ctx.moveTo(toX(points[0].ts), toY(points[0].val));
        for (var i = 1; i < points.length; i++) {
          var x0 = toX(points[i-1].ts), y0 = toY(points[i-1].val);
          var x1 = toX(points[i].ts),   y1 = toY(points[i].val);
          ctx.bezierCurveTo((x0+x1)/2, y0, (x0+x1)/2, y1, x1, y1);
        }
        ctx.lineTo(toX(points[points.length-1].ts), padT + cH);
        ctx.lineTo(toX(points[0].ts),               padT + cH);
        ctx.closePath();
        ctx.fillStyle = grd;
        ctx.fill();
      }

      ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',.60)';
      ctx.shadowBlur  = 6;
      ctx.strokeStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.90)';
      ctx.lineWidth   = 1.5;
      ctx.lineJoin    = 'round';
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.moveTo(toX(points[0].ts), toY(points[0].val));
      for (var j = 1; j < points.length; j++) {
        var ax0 = toX(points[j-1].ts), ay0 = toY(points[j-1].val);
        var ax1 = toX(points[j].ts),   ay1 = toY(points[j].val);
        ctx.bezierCurveTo((ax0+ax1)/2, ay0, (ax0+ax1)/2, ay1, ax1, ay1);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();

      if (clipPct >= 1 && !xhair) {
        var lx = toX(points[points.length-1].ts);
        var ly = toY(points[points.length-1].val);
        ctx.beginPath();
        ctx.arc(lx, ly, 3, 0, Math.PI * 2);
        ctx.fillStyle   = 'rgba(' + er + ',' + eg + ',' + eb + ',.95)';
        ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowBlur  = 12;
        ctx.fill();
        ctx.shadowBlur  = 0;
      }

      if (xhair) {
        var cx = xhair.cx, cy = xhair.cy;
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.10)';
        ctx.lineWidth   = 1;
        ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, padT + cH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(padL, cy); ctx.lineTo(W - padR, cy); ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fillStyle   = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowBlur  = 14;
        ctx.fill();
        ctx.shadowBlur  = 0;

        ctx.beginPath();
        ctx.arc(cx, cy, 7.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.28)';
        ctx.lineWidth   = 1;
        ctx.stroke();
      }
    }

    var panel    = slot.closest('.token-panel');
    var priceEl  = panel && panel.querySelector('.token-panel-usd');
    var changeEl = panel && panel.querySelector('.token-panel-change');

    var _price  = null;
    var _change = null;
    var _class  = null;

    function onMove(e) {
      if (!cv._animDone) return;
      var touch  = e.touches ? e.touches[0] : e;
      var rect   = cv.getBoundingClientRect();
      var x      = touch.clientX - rect.left;
      var pt = nearest(x);
      if (!pt) return;
      draw(1, { cx: toX(pt.ts), cy: toY(pt.val) });
      if (priceEl) {
        if (_price === null) _price = priceEl.textContent;
        priceEl.textContent = fmtP(pt.val);
      }
      if (changeEl) {
        if (_change === null) {
          _change = changeEl.innerHTML;
          _class  = changeEl.className;
        }
        changeEl.className = 'token-panel-change';
        changeEl.innerHTML =
          '<span class="token-panel-change-period"'
          + ' style="font-size:.76rem;letter-spacing:.06em;color:var(--bd)">'
          + fmtTs(pt.ts, tf)
          + '</span>';
      }
    }

    function onLeave() {
      if (!cv._animDone) return;
      draw(1, null);
      if (priceEl && _price !== null) { priceEl.textContent = _price; _price = null; }
      if (changeEl && _change !== null) {
        changeEl.innerHTML = _change;
        changeEl.className = _class;
        _change = null; _class = null;
      }
    }

    cv.addEventListener('mousemove',  onMove);
    cv.addEventListener('mouseleave', onLeave);
    cv.addEventListener('touchstart', function (e) { e.preventDefault(); onMove(e);  }, { passive: false });
    cv.addEventListener('touchmove',  function (e) { e.preventDefault(); onMove(e);  }, { passive: false });
    cv.addEventListener('touchend',   function (e) { e.preventDefault(); onLeave();  }, { passive: false });

    cv._animDone = false;
    var t0  = performance.now();
    var DUR = 600;

    function frame(now) {
      var p = Math.min(1, (now - t0) / DUR);
      draw(easeOut(p), null);
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        cv._animDone = true;
        draw(1, null);
        cv._4b = {
          points: points, T: T, V: V,
          padL: padL, padR: padR, padT: padT, padB: padB,
          cW: cW, cH: cH, W: W, H: H,
          redraw: function (xhair) { draw(1, xhair); },
        };
        document.dispatchEvent(new CustomEvent('chart:mounted', { detail: cv }));
      }
    }
    requestAnimationFrame(frame);
  }

  var rightContent    = document.getElementById('right-panel-content');
  var mobileTokenView = document.getElementById('mobile-token');

  function tryMount(container, address, tf) { /* neutralized — prices.js (Lightweight Charts) owns chart mounting */ }

  document.addEventListener('panel:render', function (e) {
    if (e.detail !== 'token') return;
    tryMount(rightContent, window.STATE && STATE.token, '24H');
  });

  document.addEventListener('state:mobileView', function (e) {
    if (e.detail !== 'token') return;

      +     '</span>'
      +     '<span class="token-panel-change-pct">'

      +     '</span>'

  /* ── Inject / replace ───────────────────────────────────────────── */
  function injectDesktop(address) {
    var old = rightContent.querySelector('.token-panel');

    rightContent.appendChild(token ? buildPanel(token, getPrice(address)) : buildSkeleton());

  function injectMobile(address) {
    mobileTokenView.innerHTML = '';
    var token = address ? getToken(address) : null;
    mobileTokenView.appendChild(token ? buildPanel(token, getPrice(address)) : buildSkeleton());

  /* ── Live price update — touches only price + change row ────────── */
  function updatePriceInContainer(container, price) {
    var priceEl  = container.querySelector('.token-panel-usd');
    var changeEl = container.querySelector('.token-panel-change');
    var deltaEl  = container.querySelector('.token-panel-change-delta');
    var pctEl    = container.querySelector('.token-panel-change-pct');
    if (!priceEl) return;
    var oldVal = parseFloat(priceEl.textContent.replace(/[^0-9.]/g, '')) || 0;
    window.updatePrice(priceEl, price.usd, oldVal);
    if (changeEl) {
      changeEl.className = 'token-panel-change '
        + (price.change24h > 0 ? 'up' : price.change24h < 0 ? 'dn' : '');
    }
    if (deltaEl) deltaEl.textContent = formatDelta(price.usd,  price.change24h);
    if (pctEl)   pctEl.textContent   = formatChange(price.change24h);
  }

  /* ── State event listeners ──────────────────────────────────────── */
  document.addEventListener('panel:render', function (e) {
    if (e.detail === 'token') {
      injectDesktop(window.STATE && STATE.token);
    } else {
      var old = rightContent.querySelector('.token-panel');
      if (old) rightContent.removeChild(old);
    }
  });

  document.addEventListener('state:mobileView', function (e) {
    if (e.detail !== 'token') return;
    injectMobile(window.STATE && STATE.token);
  });

  document.addEventListener('state:token', function (e) {
    var address = e.detail;
    if (window.STATE && STATE.rightPanel === 'token') injectDesktop(address);
    if (window.STATE && STATE.mobileView === 'token') injectMobile(address);
  });

  /* ── Phase 9F: Holding balance — updates #token-panel-holding whenever
   *   STATE.token changes. Reads STATE.portfolioBalances across all chains.
   *   Never shows $0.00 — the block is hidden entirely when balance is zero.
   *   Also fires on state:portfolioBalances so balance appears after fetch.
   ── */
  function _updateHoldingBlock(address) {
    var holding = document.getElementById('token-panel-holding');
    var amountEl = document.getElementById('token-panel-holding-amount');
    var usdEl    = document.getElementById('token-panel-holding-usd');
    if (!holding || !amountEl || !usdEl) return;

    var found    = null;
    var balances = window.STATE && STATE.portfolioBalances;
    if (balances && address) {
      Object.keys(balances).forEach(function (cid) {
        if (!balances[cid] || balances[cid]._error) return;
        var entry = balances[cid][address];
        if (entry && parseFloat(entry.balance) > 0) {
          /* Prefer the highest-USD entry when token is held on multiple chains */
          if (!found || (entry.usd || 0) > (found.usd || 0)) found = entry;
        }
      });
    }

    if (found) {
      var sym = _getTokenSymbol(address);
      amountEl.textContent = parseFloat(found.balance).toFixed(4) + (sym ? ' ' + sym : '');
      usdEl.textContent    = '$' + (found.usd || 0).toFixed(2);
      holding.hidden       = false;
    } else {
      holding.hidden = true;
    }
  }

  function _getTokenSymbol(address) {
    var list = window.STATE && STATE.tokenList;
    if (!list || !address) return '';
    var t = list.find(function (tok) { return tok.address === address; });
    return t ? t.symbol : '';
  }

  document.addEventListener('state:token', function (e) {
    _updateHoldingBlock(e.detail);
  });

  document.addEventListener('state:portfolioBalances', function () {
    _updateHoldingBlock(window.STATE && STATE.token);
  });

  document.addEventListener('state:prices', function () {
    var address = window.STATE && STATE.token;
    if (!address) return;
    var price = getPrice(address);
    if (!price) return;
    if (STATE.rightPanel === 'token') updatePriceInContainer(rightContent,    price);
    if (STATE.mobileView === 'token') updatePriceInContainer(mobileTokenView, price);
  });

}());
</script>

<!-- ── Phase 4B.5 — Chart Axis Interaction ──────────────────────── -->
<script>
(function () {
  'use strict';

  var ZOOM_K  = 1.10;
  var XZONE_H = 22;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* chart:mounted neutralized — canvas chart replaced by Lightweight Charts (prices.js).
     Lightweight Charts handles zoom, pan, and crosshair natively. */
  document.addEventListener('chart:mounted_disabled', function (e) {
    var cv = e.detail;
    var d  = cv._4b;
    if (!d || !d.points.length) return;

    var pts  = d.points;
    var padL = d.padL, padR = d.padR, padT = d.padT, padB = d.padB;
    var cW   = d.cW,   cH   = d.cH,  W    = d.W,    H    = d.H;

    var tsMin  = pts[0].ts;
    var tsMax  = pts[pts.length - 1].ts;
    var tSpan  = Math.max(tsMax - tsMin, 1);

    var minGap = Infinity;
    for (var k = 1; k < pts.length; k++) {
      minGap = Math.min(minGap, pts[k].ts - pts[k-1].ts);
    }
    var MIN_TSPAN = minGap * 3;
    var MAX_TSPAN = tSpan  * 1.5;

    var view = {
      tsStart: tsMin,
      tsEnd:   tsMax,
      valMin:  d.V.lo,
      valMax:  d.V.hi,
      autoY:   true,
    };

    function autoY() {
      if (!view.autoY) return;
      var vis = pts.filter(function (p) { return p.ts >= view.tsStart && p.ts <= view.tsEnd; });
      if (!vis.length) return;
      var lo  = Math.min.apply(null, vis.map(function (p) { return p.val; }));
      var hi  = Math.max.apply(null, vis.map(function (p) { return p.val; }));
      var mid = (lo + hi) / 2, rng = hi - lo;
      var minR = mid * 0.012;
      if (rng < minR) { lo = mid - minR / 2; hi = mid + minR / 2; rng = minR; }
      var pad = rng * 0.10;
      view.valMin = lo - pad;
      view.valMax = hi + pad;
    }

    function sync() {
      var vTs  = Math.max(view.tsEnd  - view.tsStart,  1);
      var vVal = Math.max(view.valMax - view.valMin, 0.000001);
      d.T.toX = function (ts)  { return padL + ((ts  - view.tsStart) / vTs)  * cW; };
      d.T.toY = function (val) { return padT + cH - ((val - view.valMin) / vVal) * cH; };
      d.V.hi  = view.valMax;
      d.V.lo  = view.valMin;
    }

    function fromX(px) { return view.tsStart + ((px - padL) / cW) * (view.tsEnd - view.tsStart); }
    function fromY(py) { return view.valMin + ((padT + cH - py) / cH) * (view.valMax - view.valMin); }

    function clampT() {
      var span = clamp(view.tsEnd - view.tsStart, MIN_TSPAN, MAX_TSPAN);
      var mid  = clamp((view.tsStart + view.tsEnd) / 2,
                       tsMin - tSpan * 0.1, tsMax + tSpan * 0.1);
      view.tsStart = mid - span / 2;
      view.tsEnd   = mid + span / 2;
    }

    var _pending = false;
    function sched() {
      if (_pending) return;
      _pending = true;
      requestAnimationFrame(function () {
        _pending = false;
        sync();
        d.redraw(null);
      });
    }

    function zone(x, y) {
      if (x > W - padR)     return 'y';
      if (y > H - XZONE_H)  return 'x';
      return 'chart';
    }

    cv.addEventListener('mousemove', function (e) {
      if (_drag) return;
      var r  = cv.getBoundingClientRect();
      var z  = zone(e.clientX - r.left, e.clientY - r.top);
      cv.classList.toggle('zone-y', z === 'y');
      cv.classList.toggle('zone-x', z === 'x');
    });
    cv.addEventListener('mouseleave', function () {
      if (_drag) return;
      cv.classList.remove('zone-y', 'zone-x');
    });

    function reset() {
      view.tsStart = tsMin;
      view.tsEnd   = tsMax;
      view.autoY   = true;
      autoY();
      sched();
    }

    var _drag = null;

    function startDrag(clientX, clientY, canvasX, canvasY) {
      var z = zone(canvasX, canvasY);
      if (z !== 'y') view.autoY = false;
      _drag = {
        z: z,
        sx: clientX, sy: clientY,
        ts0:  view.tsStart, te0: view.tsEnd,
        vlo0: view.valMin,  vhi0: view.valMax,
      };
      cv.classList.add('dragging');
    }

    function moveDrag(clientX, clientY) {
      if (!_drag) return;
      var dx = clientX - _drag.sx;
      var dy = clientY - _drag.sy;

      if (_drag.z === 'y') {
        var f    = Math.pow(ZOOM_K, -dy / 8);
        var mid  = (_drag.vlo0 + _drag.vhi0) / 2;
        var half = Math.max((_drag.vhi0 - _drag.vlo0) / 2 * f, mid * 0.0005);
        view.valMin = mid - half;
        view.valMax = mid + half;
      } else if (_drag.z === 'x') {
        var f2    = Math.pow(ZOOM_K, dx / 8);
        var tmid  = (_drag.ts0 + _drag.te0) / 2;
        var half2 = clamp((_drag.te0 - _drag.ts0) / 2 * f2, MIN_TSPAN / 2, MAX_TSPAN / 2);
        view.tsStart = tmid - half2;
        view.tsEnd   = tmid + half2;
        clampT();
        autoY();
      } else {
        var dtMs = -(dx / cW) * (_drag.te0 - _drag.ts0);
        view.tsStart = _drag.ts0 + dtMs;
        view.tsEnd   = _drag.te0 + dtMs;
        clampT();
        if (!view.autoY) {
          var dv = (dy / cH) * (_drag.vhi0 - _drag.vlo0);
          view.valMin = _drag.vlo0 + dv;
          view.valMax = _drag.vhi0 + dv;
        } else {
          autoY();
        }
      }
      sched();
    }

    function endDrag() {
      if (!_drag) return;
      _drag = null;
      cv.classList.remove('dragging', 'zone-y', 'zone-x');
    }

    cv.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      var r = cv.getBoundingClientRect();
      startDrag(e.clientX, e.clientY, e.clientX - r.left, e.clientY - r.top);
    });
    window.addEventListener('mousemove', function (e) { if (_drag) moveDrag(e.clientX, e.clientY); });
    window.addEventListener('mouseup',   endDrag);

    cv.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      var t = e.touches[0];
      var r = cv.getBoundingClientRect();
      var cx = t.clientX - r.left, cy = t.clientY - r.top;
      if (zone(cx, cy) !== 'chart') {
        e.preventDefault();
        startDrag(t.clientX, t.clientY, cx, cy);
      }
    }, { passive: false });

    window.addEventListener('touchmove', function (e) {
      if (!_drag) return;
      if (e.touches.length !== 1) return;
      e.preventDefault();
      moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchend', function () { endDrag(); });

    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r  = cv.getBoundingClientRect();
      var cx = e.clientX - r.left;
      var cy = e.clientY - r.top;
      var f  = e.deltaY > 0 ? ZOOM_K : 1 / ZOOM_K;
      var z  = zone(cx, cy);

      if (z === 'y' || e.shiftKey) {
        view.autoY  = false;
        var av      = fromY(cy);
        var rng     = view.valMax - view.valMin;
        var rm      = (av - view.valMin) / rng;
        var nr      = clamp(rng * f, rng * 0.02, rng * 50);
        view.valMin = av - rm * nr;
        view.valMax = av + (1 - rm) * nr;
      } else {
        var at   = fromX(cx);
        var span = view.tsEnd - view.tsStart;
        var rt   = (at - view.tsStart) / span;
        var ns   = clamp(span * f, MIN_TSPAN, MAX_TSPAN);
        view.tsStart = at - rt * ns;
        view.tsEnd   = at + (1 - rt) * ns;
        clampT();
        autoY();
      }
      sched();
    }, { passive: false });

    cv.addEventListener('dblclick', reset);
    var _lastTap = 0;
    cv.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - _lastTap < 300 && !_drag) { e.preventDefault(); reset(); }
      _lastTap = now;
    });

    sync();
  });

}());
</script>

<!-- ── Gate — mark animation (faithful port of OBS-LOGO.html) ──────── -->
<script>
(function () {
  'use strict';

  /* Scoped helper: maps shorthand ID to gate-prefixed DOM element */
  function $g(id) { return document.getElementById('gm-' + id); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ── Flash corner square with brightness burst ── */
  function flashCorner(id) {
    var el = $g(id);
    el.style.transition = 'opacity 0.25s ease-in';
    el.style.opacity    = '1';
    el.style.filter     = 'brightness(5)';
    setTimeout(function () {
      el.style.transition = 'opacity 0.25s ease-in, filter 0.5s ease-out';
      el.style.filter     = 'none';
    }, 80);
  }

  /* ── Facet geometry — identical values to OBS-LOGO.html ── */
  function midpoint(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }

  function splitRight(P, Q, R, depth) {
    if (depth <= 0) return [[P, Q, R]];
    var M = midpoint(Q, R);
    return splitRight(M, P, Q, depth - 1).concat(splitRight(M, P, R, depth - 1));
  }

  var WALK    = [3, 1, 2, 0, 4, 6, 5, 7];
  var CENTER  = [50, 50];
  var CORNERS = [[34, 34], [66, 34], [66, 66], [34, 66]];

  var QUAD_BASE = [0.11, 0.03, 0.06, 0.19];
  var QUAD_PEAK = [0.98, 0.92, 0.86, 0.82];
  var POS_MULT  = [0.60, 0.80, 0.95, 1.00, 1.00, 0.95, 0.80, 0.60];

  var facets = [];

  function buildFacets() {
    var svgNS  = 'http://www.w3.org/2000/svg';
    var inner  = document.getElementById('gm-inner');
    var border = inner.querySelector('rect');

    CORNERS.forEach(function (Q, q) {
      var R      = CORNERS[(q + 1) % 4];
      var raw    = splitRight(CENTER, Q, R, 3);
      var walked = WALK.map(function (i) { return raw[i]; });

      walked.forEach(function (tri, pos) {
        var base = QUAD_BASE[q];
        var peak = base + (QUAD_PEAK[q] - base) * POS_MULT[pos];

        var poly = document.createElementNS(svgNS, 'polygon');
        poly.setAttribute('points', tri.map(function (p) { return p.join(','); }).join(' '));
        poly.setAttribute('fill', '#9C3DBB');
        poly.setAttribute('fill-opacity', base);
        poly.setAttribute('stroke', 'none');
        inner.insertBefore(poly, border);

        facets.push({ el: poly, base: base, peak: peak });
      });
    });
  }

  buildFacets();

  /* ── Two-wave shine — identical timing to OBS-LOGO.html ── */
  var STEP          = 88;
  var REVEAL_DUR    = 240;
  var CLEAR_DUR     = 420;
  var THRESHOLD     = Math.round(facets.length * 0.75);
  var LAUNCH2_DELAY = (THRESHOLD - 1) * STEP;
  var PAIR_SETTLE   = LAUNCH2_DELAY + (facets.length - 1) * STEP + CLEAR_DUR;

  function fireWave(delay, transition) {
    facets.forEach(function (f, i) {
      setTimeout(function () { transition(f); }, delay + i * STEP);
    });
  }

  function spawnPair() {
    var variance = 0.92 + Math.random() * 0.16;
    fireWave(0, function (f) {
      var peakVal = Math.min(1, f.base + (f.peak - f.base) * variance);
      f.el.style.transition  = 'fill-opacity ' + REVEAL_DUR + 'ms ease-in';
      f.el.style.fillOpacity = peakVal;
    });
    fireWave(LAUNCH2_DELAY, function (f) {
      f.el.style.transition  = 'fill-opacity ' + CLEAR_DUR + 'ms ease-out';
      f.el.style.fillOpacity = f.base;
    });
  }

  async function shineOnce() {
    spawnPair();
    await wait(PAIR_SETTLE);
  }

  async function shineTwice() {
    await shineOnce();
    await shineOnce();
  }

  /* ── Boot sequence — exact timing from OBS-LOGO.html ── */
  async function boot() {

    /* 1 — Inner square fades in */
    await wait(400);
    var inner = document.getElementById('gm-inner');
    inner.style.transition = 'opacity 1s ease-out';
    inner.style.opacity    = '1';

    /* 2 — Diagonals extend outward, staggered */
    await wait(1000);
    var diags    = [['dl0', 0], ['dl1', 60], ['dl2', 120], ['dl3', 180]];
    var diagDur  = 1100;
    var diagEase = 'cubic-bezier(0.4, 0.0, 0.6, 1.0)';

    diags.forEach(function (item) {
      var id = item[0], offset = item[1];
      setTimeout(function () {
        var el = $g(id);
        el.style.transition       = 'stroke-dashoffset ' + diagDur + 'ms ' + diagEase;
        el.style.strokeDashoffset = '0';
      }, offset);
    });

    /* 3 — Outer frame: all 4 lines simultaneously */
    await wait(diags[3][1] + diagDur + 120);
    var frameDur   = 950;
    var frameEase  = 'cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    var ofArrivals = [1, 2, 3, 0];

    document.querySelectorAll('.gate-of').forEach(function (el, i) {
      el.style.transition       = 'stroke-dashoffset ' + frameDur + 'ms ' + frameEase;
      el.style.strokeDashoffset = '0';
      setTimeout(function () { flashCorner('cs' + ofArrivals[i]); }, frameDur + 200);
    });

    /* 4 — Inner rotates from square to diamond */
    await wait(frameDur + 200);
    inner.style.transition = 'transform 1.1s cubic-bezier(0.0, 0.0, 0.2, 1)';
    inner.style.transform  = 'rotate(45deg)';

    /* 5 — Shine twice, then enter idle loop */
    await wait(1200);
    await shineTwice();
    idleLoop();
  }

  /* ── Idle loop — runs while gate is visible ── */
  async function idleLoop() {
    var gate       = document.getElementById('gate');
    var inner      = document.getElementById('gm-inner');
    var outerSegs  = document.querySelectorAll('.gate-of');
    var ofArrivals = [1, 2, 3, 0];

    while (!gate.classList.contains('gate-gone')) {

      await wait(2000 + Math.random() * 1500);
      if (gate.classList.contains('gate-gone')) break;

      await shineTwice();
      await wait(1200 + Math.random() * 1000);
      if (gate.classList.contains('gate-gone')) break;

      /* ── UNDRAW ── */
      inner.style.transition = 'transform 1.3s cubic-bezier(0.4, 0, 0.2, 1)';
      inner.style.transform  = 'rotate(0deg)';
      await wait(700);

      outerSegs.forEach(function (el) {
        el.style.transition       = 'stroke-dashoffset 0.85s cubic-bezier(0.4, 0, 1, 1)';
        el.style.strokeDashoffset = '76';
      });
      await wait(300);

      ['dl0', 'dl1', 'dl2', 'dl3'].forEach(function (id) {
        var el = $g(id);
        el.style.transition       = 'stroke-dashoffset 0.75s cubic-bezier(0.4, 0, 1, 1)';
        el.style.strokeDashoffset = '32';
      });
      await wait(400);

      ['cs0', 'cs1', 'cs2', 'cs3'].forEach(function (id) {
        var el = $g(id);
        el.style.transition = 'opacity 0.35s ease-in';
        el.style.opacity    = '0';
      });
      await wait(600);

      /* ── REDRAW ── */
      ['dl0', 'dl1', 'dl2', 'dl3'].forEach(function (id, i) {
        setTimeout(function () {
          var el = $g(id);
          el.style.transition       = 'stroke-dashoffset 1.1s cubic-bezier(0.4, 0, 0.6, 1)';
          el.style.strokeDashoffset = '0';
        }, i * 60);
      });
      await wait(1300);

      var frameDur = 950;
      outerSegs.forEach(function (el, i) {
        el.style.transition       = 'stroke-dashoffset ' + frameDur + 'ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        el.style.strokeDashoffset = '0';
        setTimeout(function () { flashCorner('cs' + ofArrivals[i]); }, frameDur + 200);
      });
      await wait(frameDur + 200);

      inner.style.transition = 'transform 1.1s cubic-bezier(0.0, 0.0, 0.2, 1)';
      inner.style.transform  = 'rotate(45deg)';
      await wait(1200);
    }
  }

  document.fonts.ready.then(boot);

}());
</script>

<!-- ── Gate — connection logic ──────────────────────────────────────── -->
<script>
(function () {
  'use strict';

  var gate       = document.getElementById('gate');
  var wordmark   = document.getElementById('gate-wordmark');
  var btnWrap    = document.getElementById('gate-btn-wrap');
  var connectBtn = document.getElementById('gate-connect-btn');

  var _dissolved = false;

  /* Dissolve gate — 700ms fade, then remove from layout */
  function dissolve() {
    if (_dissolved) return;
    _dissolved = true;
    gate.classList.add('gate-off');
    setTimeout(function () { gate.classList.add('gate-gone'); }, 720);
  }

  /* Instant-off path: session already live when page loads */
  if (window.STATE && STATE.connected) {
    gate.classList.add('gate-gone');
    _dissolved = true;
    return;
  }

  /* Wordmark fades in as the outer frame completes (~2.8s into boot) */
  setTimeout(function () {
    if (_dissolved) return;
    if (wordmark) wordmark.classList.add('wm-on');
  }, 2800);

  /* Button reveal — polls for Privy bridge ready state.
   * Privy imports React + SDK from esm.sh (typically 1.5–2.5s).
   * Button appears as soon as Privy has checked for an existing session.
   * Hard cap at 4200ms guarantees the button always appears. */
  var _btnRevealed = false;
  var _pollStart   = Date.now();

  function revealButton() {
    if (_btnRevealed || _dissolved) return;
    _btnRevealed = true;
    if (btnWrap) btnWrap.classList.add('btn-on');
  }

  function pollPrivy() {
    if (_dissolved) return;
    if (window._privyBridge && window._privyBridge.ready) {
      /* Privy initialized — allow 300ms for auth state to propagate */
      setTimeout(revealButton, 300);
      return;
    }
    if (Date.now() - _pollStart < 4200) {
      setTimeout(pollPrivy, 150);
    } else {
      revealButton(); /* Hard cap — button always appears */
    }
  }

  pollPrivy();

  /* Primary listener — fires when wallet connects or disconnects */
  document.addEventListener('state:connected', function () {
    if (window.STATE && STATE.connected) {
      dissolve();
    } else {
      /* Edge case: disconnected while gate is showing — ensure button visible */
      revealButton();
    }
  });

  /* Connect button */
  if (connectBtn) {
    connectBtn.addEventListener('click', function () {
      if (typeof connect === 'function') connect();
    });
  }

}());
</script>

  /* ── Containers ────────────────────────────────────────────────── */
  var rightContent    = document.getElementById('right-panel-content');
  var mobileTokenView = document.getElementById('mobile-token');

  /* ── Formatters ────────────────────────────────────────────────── */
  function getLogoUrl(address) {
    var cs = address;
    try { cs = ethers.utils.getAddress(address); } catch (_) {}
    return 'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/ethereum/assets/'
      + cs + '/logo.png';
  }

  function formatPrice(usd) {
    if (usd === null || usd === undefined) return '\u2014';
    if (usd >= 10000) return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (usd >= 1)     return '$' + usd.toFixed(2);
    return '$' + usd.toFixed(4);
  }

  function formatChange(change) {
    if (change === null || change === undefined) return '\u2014';
    return (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
  }

  function formatDelta(usd, change) {
    if (!usd || change === null || change === undefined) return '';
    var d = usd * change / 100;
    return (d >= 0 ? '+$' : '\u2212$') + Math.abs(d).toFixed(2);
  }

  /* ── updatePrice — exported for Phase 7A ──────────────────────── */
  window.updatePrice = function (el, newVal, oldVal) {
    el.style.transition = 'opacity 80ms var(--ease-in)';
    el.style.opacity    = '0';
    setTimeout(function () {
      el.textContent      = formatPrice(newVal);
      el.style.color      = newVal > oldVal ? 'var(--up)' : 'var(--dn)';
      el.style.opacity    = '1';
      el.style.transition = 'opacity 120ms var(--ease-out), color 600ms var(--ease-std)';
      setTimeout(function () { el.style.color = ''; }, 600);
    }, 80);
  };

  /* ── STATE helpers ──────────────────────────────────────────────── */
  function getToken(address) {
    if (!window.STATE || !STATE.tokenList) return null;
    for (var i = 0; i < STATE.tokenList.length; i++) {
      if (STATE.tokenList[i].address === address) return STATE.tokenList[i];
    }
    return null;
  }

  function getPrice(address) {
    if (!window.STATE || !STATE.prices) return null;
    return STATE.prices[address] || null;
  }

  /* ── Swap navigation ────────────────────────────────────────────── */
  function navigateToSwap(address) {
    if (!window.STATE || !window.setState) return;
    if (window.innerWidth >= 768) {
      setState({ rightPanel: 'swap', token: address });
    } else {
      setState({ prevMobileView: STATE.mobileView, mobileView: 'swap', token: address });
    }
  }

  /* ── Skeleton ─────────────────────────────────────────────────── */
  function buildSkeleton() {
    var el = document.createElement('div');
    el.className = 'token-panel';
    el.innerHTML =
      '<div class="token-panel-header">'
      +   '<div class="skeleton tp-skel-logo"></div>'
      +   '<div class="token-panel-identity">'
      +     '<div class="skeleton tp-skel-name"></div>'
      +     '<div class="skeleton tp-skel-sym"></div>'
      +   '</div>'
      + '</div>'
      + '<div class="token-panel-price">'
      +   '<div class="skeleton tp-skel-price"></div>'
      +   '<div class="skeleton tp-skel-change"></div>'
      + '</div>'
      + '<div class="token-panel-chart-slot"><div class="skeleton price-chart" style="border-radius:0"></div></div>'
      /* Phase 4C — skeleton stat cells */
      + '<div class="tp-skel-stats">'
      +   '<div class="tp-skel-stat">'
      +     '<div class="skeleton" style="width:72px;height:8px"></div>'
      +     '<div class="skeleton" style="width:52px;height:13px;margin-top:4px"></div>'
      +   '</div>'
      +   '<div class="tp-skel-stat">'
      +     '<div class="skeleton" style="width:64px;height:8px"></div>'
      +     '<div class="skeleton" style="width:48px;height:13px;margin-top:4px"></div>'
      +   '</div>'
      +   '<div class="tp-skel-stat">'
      +     '<div class="skeleton" style="width:80px;height:8px"></div>'
      +     '<div class="skeleton" style="width:60px;height:13px;margin-top:4px"></div>'
      +   '</div>'
      + '</div>'
      /* Phase 4C — skeleton SWAP button */
      + '<div class="token-panel-action">'
      +   '<div class="skeleton" style="height:56px;width:100%"></div>'

    return el;
  }

  /* ── Stat cell builder ──────────────────────────────────────────── */
  function buildStatCell(label, value, sub) {
    return '<div class="token-stat">'
      +   '<span class="token-stat-label">' + label + '</span>'
      +   '<span class="token-stat-value">' + value + '</span>'
      +   '<span class="token-stat-sub">'   + (sub || '') + '</span>'
      + '</div>';

  /* ── Full loaded panel ──────────────────────────────────────────── */
  function buildPanel(token, price) {
    var el       = document.createElement('div');
    el.className = 'token-panel';
    el.setAttribute('data-token', token.address);

    var usd         = price ? price.usd       : null;
    var change      = price ? price.change24h : null;
    var changeClass = change > 0 ? 'up' : change < 0 ? 'dn' : '';

    /* Stat data — Phase 7C replaces with live values */
    var stats = MOCK_STATS[token.address] || {
      marketCap: '\u2014', marketCapSub: '',
      volume:    '\u2014', volumeSub:    '',
      supply:    '\u2014', supplySub:    '',
    };

    el.innerHTML =
      /* Header */
      '<div class="token-panel-header">'

      +       ' src="' + getLogoUrl(token.address) + '"'
      +       ' alt="' + token.symbol + '"'
      +       ' width="40" height="40">'
      +   '<div class="token-logo-fallback-lg" style="display:none">'
      +     token.symbol[0]
      +   '</div>'
      +   '<div class="token-panel-identity">'
      +     '<span class="token-panel-name">'   + token.name   + '</span>'
      +     '<span class="token-panel-symbol">' + token.symbol + '</span>'

    /* Logo fallback */
    var img      = el.querySelector('.token-panel-logo');

    img.onerror  = function () {
      img.style.display      = 'none';
      fallback.style.display = 'flex';

    /* SWAP button navigation */
    var swapBtn = el.querySelector('.tp-swap-btn');
    swapBtn.addEventListener('click', function () {
      navigateToSwap(token.address);

    return el;
  }

  /* ── Inject / replace ───────────────────────────────────────────── */
  function injectDesktop(address) {
    var old = rightContent.querySelector('.token-panel');
    if (old) rightContent.removeChild(old);
    if (!address) return;
    var token = getToken(address);
    rightContent.appendChild(token ? buildPanel(token, getPrice(address)) : buildSkeleton());

  function injectMobile(address) {
    mobileTokenView.innerHTML = '';

  /* ── Live price update — touches only price + change row ────────── */
  function updatePriceInContainer(container, price) {
    var priceEl  = container.querySelector('.token-panel-usd');
    var changeEl = container.querySelector('.token-panel-change');
    var deltaEl  = container.querySelector('.token-panel-change-delta');

    var oldVal = parseFloat(priceEl.textContent.replace(/[^0-9.]/g, '')) || 0;
    window.updatePrice(priceEl, price.usd, oldVal);

      changeEl.className = 'token-panel-change '
        + (price.change24h > 0 ? 'up' : price.change24h < 0 ? 'dn' : '');

    if (deltaEl) deltaEl.textContent = formatDelta(price.usd,  price.change24h);
    if (pctEl)   pctEl.textContent   = formatChange(price.change24h);

  /* ── State event listeners ──────────────────────────────────────── */
  document.addEventListener('panel:render', function (e) {

  document.addEventListener('state:mobileView', function (e) {

  document.addEventListener('state:token', function (e) {
    var address = e.detail;
    if (window.STATE && STATE.rightPanel === 'token') injectDesktop(address);
    if (window.STATE && STATE.mobileView === 'token') injectMobile(address);

  document.addEventListener('state:prices', function () {

    if (!address) return;

    if (STATE.rightPanel === 'token') updatePriceInContainer(rightContent,    price);

}());

<!-- ── Phase 4B.5 — Chart Axis Interaction ──────────────────────── -->
<script>
(function () {
  'use strict';

  var ZOOM_K  = 1.10;
  var XZONE_H = 22;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* chart:mounted neutralized — canvas chart replaced by Lightweight Charts (prices.js).
     Lightweight Charts handles zoom, pan, and crosshair natively. */
  document.addEventListener('chart:mounted_disabled', function (e) {
    var cv = e.detail;
    var d  = cv._4b;
    if (!d || !d.points.length) return;

    var pts  = d.points;
    var padL = d.padL, padR = d.padR, padT = d.padT, padB = d.padB;
    var cW   = d.cW,   cH   = d.cH,  W    = d.W,    H    = d.H;

    var tsMin  = pts[0].ts;
    var tsMax  = pts[pts.length - 1].ts;
    var tSpan  = Math.max(tsMax - tsMin, 1);

    var minGap = Infinity;
    for (var k = 1; k < pts.length; k++) {
      minGap = Math.min(minGap, pts[k].ts - pts[k-1].ts);
    }
    var MIN_TSPAN = minGap * 3;
    var MAX_TSPAN = tSpan  * 1.5;

    var view = {
      tsStart: tsMin,
      tsEnd:   tsMax,
      valMin:  d.V.lo,
      valMax:  d.V.hi,
      autoY:   true,
    };

    function autoY() {
      if (!view.autoY) return;
      var vis = pts.filter(function (p) { return p.ts >= view.tsStart && p.ts <= view.tsEnd; });
      if (!vis.length) return;
      var lo  = Math.min.apply(null, vis.map(function (p) { return p.val; }));
      var hi  = Math.max.apply(null, vis.map(function (p) { return p.val; }));
      var mid = (lo + hi) / 2, rng = hi - lo;
      var minR = mid * 0.012;
      if (rng < minR) { lo = mid - minR / 2; hi = mid + minR / 2; rng = minR; }
      var pad = rng * 0.10;
      view.valMin = lo - pad;
      view.valMax = hi + pad;
    }

    function sync() {
      var vTs  = Math.max(view.tsEnd  - view.tsStart,  1);
      var vVal = Math.max(view.valMax - view.valMin, 0.000001);
      d.T.toX = function (ts)  { return padL + ((ts  - view.tsStart) / vTs)  * cW; };
      d.T.toY = function (val) { return padT + cH - ((val - view.valMin) / vVal) * cH; };
      d.V.hi  = view.valMax;
      d.V.lo  = view.valMin;
    }

    function fromX(px) { return view.tsStart + ((px - padL) / cW) * (view.tsEnd - view.tsStart); }
    function fromY(py) { return view.valMin + ((padT + cH - py) / cH) * (view.valMax - view.valMin); }

    function clampT() {
      var span = clamp(view.tsEnd - view.tsStart, MIN_TSPAN, MAX_TSPAN);
      var mid  = clamp((view.tsStart + view.tsEnd) / 2,
                       tsMin - tSpan * 0.1, tsMax + tSpan * 0.1);
      view.tsStart = mid - span / 2;
      view.tsEnd   = mid + span / 2;
    }

    var _pending = false;
    function sched() {
      if (_pending) return;
      _pending = true;
      requestAnimationFrame(function () {
        _pending = false;
        sync();
        d.redraw(null);
      });
    }

    function zone(x, y) {
      if (x > W - padR)     return 'y';
      if (y > H - XZONE_H)  return 'x';
      return 'chart';
    }

    cv.addEventListener('mousemove', function (e) {
      if (_drag) return;
      var r  = cv.getBoundingClientRect();
      var z  = zone(e.clientX - r.left, e.clientY - r.top);
      cv.classList.toggle('zone-y', z === 'y');
      cv.classList.toggle('zone-x', z === 'x');
    });
    cv.addEventListener('mouseleave', function () {
      if (_drag) return;
      cv.classList.remove('zone-y', 'zone-x');
    });

    function reset() {
      view.tsStart = tsMin;
      view.tsEnd   = tsMax;
      view.autoY   = true;
      autoY();
      sched();
    }

    var _drag = null;

    function startDrag(clientX, clientY, canvasX, canvasY) {
      var z = zone(canvasX, canvasY);
      if (z !== 'y') view.autoY = false;
      _drag = {
        z: z,
        sx: clientX, sy: clientY,
        ts0:  view.tsStart, te0: view.tsEnd,
        vlo0: view.valMin,  vhi0: view.valMax,
      };
      cv.classList.add('dragging');
    }

    function moveDrag(clientX, clientY) {
      if (!_drag) return;
      var dx = clientX - _drag.sx;
      var dy = clientY - _drag.sy;

      if (_drag.z === 'y') {
        var f    = Math.pow(ZOOM_K, -dy / 8);
        var mid  = (_drag.vlo0 + _drag.vhi0) / 2;
        var half = Math.max((_drag.vhi0 - _drag.vlo0) / 2 * f, mid * 0.0005);
        view.valMin = mid - half;
        view.valMax = mid + half;
      } else if (_drag.z === 'x') {
        var f2    = Math.pow(ZOOM_K, dx / 8);
        var tmid  = (_drag.ts0 + _drag.te0) / 2;
        var half2 = clamp((_drag.te0 - _drag.ts0) / 2 * f2, MIN_TSPAN / 2, MAX_TSPAN / 2);
        view.tsStart = tmid - half2;
        view.tsEnd   = tmid + half2;
        clampT();
        autoY();
      } else {
        var dtMs = -(dx / cW) * (_drag.te0 - _drag.ts0);
        view.tsStart = _drag.ts0 + dtMs;
        view.tsEnd   = _drag.te0 + dtMs;
        clampT();
        if (!view.autoY) {
          var dv = (dy / cH) * (_drag.vhi0 - _drag.vlo0);
          view.valMin = _drag.vlo0 + dv;
          view.valMax = _drag.vhi0 + dv;
        } else {
          autoY();
        }
      }
      sched();
    }

    function endDrag() {
      if (!_drag) return;
      _drag = null;
      cv.classList.remove('dragging', 'zone-y', 'zone-x');
    }

    cv.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      var r = cv.getBoundingClientRect();
      startDrag(e.clientX, e.clientY, e.clientX - r.left, e.clientY - r.top);
    });
    window.addEventListener('mousemove', function (e) { if (_drag) moveDrag(e.clientX, e.clientY); });
    window.addEventListener('mouseup',   endDrag);

    cv.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      var t = e.touches[0];
      var r = cv.getBoundingClientRect();
      var cx = t.clientX - r.left, cy = t.clientY - r.top;
      if (zone(cx, cy) !== 'chart') {
        e.preventDefault();
        startDrag(t.clientX, t.clientY, cx, cy);
      }
    }, { passive: false });

    window.addEventListener('touchmove', function (e) {
      if (!_drag) return;
      if (e.touches.length !== 1) return;
      e.preventDefault();
      moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    window.addEventListener('touchend', function () { endDrag(); });

    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r  = cv.getBoundingClientRect();
      var cx = e.clientX - r.left;
      var cy = e.clientY - r.top;
      var f  = e.deltaY > 0 ? ZOOM_K : 1 / ZOOM_K;
      var z  = zone(cx, cy);

      if (z === 'y' || e.shiftKey) {
        view.autoY  = false;
        var av      = fromY(cy);
        var rng     = view.valMax - view.valMin;
        var rm      = (av - view.valMin) / rng;
        var nr      = clamp(rng * f, rng * 0.02, rng * 50);
        view.valMin = av - rm * nr;
        view.valMax = av + (1 - rm) * nr;
      } else {
        var at   = fromX(cx);
        var span = view.tsEnd - view.tsStart;
        var rt   = (at - view.tsStart) / span;
        var ns   = clamp(span * f, MIN_TSPAN, MAX_TSPAN);
        view.tsStart = at - rt * ns;
        view.tsEnd   = at + (1 - rt) * ns;
        clampT();
        autoY();
      }
      sched();
    }, { passive: false });

    cv.addEventListener('dblclick', reset);
    var _lastTap = 0;
    cv.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - _lastTap < 300 && !_drag) { e.preventDefault(); reset(); }
      _lastTap = now;
    });

    sync();
  });

}());
</script>

<!-- ═══════════════════════════════════════════════════════════
     OBS LOADING OVERLAY
     Fixed, z-index 500 — above all UI, below toasts (9998).
     Hidden by default via [hidden] attr → display:none.
     JS removes [hidden], then RAF adds .visible for the fade.
     API: window.OBSLoader.show(label?) / hide()
══════════════════════════════════════════════════════════════ -->
<div id="obs-loading" class="obs-loading-overlay" aria-live="polite" aria-label="Loading" hidden>

  <svg class="obs-loading-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <defs>
      <!--
        feFlood + feComposite operator="in" — reliable cross-browser coloured glow.
        Matches OBS-LOADING.html exactly. Do not change to feColorMatrix.
      -->
      <filter id="obs-border-glow"
              filterUnits="userSpaceOnUse"
              x="-20" y="-20" width="140" height="140">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2"    result="blur1"/>
        <feFlood   flood-color="#9C3DBB" flood-opacity="0.9"  result="c1"/>
        <feComposite in="c1" in2="blur1" operator="in"        result="glow1"/>
        <feGaussianBlur in="SourceAlpha" stdDeviation="6"    result="blur2"/>
        <feFlood   flood-color="#9C3DBB" flood-opacity="0.5"  result="c2"/>
        <feComposite in="c2" in2="blur2" operator="in"        result="glow2"/>
        <feMerge>
          <feMergeNode in="glow2"/>
          <feMergeNode in="glow1"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Facets — populated by OBSLoader init below -->
    <g id="obs-facets"></g>

    <!--
      Diamond border — square [34,34]→[66,66] rotated 45° around [50,50].
      Stroke: --em-2 (#BE80DC). Glow: --em (#9C3DBB).
      Above facets in paint order — always reads clean.
    -->
    <rect x="34" y="34" width="32" height="32"
          fill="none"
          stroke="#BE80DC"
          stroke-width="0.5"
          transform="rotate(45, 50, 50)"
          filter="url(#obs-border-glow)"/>
  </svg>

  <!-- Label — empty by default; OBSLoader.show('TEXT') populates it -->
  <span id="obs-loading-label" class="obs-loading-label"></span>

</div>

<!-- ═══════════════════════════════════════════════════════════
     OBS LOADER — init + public API
     Builds facets immediately on parse (overlay is hidden —
     no visual cost). show/hide manage the fade + animation loop.
══════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ── Facet geometry — identical algorithm to OBS-LOADING.html ──── */
  function midpoint(a, b) { return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }

  function splitRight(P, Q, R, depth) {
    if (depth <= 0) return [[P, Q, R]];
    var M = midpoint(Q, R);
    return splitRight(M, P, Q, depth-1).concat(splitRight(M, P, R, depth-1));
  }

  var WALK      = [3,1,2,0,4,6,5,7];
  var CENTER    = [50, 50];
  var CORNERS   = [[34,34],[66,34],[66,66],[34,66]];
  var QUAD_BASE = [0.11, 0.03, 0.06, 0.19];
  var QUAD_PEAK = [0.98, 0.92, 0.86, 0.82];
  var POS_MULT  = [0.60, 0.80, 0.95, 1.00, 1.00, 0.95, 0.80, 0.60];

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var facets = [];

  function buildFacets() {
    var inner = document.getElementById('obs-facets');
    if (!inner) return;

    CORNERS.forEach(function (Q, q) {
      var R      = CORNERS[(q+1) % 4];
      var raw    = splitRight(CENTER, Q, R, 3);
      var walked = WALK.map(function (i) { return raw[i]; });

      walked.forEach(function (tri, pos) {
        var base = QUAD_BASE[q];
        var peak = base + (QUAD_PEAK[q] - base) * POS_MULT[pos];

        var poly = document.createElementNS(SVG_NS, 'polygon');
        poly.setAttribute('points', tri.map(function (p) { return p.join(','); }).join(' '));
        poly.setAttribute('fill', '#9C3DBB');
        poly.setAttribute('fill-opacity', base);
        poly.setAttribute('stroke', 'none');
        inner.appendChild(poly);

        facets.push({ el: poly, base: base, peak: peak });
      });
    });
  }

  buildFacets(); /* runs immediately — overlay hidden, zero visual cost */

  /* ── Two-wave shine — exact timing from OBS-LOADING.html ──────── */
  var STEP        = 88;
  var REVEAL_DUR  = 240;
  var CLEAR_DUR   = 420;
  var THRESHOLD   = Math.round(facets.length * 0.75); /* 24 of 32 */
  var LAUNCH2     = (THRESHOLD - 1) * STEP;           /* 2024ms   */
  var PAIR_SETTLE = LAUNCH2 + (facets.length - 1) * STEP + CLEAR_DUR; /* 5172ms */

  function fireWave(delay, fn) {
    facets.forEach(function (f, i) {
      setTimeout(function () { fn(f); }, delay + i * STEP);
    });
  }

  function spawnPair() {
    var variance = 0.92 + Math.random() * 0.16;
    fireWave(0, function (f) {
      var peak = Math.min(1, f.base + (f.peak - f.base) * variance);
      f.el.style.transition  = 'fill-opacity ' + REVEAL_DUR + 'ms ease-in';
      f.el.style.fillOpacity = peak;
    });
    fireWave(LAUNCH2, function (f) {
      f.el.style.transition  = 'fill-opacity ' + CLEAR_DUR + 'ms ease-out';
      f.el.style.fillOpacity = f.base;
    });
  }

  var _running = false;
  var _timer   = null;

  function loopStep() {
    if (!_running) return;
    spawnPair();
    _timer = setTimeout(loopStep, PAIR_SETTLE + 500);
  }

  function startLoop() {
    if (_running) return;
    _running = true;
    loopStep();
  }

  function stopLoop() {
    _running = false;
    clearTimeout(_timer);
    /* Reset all facets to resting base opacity */
    facets.forEach(function (f) {
      f.el.style.transition  = 'fill-opacity 200ms';
      f.el.style.fillOpacity = f.base;
    });
  }

  /* ── Show / hide ─────────────────────────────────────────────── */
  var _overlay   = null;
  var _labelEl   = null;
  var _hideTimer = null;

  function ensureRefs() {
    if (!_overlay) {
      _overlay = document.getElementById('obs-loading');
      _labelEl = document.getElementById('obs-loading-label');
    }
  }

  function show(text) {
    ensureRefs();
    if (!_overlay) return;
    clearTimeout(_hideTimer);
    if (_labelEl) _labelEl.textContent = text || '';
    _overlay.hidden = false;             /* display:flex — was display:none   */
    requestAnimationFrame(function () {
      _overlay.classList.add('visible'); /* triggers opacity 0→1 transition  */
    });
    startLoop();
  }

  function hide() {
    ensureRefs();
    if (!_overlay) return;
    _overlay.classList.remove('visible'); /* opacity 1→0, 280ms              */
    stopLoop();
    _hideTimer = setTimeout(function () {
      if (_overlay) _overlay.hidden = true; /* restore display:none after fade */
    }, 280);
  }

  /* ── Public API ──────────────────────────────────────────────── */
  window.OBSLoader = { show: show, hide: hide };

}());
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSIDEUM</title>
  <link rel="stylesheet" href="core.css">
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    /* ── Canvas — always behind, fixed, full screen ── */
    #crystal-canvas,
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Desktop grid ── */
    .app-desktop {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: var(--app-h, 100svh);
      height: var(--app-h, 100svh);
      overflow: hidden;
    }

    .content-area {
      display: grid;
      grid-template-columns: 360px 1fr;
      overflow: hidden;
    }

    .markets-layout { display: contents; }

    .token-list-col {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--trace);
    }

    .token-list { flex: 1; overflow-y: auto; }

    .right-panel { overflow: hidden; min-width: 360px; }

    .settings-layout {
      grid-column: 1 / -1;
      overflow-y: auto;
    }

    /* ── Sidebar shell ── */
    .sidebar {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #sidebar {
      background: rgba(7,7,9,.92);
      -webkit-backdrop-filter: blur(28px) saturate(160%) brightness(.96);
      backdrop-filter: blur(28px) saturate(160%) brightness(.96);
      border: none;
      border-right: 1px solid rgba(156,61,187,.22);
      box-shadow:
        0 0 0 0.5px rgba(156,61,187,.10),
        inset -1px 0 0 rgba(190,128,220,.08),
        6px 0 32px -4px  rgba(0,0,0,.60),
        20px 0 60px -12px rgba(0,0,0,.80);
    }

    .sidebar-wordmark {
      font-family: var(--fd);
      font-weight: 400;
      font-size: .92rem;
      letter-spacing: .20em;
      color: var(--br);
      padding: var(--sp-4) var(--sp-3) var(--sp-5);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
    }

    .sidebar-nav-indicator {
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      height: 46px;
      background: var(--em-2);
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.70),
        0 0 18px 4px rgba(156,61,187,.30);
      transition:
        transform 450ms var(--ease-spr),
        height    350ms var(--ease-spr);
      pointer-events: none;
      z-index: 10;
    }

    .sidebar-nav .nav-item {
      opacity: .28;
      color: var(--em-2);
      padding: .82rem .75rem;
      transition:
        opacity    200ms var(--ease-std),
        background 140ms var(--ease-std),
        transform  300ms var(--ease-spr);
    }
    .sidebar-nav .nav-item::before { display: none; }
    .sidebar-nav .nav-item.active {
      opacity: 1;
      color: var(--em-2);
      background: transparent;
    }
    .sidebar-nav .nav-item:hover:not(.active) {
      opacity: .55;
      background: transparent;
    }
    .sidebar-nav .nav-item:active {
      transform: scale(.96);
      transition: transform 80ms var(--ease-spr);
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
      flex-shrink: 0;
    }

    .nav-label {
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      line-height: 1;
    }

    .nav-item--settings {
      border-top: 1px solid var(--trace);
      margin-top: auto;
    }

    /* ── Wallet block ── */
    .sidebar-wallet-block {
      padding: var(--sp-2) var(--sp-3) var(--sp-3);
      border-bottom: 1px solid var(--trace);
    }

    .swb-card {
      background: rgba(156,61,187,.05);
      border: 1px solid rgba(156,61,187,.13);
      box-shadow:
        inset 0 1px 0 rgba(190,128,220,.07),
        inset 0 -1px 0 rgba(0,0,0,.18);
      padding: 9px 10px 8px 12px;
    }

    .swb-top {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 4px;
    }

    .swb-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      background: rgba(156,61,187,.30);
      transition: background 300ms var(--ease-std), box-shadow 300ms var(--ease-std);
    }
    .swb-dot.connected {
      background: var(--up);
      box-shadow: 0 0 6px 1px rgba(52,211,153,.50);
    }

    #sidebar-wallet {
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: .05em;
      color: var(--bd);
      flex: 1;
      min-height: 14px;
      transition: opacity 120ms var(--ease-std);
    }
    #sidebar-wallet:empty::before {
      content: 'no wallet connected';
      color: var(--dim);
      font-size: .58rem;
      letter-spacing: .08em;
      opacity: .50;
    }

    #sidebar-network {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
      padding-left: 12px;
      min-height: 12px;
      transition: color 140ms var(--ease-std);
    }
    #sidebar-network:empty::before {
      content: '— — —';
      opacity: .22;
    }

    .nav-item {
      background: transparent;
      border: none;
    }

    .nav-gear { flex-shrink: 0; }

    /* ── Search bar ── */
    .search-wrap {
      padding: var(--sp-3);
      border-bottom: 1px solid var(--trace);
      flex-shrink: 0;
    }

    /* ── Right panel transitions ── */
    .panel-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: opacity 160ms var(--ease-std);
    }

    .panel-content.leaving  { opacity: 0; }

    .panel-content.entering {
      animation: panelIn 240ms var(--ease-std) forwards;
    }

    @keyframes panelIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .panel-null-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel-null-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .44em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ── Responsive ── */
    @media (max-width: 767px) {
      .app-desktop { display: none; }
      .app-mobile {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        position: relative;
        z-index: 1;
      }
    }
    @media (min-width: 768px) {
      .app-desktop { display: grid; }
      .app-mobile  { display: none; }
    }

    /* ── Mobile layout ── */
    .mobile-top-bar {
      display: grid;
      grid-template-columns: 80px 1fr 80px;
      align-items: center;
      padding: 0 var(--sp-2);
      height: 56px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(156,61,187,.18);
      background: rgba(7,7,9,.80);
      -webkit-backdrop-filter: blur(24px) saturate(140%) brightness(.97);
      backdrop-filter: blur(24px) saturate(140%) brightness(.97);
    }

    .mobile-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .mobile-view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
    }

    /* ── Mobile bottom nav ── */
    .mobile-bottom-nav {
      display: flex;
      height: 62px;
      flex-shrink: 0;
      margin: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: rgba(7,7,9,.92);
      -webkit-backdrop-filter: blur(28px) saturate(160%) brightness(.96);
      backdrop-filter: blur(28px) saturate(160%) brightness(.96);
      border: 1px solid rgba(156,61,187,.22);
      box-shadow:
        0 0 0 0.5px rgba(156,61,187,.12),
        inset 0 1px 0 rgba(190,128,220,.08),
        0 8px 32px -8px rgba(0,0,0,.6),
        0 24px 60px -20px rgba(0,0,0,.85);
      position: relative;
      z-index: 200;
      transition: opacity 280ms var(--ease-out), transform 300ms var(--ease-spr);
    }

    .mobile-bottom-nav.nav-hidden {
      opacity: 0;
      transform: translateY(110%);
      pointer-events: none;
      height: 0;
      margin: 0;
      overflow: hidden;
      transition: opacity 200ms var(--ease-in), transform 240ms var(--ease-in),
                  height 220ms var(--ease-in), margin 220ms var(--ease-in);
    }

    .mobile-nav-indicator {
      position: absolute;
      top: -1px;
      left: 0;
      height: 2px;
      width: 50%;
      background: var(--em-2);
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.7),
        0 0 18px 4px rgba(156,61,187,.3);
      transition: transform 450ms var(--ease-spr);
      pointer-events: none;
    }

    .mobile-wordmark {
      font-family: var(--fd);
      font-weight: 400;
      font-size: .88rem;
      letter-spacing: .24em;
      color: var(--br);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      text-transform: uppercase;
      transition:
        color        220ms var(--ease-std),
        letter-spacing 220ms var(--ease-std),
        font-size    220ms var(--ease-std);
    }

    .mobile-wordmark.ctx-token {
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .42em;
      color: var(--em-2);
    }

    .mobile-wordmark.ctx-section {
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: .48em;
      color: var(--dim);
    }

    .mobile-back,
    .mobile-icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--dim);
      cursor: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition:
        color        160ms var(--ease-std),
        border-color 160ms var(--ease-std),
        background   160ms var(--ease-std);
    }

    .mobile-back {
      opacity: 0;
      pointer-events: none;
      transition:
        color        160ms var(--ease-std),
        border-color 160ms var(--ease-std),
        background   160ms var(--ease-std),
        opacity      200ms var(--ease-std);
    }
    .mobile-back.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-back:hover,
    .mobile-icon-btn:hover {
      color: var(--em-2);
      border-color: var(--em-lo);
      background: var(--em-tr);
    }
    .mobile-back:active,
    .mobile-icon-btn:active {
      transform: scale(.90);
      background: rgba(156,61,187,.14);
      transition: transform 80ms var(--ease-spr), background 80ms var(--ease-spr);
    }
    .mobile-back:focus-visible,
    .mobile-icon-btn:focus-visible {
      outline: 1.5px solid rgba(156,61,187,.50);
      outline-offset: 2px;
    }

    .mobile-top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
    }

    .mobile-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: transparent;
      border: none;
      opacity: .30;
      padding: 8px 0;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      transition: opacity 200ms var(--ease-std), transform 300ms var(--ease-spr);
    }
    .mobile-nav-item:active              { transform: scale(.92); transition: transform 80ms var(--ease-spr); }
    .mobile-nav-item.active              { opacity: 1; }
    .mobile-nav-item:hover:not(.active)  { opacity: .52; }

    .mobile-nav-icon {
      width: 18px;
      height: 18px;
      stroke: var(--em-2);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    .mobile-nav-label {
      font-family: var(--fm);
      font-size: 7.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--em-2);
      line-height: 1;
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 3A — TOKEN ROW COMPONENT
       ══════════════════════════════════════════════════════════════ */

    .skeleton {
      background: linear-gradient(
        90deg,
        var(--trace)              0%,
        rgba(156,61,187,.08)     50%,
        var(--trace)             100%
      );
      background-size: 200% 100%;
      animation: skeleton-sweep 1.8s var(--ease-std) infinite;
      border-radius: 2px;
    }
    @keyframes skeleton-sweep {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .token-row--skeleton { pointer-events: none; }

    .token-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      position: relative;
      border-bottom: 1px solid var(--trace);
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      min-height: 58px;
      transition: background 140ms var(--ease-std);
    }

    .token-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--em);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 160ms var(--ease-spr);
      pointer-events: none;
    }

    .token-row:hover                 { background: var(--hi); }
    .token-row:hover::before         { transform: scaleY(1); }
    .token-row:active                { background: var(--em-tr); transition: background 80ms var(--ease-spr); }
    .token-row:focus-visible         { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: -1.5px; }

    .token-row-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      position: relative;
    }

    .token-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: block;
      object-fit: cover;
    }

    .token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .64rem;
      letter-spacing: 0;
      color: #ffffff;
      flex-shrink: 0;
    }

    .token-row-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .token-row-name {
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-row-symbol {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .18em;
      color: var(--em-2);
      text-transform: uppercase;
      line-height: 1;
    }

    .token-row-chain {
      font-family: var(--fm);
      font-size: .54rem;
      letter-spacing: .22em;
      color: var(--dim);
      text-transform: uppercase;
      line-height: 1;
    }

    .token-row-sparkline {
      width: 56px;
      height: 24px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 200ms var(--ease-std);
      display: none;
    }

    .token-row-sparkline.sparkline-up { color: var(--up); }
    .token-row-sparkline.sparkline-dn { color: var(--dn); }

    @media (min-width: 768px) {
      .token-row-sparkline { display: block; }
    }

    .token-row:hover .token-row-sparkline { opacity: 1; }

    .token-row-price {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    .token-row-usd {
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1.1;
      transition: opacity 80ms var(--ease-in), color 600ms var(--ease-std);
    }

    .token-row-change {
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: .04em;
      line-height: 1;
    }
    .token-row-change.up                    { color: var(--up); }
    .token-row-change.dn                    { color: var(--dn); }
    .token-row-change:not(.up):not(.dn)     { color: var(--dim); }

    .token-row-volume {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .06em;
      color: var(--dim);
      line-height: 1;
    }

    #mobile-markets {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .token-list-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-6);
      min-height: 160px;
    }

    .token-list-empty-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .28em;
      color: var(--dim);
      text-transform: uppercase;
    }

    .token-list-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      padding: var(--sp-6);
      min-height: 160px;
    }

    .token-list-error-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .22em;
      color: var(--dn);
      text-transform: uppercase;
    }

    .token-list-retry {
      background: transparent;
      border: 1px solid var(--trace);
      color: var(--dim);
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: none;
      transition:
        border-color 120ms var(--ease-std),
        color        120ms var(--ease-std);
    }
    .token-list-retry:hover {
      border-color: var(--em-lo);
      color: var(--em-2);
    }

    /* ══════════════════════════════════════════════════════════════
       PHASE 4A — TOKEN PANEL: HEADER + PRICE DISPLAY
       ══════════════════════════════════════════════════════════════ */

    .token-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: var(--sp-5) var(--sp-5) var(--sp-6);
    }

    @media (max-width: 767px) {
      .token-panel { padding: var(--sp-4) var(--sp-3) var(--sp-5); }
    }

    .token-panel-header {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-bottom: var(--sp-4);
      flex-shrink: 0;
    }

    .token-panel-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: block;
      object-fit: cover;
    }

    .token-logo-fallback-lg {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .88rem;
      letter-spacing: 0;
      color: #ffffff;
      flex-shrink: 0;
    }

    .token-panel-identity {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      min-width: 0;
    }

    .token-panel-name {
      font-family: var(--fd);
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: .08em;
      color: var(--br);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-panel-symbol {
      font-family: var(--fm);
      font-size: .72rem;
      font-weight: 300;
      letter-spacing: .52em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1;
    }

    .token-panel-price {
      margin-bottom: var(--sp-5);
      flex-shrink: 0;
    }

    .token-panel-usd {
      display: block;
      font-family: var(--fm);
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1;
      margin-bottom: var(--sp-2);
      transition: color 80ms var(--ease-std);
    }

    .token-panel-change {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-family: var(--fm);
      font-size: .82rem;
      font-weight: 300;
      letter-spacing: .04em;
      line-height: 1;
    }

    .token-panel-change.up { color: var(--up); }
    .token-panel-change.dn { color: var(--dn); }

    .token-panel-change-period {
      font-family: var(--fm);
      font-size: .64rem;
      font-weight: 300;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--dim);
      margin-left: var(--sp-1);
    }

    .token-panel-chart-slot {
      flex-shrink: 0;
    }

    .tp-skel-logo   { width: 40px;  height: 40px;  border-radius: 50%;  }
    .tp-skel-name   { width: 140px; height: 22px;  margin-bottom: 6px;  }
    .tp-skel-sym    { width: 56px;  height: 10px;  }
    .tp-skel-price  { width: 180px; height: 34px;  margin-bottom: 10px; }
    .tp-skel-change { width: 120px; height: 13px;  }

    /* ══════════════════════════════════════════════════════════════
       PHASE 4B — PRICE CHART (Lightweight Charts)
       ══════════════════════════════════════════════════════════════ */

    .price-chart {
      width: 100%;
      height: 200px;
      position: relative;
    }

    .chart-time-toggles {
      display: flex;
      align-items: center;
      gap: 0;
      position: relative;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .chart-toggle-indicator {
      position: absolute;
      bottom: 0;
      height: 1.5px;
      background: var(--em);
      border-radius: 1px;
      box-shadow:
        0 0 6px 1px rgba(156,61,187,.55),
        0 0 14px 3px rgba(156,61,187,.22);
      pointer-events: none;
      transition: left 220ms var(--ease-spr), width 220ms var(--ease-spr);
    }

    .chart-toggle {
      font-family: var(--fm);
      font-size: .64rem;
      font-weight: 300;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--dim);
      background: transparent;
      border: none;
      padding: var(--sp-1) var(--sp-3) var(--sp-2);
      cursor: none;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      line-height: 1;
      transition: color 200ms var(--ease-std);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .chart-toggle.active             { color: var(--em-2); }
    .chart-toggle:hover:not(.active) { color: var(--bd); }
    .chart-toggle:active             { transform: scale(.94); transition: transform 80ms var(--ease-spr); }
    .chart-toggle:focus-visible      { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: 2px; }

    /* ══════════════════════════════════════════════════════════════
       PHASE 4C — STAT CELLS + SWAP BUTTON
       ══════════════════════════════════════════════════════════════ */

    /* Stat row — three equal glass-s cells */
    .token-panel-stats {
      display: flex;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
      flex-shrink: 0;
    }

    /* Individual stat cell */
    .token-stat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: var(--sp-3) var(--sp-2) calc(var(--sp-3) - 2px);
      background: rgba(9,7,14,.48);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      backdrop-filter: blur(12px) saturate(120%);
      border: 1px solid rgba(156,61,187,.13);
      box-shadow:
        inset 0 1px 0 rgba(156,61,187,.18),
        0 2px 12px rgba(0,0,0,.22);
      position: relative;
      overflow: hidden;
      cursor: default;
      transition:
        background    180ms var(--ease-std),
        border-color  180ms var(--ease-std),
        box-shadow    180ms var(--ease-std);
    }

    /* Subtle left edge accent — slides in on hover */
    .token-stat::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 1.5px;
      background: var(--em);
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 220ms var(--ease-spr);
      pointer-events: none;
    }

    .token-stat:hover {
      background: rgba(156,61,187,.06);
      border-color: rgba(156,61,187,.16);
    }
    .token-stat:hover::before { transform: scaleY(1); }

    .token-stat-label {
      font-family: var(--fm);
      font-size: .54rem;
      letter-spacing: .40em;
      color: var(--dim);
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .token-stat-value {
      font-family: var(--fm);
      font-size: .84rem;
      letter-spacing: .02em;
      color: var(--br);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sub-detail — hidden until hover, slides up into view */
    .token-stat-sub {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .14em;
      color: var(--dim);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(5px);
      transition:
        opacity   220ms var(--ease-out),
        transform 220ms var(--ease-spr);
      /* prevents layout shift — the cell height accounts for this line always */
      max-height: 12px;
    }

    .token-stat:hover .token-stat-sub {
      opacity: .65;
      transform: translateY(0);
    }

    /* Skeleton stat cells */
    .tp-skel-stats {
      display: flex;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
      flex-shrink: 0;
    }

    .tp-skel-stat {
      flex: 1;
      padding: var(--sp-3) var(--sp-2);
      background: rgba(156,61,187,.03);
      border: 1px solid rgba(156,61,187,.07);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* SWAP button — no pulse rings, no scan animation.
       Glass sheen + fill gradient + left bar on hover. Active scale only. */
    .token-panel-action {
      margin-top: var(--sp-4);
      flex-shrink: 0;
    }

    .tp-swap-btn {
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .40em;
      text-transform: uppercase;
      padding: 0;
      background: transparent;
      border: none;
      outline: none;
      display: flex;
      width: 100%;
      cursor: none;
      position: relative;
    }

    .tp-swap-btn:disabled {
      opacity: .28;
      pointer-events: none;
    }

    .tp-swap-btn .tp-btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 0;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: rgba(156,61,187,.06);
      color: var(--br);
      border: 1px solid var(--em);
      transition:
        border-color 300ms var(--ease-std),
        box-shadow   400ms var(--ease-std);
    }

    /* Left violet accent bar — scaleY on hover */
    .tp-swap-btn .tp-btn-inner::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: rgba(190,128,220,.22);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 300ms var(--ease-spr);
      z-index: 2;
      pointer-events: none;
    }

    /* Fill gradient sweeps bottom → top on hover */
    .tp-swap-btn .tp-btn-inner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        155deg,
        rgba(180,60,220,.26)  0%,
        rgba(156,61,187,.14) 35%,
        rgba(156,61,187,.20) 65%,
        rgba(100,20,150,.28) 100%
      );
      transform: translateY(101%);
      transition: transform 400ms var(--ease-spr);
      z-index: 0;
      pointer-events: none;
    }

    /* Label — above all pseudo-layers */
    .tp-swap-btn .tp-btn-inner span {
      position: relative;
      z-index: 3;
    }

    /* Diagonal sheen sweep — passes left to right on hover */
    .tp-swap-btn .tp-sheen {
      position: absolute;
      top: 0; bottom: 0;
      width: 55%;
      background: linear-gradient(
        115deg,
        transparent 25%,
        rgba(255,255,255,.10) 48%,
        transparent 72%
      );
      transform: translateX(-160%) skewX(-15deg);
      transition: transform 700ms var(--ease-spr);
      z-index: 1;
      pointer-events: none;
      will-change: transform;
    }

    .tp-swap-btn:hover .tp-btn-inner {
      border-color: var(--em);
      box-shadow:
        0 0 28px rgba(156,61,187,.28),
        0 0 56px rgba(156,61,187,.10);
    }
    .tp-swap-btn:hover .tp-sheen              { transform: translateX(160%) skewX(-15deg); }
    .tp-swap-btn:hover .tp-btn-inner::before  { transform: scaleY(1); }
    .tp-swap-btn:hover .tp-btn-inner::after   { transform: translateY(0); }
    .tp-swap-btn:active .tp-btn-inner         { transform: scale(.97); transition: transform 80ms var(--ease-spr); }
    .tp-swap-btn:focus-visible .tp-btn-inner  { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: 3px; }

    /* Mobile stat cells — tighter padding, reduced tracking to prevent truncation */
    @media (max-width: 767px) {
      .token-stat {
        padding: var(--sp-2) var(--sp-2) 10px;
      }
      .token-stat-label {
        letter-spacing: .12em;
      }
      .token-stat-value {
        font-size: .76rem;
      }
      /* Touch: sub-detail always visible on mobile — no hover */
      .token-stat-sub {
        opacity: .50;
        transform: none;
      }
    }


    /* ══════════════════════════════════════════════════════════════
       PHASE 5A — SWAP CARD
       Architecture: each side (FROM/TO) is a unified glass slot —
       token selector + amount input share one bordered surface.
       Slot glows on :focus-within. No nested backdrop-filter.
       ══════════════════════════════════════════════════════════════ */

    /* ── Outer scroll container ── */
    .swap-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: var(--sp-4) var(--sp-4) var(--sp-5);
      align-items: center;
    }

    @media (max-width: 767px) {
      .swap-view {
        padding: var(--sp-4) var(--sp-3);
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
        align-items: stretch;
      }
    }

    /* ── Swap card — glass-p, centered, constrained ── */
    .swap-card {
      max-width: 440px;
      width: 100%;
      border-radius: 14px;
      padding: var(--sp-4) var(--sp-4) var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    /* ── SIDE LABEL — eyebrow above each slot ── */
    .swap-side-label {
      display: block;
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: .52em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 6px;
      padding-left: 2px;
      line-height: 1;
    }

    /* ── SLOT — the unified FROM/TO surface ──
       No backdrop-filter: nested inside glass-p.
       Active/focus glow achieved via border + box-shadow only.     ── */
    .swap-slot {
      background: rgba(156,61,187,.025);
      border: 1px solid rgba(156,61,187,.09);
      border-radius: 10px;
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(156,61,187,.06);
      transition:
        border-color 160ms var(--ease-std),
        box-shadow   200ms var(--ease-std),
        background   160ms var(--ease-std);
      position: relative;
    }
    .swap-slot:focus-within {
      border-color: rgba(156,61,187,.28);
      background: rgba(156,61,187,.04);
      box-shadow:
        inset 0 1px 0 rgba(156,61,187,.10),
        0 0 0 3px rgba(156,61,187,.06),
        0 0 20px rgba(156,61,187,.08);
    }

    /* ── TOKEN SELECTOR ROW inside slot ── */
    .swap-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      background: transparent;
      border: none;
      /* clickable width */
      align-self: flex-start;
      min-width: 0;
    }
    .swap-selector:focus-visible {
      outline: 1.5px solid rgba(156,61,187,.50);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* selector hover: token symbol brightens */
    .swap-selector:hover .swap-token-symbol  { color: var(--br); }
    .swap-selector:hover .swap-chevron-path  { stroke: var(--em-2); }
    .swap-selector:active .swap-token-symbol { opacity: .70; }

    /* ── Token logo in selector ── */
    .swap-token-logo {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: block;
      flex-shrink: 0;
      object-fit: cover;
    }

    .swap-token-logo-fallback {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: 0;
      color: #fff;
      flex-shrink: 0;
    }

    /* ── Token symbol in selector ── */
    .swap-token-symbol {
      font-family: var(--fm);
      font-size: .78rem;
      letter-spacing: .06em;
      color: var(--bd);
      line-height: 1;
      white-space: nowrap;
      transition: color 120ms var(--ease-std);
    }

    /* ── Chevron ── */
    .swap-chevron {
      width: 8px;
      height: 5px;
      flex-shrink: 0;
      display: block;
      overflow: visible;
    }
    .swap-chevron-path {
      transition: stroke 120ms var(--ease-std);
    }

    /* ── Amount input — large, no own border (slot IS the border) ── */
    .swap-amount {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none;
      width: 100%;
      padding: 0;
      font-family: var(--fm);
      font-size: 1.68rem;
      letter-spacing: -.01em;
      color: var(--br);
      line-height: 1;
      caret-color: var(--em-2);
    }
    .swap-amount::placeholder {
      color: rgba(222,228,244,.14);
      opacity: 1;
    }
    .swap-amount::-webkit-inner-spin-button,
    .swap-amount::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Balance / price hint ── */
    .swap-balance {
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .10em;
      color: var(--dim);
      display: block;
      line-height: 1;
    }

    /* ── Output amount display (TO slot — read-only large number) ── */
    .swap-amount-out {
      font-family: var(--fm);
      font-size: 1.68rem;
      letter-spacing: -.01em;
      color: rgba(222,228,244,.18);
      line-height: 1;
      min-height: 1.68rem;
      display: block;
      transition: color 280ms var(--ease-std);
    }
    .swap-amount-out.has-value { color: var(--br); }

    /* ── DIRECTION FLIP BUTTON — architectural centerpiece ──
       Sits between the two slots. Ring pulse on hover.            ── */
    .swap-dir-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 32px;
      flex-shrink: 0;
    }

    /* Horizontal rule — decorative line across */
    .swap-dir-wrap::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(156,61,187,.14) 20%,
        rgba(156,61,187,.20) 50%,
        rgba(156,61,187,.14) 80%,
        transparent
      );
    }

    .swap-dir-btn {
      position: relative;
      z-index: 1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(7,7,9,.80);
      border: 1px solid rgba(156,61,187,.24);
      color: var(--em-2);
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 0 4px rgba(7,7,9,.80);
      transition:
        background    180ms var(--ease-std),
        border-color  180ms var(--ease-std),
        box-shadow    180ms var(--ease-std);
    }
    .swap-dir-btn::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid transparent;
      transition: border-color 180ms var(--ease-std);
    }
    .swap-dir-btn:hover {
      background: rgba(156,61,187,.14);
      border-color: rgba(156,61,187,.55);
      box-shadow: 0 0 0 4px rgba(7,7,9,.80), 0 0 16px rgba(156,61,187,.22);
    }
    .swap-dir-btn:hover::after {
      border-color: rgba(156,61,187,.12);
    }
    .swap-dir-btn:active {
      transform: scale(.88);
      transition: transform 80ms var(--ease-spr);
    }
    .swap-dir-btn:focus-visible {
      outline: 1.5px solid rgba(156,61,187,.50);
      outline-offset: 4px;
    }

    /* ── META ROW — rate + fee ── */
    .swap-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 2px;
      min-height: 18px;
    }

    .swap-rate {
      font-family: var(--fm);
      font-size: .70rem;
      letter-spacing: .02em;
      color: var(--dim);
      line-height: 1;
      transition: color 200ms var(--ease-std);
    }
    .swap-rate.has-rate { color: var(--bd); }

    .swap-fee {
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1;
    }

    .swap-fee-value {
      color: var(--em-2);
      letter-spacing: .06em;
    }

    /* ── PRICE IMPACT — hidden until > 1% ── */
    .swap-impact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(220,180,40,.04);
      border: 1px solid rgba(220,180,40,.12);
      box-shadow: inset 0 1px 0 rgba(220,180,40,.06);
    }
    .swap-impact.high {
      background: rgba(220,80,80,.05);
      border-color: rgba(220,80,80,.16);
      box-shadow: inset 0 1px 0 rgba(220,80,80,.06);
    }

    .swap-impact-label {
      font-family: var(--fm);
      font-size: .50rem;
      letter-spacing: .44em;
      text-transform: uppercase;
      color: var(--warn);
      line-height: 1;
    }
    .swap-impact.high .swap-impact-label { color: var(--dn); }

    .swap-impact-value {
      font-family: var(--fm);
      font-size: .72rem;
      letter-spacing: .02em;
      color: var(--warn);
      line-height: 1;
    }
    .swap-impact.high .swap-impact-value { color: var(--dn); }

    /* ── EXECUTE BUTTON — full width, btn-primary ── */
    .swap-execute {
      width: 100%;
      display: flex;
      margin-top: 6px;
    }
    .swap-execute .btn-inner {
      width: 100%;
      min-width: 0;
      padding: 17px 0;
    }
    /* Loading/confirming state: dim the text, no pointer */
    .swap-execute.confirming .btn-inner span { opacity: .55; }
    .swap-execute.confirming { pointer-events: none; }

    /* ── SUCCESS STATE ── */
    .swap-success {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      flex: 1;
      padding: var(--sp-5) var(--sp-4);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }

    .success-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(52,211,153,.06);
      border: 1px solid rgba(52,211,153,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 24px rgba(52,211,153,.10);
    }

    .success-check  { display: block; overflow: visible; }

    .check-line {
      stroke-dasharray: 52;
      stroke-dashoffset: 52;
    }

    .success-label {
      font-family: var(--fd);
      font-size: 1.4rem;
      letter-spacing: .08em;
      color: var(--br);
      line-height: 1;
    }

    .success-sublabel {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--dim);
      margin-top: -8px;
    }

    .success-hash {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .04em;
      color: var(--bd);
      word-break: break-all;
      max-width: 320px;
      opacity: .60;
      padding: 10px 14px;
      background: rgba(156,61,187,.03);
      border: 1px solid var(--trace);
      border-radius: 6px;
      width: 100%;
    }

    .success-etherscan {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--em-2);
      text-decoration: none;
      opacity: 0;
      transition: opacity 240ms var(--ease-out);
    }
    .success-etherscan.visible  { opacity: 1; }
    .success-etherscan:hover    { text-decoration: underline; }

    .swap-again {
      align-self: center;
      opacity: 0;
      transition: opacity 240ms var(--ease-out);
    }
    .swap-again.visible { opacity: 1; }

    /* ── SKELETON — loading state ── */
    .swap-skeleton {
      max-width: 440px;
      width: 100%;
      border-radius: 14px;
      background: rgba(7,7,9,.45);
      border: 1px solid rgba(156,61,187,.13);
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }
    .swap-skel-slot  { height: 90px; border-radius: 10px; }
    .swap-skel-dir   { height: 32px; border-radius: 0; background: transparent !important; animation: none !important; }
    .swap-skel-btn   { height: 54px; margin-top: 6px; }

    /* ── ERROR STATE ── */
    .swap-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-5) var(--sp-4);
      text-align: center;
    }
    .swap-error-label {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .30em;
      text-transform: uppercase;
      color: var(--dn);
    }
    .swap-retry {
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--trace);
      color: var(--dim);
      padding: 6px 16px;
      cursor: none;
      transition: border-color 120ms var(--ease-std), color 120ms var(--ease-std);
    }
    .swap-retry:hover { border-color: var(--em-lo); color: var(--em-2); }

    /* ══════════════════════════════════════════════════════════════
       PHASE 5A — TOKEN PICKER OVERLAY
       ══════════════════════════════════════════════════════════════ */

    .token-picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.68);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms var(--ease-std);
    }
    .token-picker-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .token-picker {
      width: 380px;
      max-width: calc(100vw - 32px);
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      overflow: hidden;
      transform: translateY(14px) scale(.97);
      opacity: 0;
      transition:
        transform 220ms var(--ease-spr),
        opacity   180ms var(--ease-std);
    }
    .token-picker-overlay.open .token-picker {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .token-picker-header {
      padding: var(--sp-4) var(--sp-4) var(--sp-3);
      border-bottom: 1px solid var(--trace);
      flex-shrink: 0;
    }

    .token-picker-title {
      font-family: var(--fm);
      font-size: .52rem;
      letter-spacing: .52em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: var(--sp-2);
      line-height: 1;
    }

    .token-picker-search { border-radius: 6px; }

    .token-picker-list   { flex: 1; overflow-y: auto; }

    /* ── Picker token rows ── */
    .picker-token-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: none;
      border-bottom: 1px solid var(--trace);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 120ms var(--ease-std);
    }
    .picker-token-row:hover            { background: var(--hi); }
    .picker-token-row:active           { background: var(--em-tr); transition: background 80ms var(--ease-spr); }
    .picker-token-row:focus-visible    { outline: 1.5px solid rgba(156,61,187,.50); outline-offset: -1.5px; }
    .picker-token-row.selected         { opacity: .35; pointer-events: none; }

    .picker-token-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    .picker-token-logo-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--em);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .62rem;
      letter-spacing: 0;
      color: #fff;
      flex-shrink: 0;
    }

    .picker-token-info { flex: 1; min-width: 0; }

    .picker-token-name {
      display: block;
      font-family: var(--fm);
      font-size: .80rem;
      letter-spacing: .02em;
      color: var(--br);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      line-height: 1.1;
    }

    .picker-token-symbol {
      display: block;
      font-family: var(--fm);
      font-size: .60rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--em-2);
      line-height: 1;

    .picker-token-price {
      font-family: var(--fm);
      font-size: .72rem;
      letter-spacing: .02em;
      color: var(--bd);
      flex-shrink: 0;
      line-height: 1;

<!-- ── Phase 2C — Navigation wiring ─────────────────────────────── -->
<script>
(function () {
  'use strict';

  var marketsLayout  = document.getElementById('markets-layout');
  var settingsLayout = document.getElementById('settings-layout');
  var rightContent   = document.getElementById('right-panel-content');
  var panelNull      = document.getElementById('panel-null');
  var mobileBack     = document.getElementById('mobile-back');
  var sidebarWallet  = document.getElementById('sidebar-wallet');
  var sidebarNetwork = document.getElementById('sidebar-network');

  var mobileViews = {
    markets:  document.getElementById('mobile-markets'),
    token:    document.getElementById('mobile-token'),
    swap:     document.getElementById('mobile-swap'),
    history:  document.getElementById('mobile-history'),
    settings: document.getElementById('mobile-settings'),
  };

  var NETWORK_NAMES = {
    1: 'Ethereum', 42161: 'Arbitrum One', 8453: 'Base', 10: 'Optimism',
  };

  function renderPanelContent(state) {
    panelNull.hidden = (state !== null);
    document.dispatchEvent(new CustomEvent('panel:render', { detail: state }));
  }

  function setRightPanel(state) {
    rightContent.classList.add('leaving');
    setTimeout(function () {
      renderPanelContent(state);
      rightContent.classList.remove('leaving');
      void rightContent.offsetWidth;
      rightContent.classList.add('entering');
      setTimeout(function () { rightContent.classList.remove('entering'); }, 240);
    }, 160);
  }

  function setView(view) {
    if (view === 'settings') {
      marketsLayout.style.display = 'none';
      settingsLayout.hidden = false;
    } else {
      marketsLayout.style.display = '';
      settingsLayout.hidden = true;
    }
    updateSidebarActive();
  }

  function updateSidebarActive() {
    var view  = STATE.view;
    var panel = STATE.rightPanel;
    document.querySelectorAll('.sidebar .nav-item').forEach(function (btn) {
      var v = btn.dataset.view;
      var active =
        (v === 'markets'  && view === 'markets'  && (panel === null || panel === 'token')) ||
        (v === 'swap'     && view === 'markets'  && panel === 'swap')    ||
        (v === 'history'  && view === 'markets'  && panel === 'history') ||
        (v === 'settings' && view === 'settings');
      btn.classList.toggle('active', active);
    });
    updateSidebarIndicator();
  }

  function updateSidebarIndicator() {
    var indicator  = document.getElementById('sidebar-nav-indicator');
    if (!indicator) return;

    var activeItem = document.querySelector('.sidebar-nav .nav-item.active');
    if (!activeItem) { indicator.style.opacity = '0'; return; }

    if (!indicator._ready) {
      indicator.style.transition = 'none';
      indicator.style.height     = activeItem.offsetHeight + 'px';
      indicator.style.transform  = 'translateY(' + activeItem.offsetTop + 'px)';
      indicator.style.opacity    = '1';
      indicator._ready = true;
      requestAnimationFrame(function () { indicator.style.transition = ''; });
      return;
    }

    indicator.style.opacity   = '1';
    indicator.style.height    = activeItem.offsetHeight + 'px';
    indicator.style.transform = 'translateY(' + activeItem.offsetTop + 'px)';
  }

  var mobileWordmark  = document.querySelector('.mobile-wordmark');
  var mobileBottomNav = document.getElementById('mobile-bottom-nav');

  function setMobileView(view) {
    Object.keys(mobileViews).forEach(function (key) {
      mobileViews[key].hidden = (key !== view);
    });

    mobileBack.classList.toggle('visible', view === 'token');

    var topLevel = (view === 'markets' || view === 'swap');
    mobileBottomNav.classList.toggle('nav-hidden', !topLevel);

    mobileWordmark.classList.remove('ctx-token', 'ctx-section');
    if (view === 'token') {
      var tList = window.STATE && STATE.tokenList;
      var match = tList && tList.find(function (t) { return t.address === STATE.token; });
      mobileWordmark.textContent = match ? match.symbol : 'OBSIDEUM';
      mobileWordmark.classList.add('ctx-token');
    } else if (view === 'history' || view === 'settings') {
      mobileWordmark.textContent = view.toUpperCase();
      mobileWordmark.classList.add('ctx-section');
    } else {
      mobileWordmark.textContent = 'OBSIDEUM';
    }

    updateMobileNavActive(view);
  }

  function updateMobileNavActive(view) {
    var items = Array.from(document.querySelectorAll('.mobile-nav-item'));
    items.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.mobileView === view);
    });
    var idx = items.findIndex(function (btn) { return btn.dataset.mobileView === view; });
    var indicator = document.getElementById('mobile-nav-indicator');
    if (indicator && idx > -1) {
      indicator.style.transform = 'translateX(' + (idx * 100) + '%)';
    }
  }

  function navigateMobile(view) {
    setState({ prevMobileView: STATE.mobileView, mobileView: view });
  }

  function truncateAddress(addr) {
    return addr ? addr.slice(0, 6) + '...' + addr.slice(-4) : '';
  }

  document.addEventListener('state:view',       function (e) { setView(e.detail); });
  document.addEventListener('state:rightPanel',  function (e) { setRightPanel(e.detail); updateSidebarActive(); });
  document.addEventListener('state:mobileView',  function (e) { setMobileView(e.detail); });

  document.addEventListener('state:wallet', function (e) {
    var addr = e.detail;
    sidebarWallet.textContent = addr ? truncateAddress(addr) : '';
    sidebarWallet.style.color = '';
    var dot = document.getElementById('swb-dot');
    if (dot) dot.classList.toggle('connected', !!addr);
  });

  document.addEventListener('state:ens', function (e) {
    var ens = e.detail;
    if (!ens || !STATE.wallet) return;
    sidebarWallet.style.opacity = '0';
    setTimeout(function () {
      sidebarWallet.textContent   = ens;
      sidebarWallet.style.color   = 'var(--em-2)';
      sidebarWallet.style.opacity = '1';
    }, 100);
  });

  document.addEventListener('state:network', function (e) {
    var id   = e.detail;
    var name = NETWORK_NAMES[id] || ('Chain ' + id);
    sidebarNetwork.textContent = id ? name : '';
    var wrong = id && STATE.settings.defaultNetwork && id !== STATE.settings.defaultNetwork;
    sidebarNetwork.style.color = wrong ? 'var(--warn)' : '';
  });

  document.querySelectorAll('.sidebar-nav .nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var v = btn.dataset.view;
      if      (v === 'markets') setState({ view: 'markets', rightPanel: null });
      else if (v === 'swap')    setState({ view: 'markets', rightPanel: 'swap' });
      else if (v === 'history') setState({ view: 'markets', rightPanel: 'history' });
    });
  });

  document.getElementById('settings-btn').addEventListener('click', function () {
    setState({ view: 'settings' });
  });

  document.querySelectorAll('.mobile-nav-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var view = btn.dataset.mobileView;
      if (view) navigateMobile(view);
    });
  });

  document.getElementById('mobile-history-btn').addEventListener('click', function () {
    navigateMobile('history');
  });
  document.getElementById('mobile-settings-btn').addEventListener('click', function () {
    navigateMobile('settings');
  });

  mobileBack.addEventListener('click', function () {
    navigateMobile(STATE.prevMobileView || 'markets');
  });

  window.addEventListener('resize', updateSidebarIndicator);

  (function () {
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight);
  }());

  setView(STATE.view              || 'markets');
  setMobileView(STATE.mobileView  || 'markets');
  setRightPanel(STATE.rightPanel);
  requestAnimationFrame(updateSidebarIndicator);

}());
</script>

    if (usd >= 10000) return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (usd >= 1)     return '$' + usd.toFixed(2);
    return '$' + usd.toFixed(4);
  }

  function formatChange(change) {
    return (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
  }

  function formatVolume(vol) {
    if (!vol)       return '';
    if (vol >= 1e9) return '$' + (vol / 1e9).toFixed(1) + 'B';
    if (vol >= 1e6) return '$' + (vol / 1e6).toFixed(1) + 'M';
    if (vol >= 1e3) return '$' + (vol / 1e3).toFixed(1) + 'K';
    return '$' + Math.round(vol);
  }

  function buildSparklineSVG(isUp) {
    var up = '2,20 6,17 11,18 17,13 23,15 29,10 35,12 41,7 47,9 54,5';
    var dn = '2,5  6,8  11,6  17,11 23,9  29,14 35,12 41,17 47,14 54,20';
    return '<svg width="56" height="24" viewBox="0 0 56 24" fill="none" aria-hidden="true">'
      + '<polyline points="' + (isUp ? up : dn) + '"'
      + ' stroke="currentColor" stroke-width="1.5"'
      + ' stroke-linecap="round" stroke-linejoin="round"/>'
      + '</svg>';
  }

  function buildSkeletonRow() {
    var row = document.createElement('div');
    row.className = 'token-row token-row--skeleton';
    row.innerHTML =
      '<div class="token-row-logo">'
      +   '<div class="skeleton" style="width:28px;height:28px;border-radius:50%"></div>'
      + '</div>'
      + '<div class="token-row-info">'
      +   '<div class="skeleton" style="width:90px;height:11px;margin-bottom:6px"></div>'
      +   '<div class="skeleton" style="width:40px;height:9px"></div>'
      + '</div>'
      + '<div class="token-row-price">'
      +   '<div class="skeleton" style="width:72px;height:11px;margin-bottom:6px"></div>'
      +   '<div class="skeleton" style="width:48px;height:9px"></div>'
      + '</div>';
    return row;
  }

  function buildTokenRow(token, price) {
    var row = document.createElement('div');
    row.className = 'token-row';
    row.setAttribute('data-address', token.address);
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');

    var change      = price ? price.change24h : 0;
    var changeClass = change > 0 ? 'up' : change < 0 ? 'dn' : '';
    var changeText  = price ? formatChange(change) : '\u2014';
    var priceText   = price ? formatPrice(price.usd) : '\u2014';
    var volumeText  = formatVolume(MOCK_VOLUMES[token.address]);
    var isUp        = change >= 0;

    row.innerHTML =
      '<div class="token-row-logo">'
      +   '<img class="token-logo" src="' + getLogoUrl(token.address) + '"'
      +   ' alt="' + token.symbol + '" width="28" height="28">'
      +   '<div class="token-logo-fallback" style="display:none">' + token.symbol[0] + '</div>'
      + '</div>'
      + '<div class="token-row-info">'
      +   '<span class="token-row-name">'   + token.name   + '</span>'
      +   '<span class="token-row-symbol">' + token.symbol + '</span>'
      +   '<span class="token-row-chain">Ethereum</span>'
      + '</div>'
      + '<div class="token-row-sparkline ' + (isUp ? 'sparkline-up' : 'sparkline-dn') + '">'
      +   buildSparklineSVG(isUp)
      + '</div>'
      + '<div class="token-row-price">'
      +   '<span class="token-row-usd" data-address="' + token.address + '">' + priceText + '</span>'
      +   '<span class="token-row-change ' + changeClass + '">' + changeText + '</span>'
      +   (volumeText ? '<span class="token-row-volume">' + volumeText + '</span>' : '')
      + '</div>';

    var img      = row.querySelector('.token-logo');
    var fallback = row.querySelector('.token-logo-fallback');
    img.onerror  = function () {
      img.style.display      = 'none';
      fallback.style.display = 'flex';
    };

    row.addEventListener('click',   function () { navigateToToken(token.address); });
    row.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        navigateToToken(token.address);
      }
    });

    return row;
  }

  function buildEmptyState(query) {
    var div = document.createElement('div');
    div.className = 'token-list-empty';
    div.innerHTML = '<span class="token-list-empty-label">'
      + (query ? 'No results for \u201c' + query + '\u201d' : 'No tokens available')
      + '</span>';
    return div;
  }

  function buildErrorState() {
    var div = document.createElement('div');
    div.className = 'token-list-error';
    div.innerHTML =
      '<span class="token-list-error-label">Price feed unavailable</span>'
      + '<button class="token-list-retry">Retry</button>';
    div.querySelector('.token-list-retry').addEventListener('click', boot);
    return div;
  }

  function navigateToToken(address) {
    if (!window.STATE || !window.setState) return;
    if (window.innerWidth >= 768) {
      setState({ rightPanel: 'token', token: address });
    } else {
      setState({ prevMobileView: STATE.mobileView, mobileView: 'token', token: address });
    }
  }

  function renderToContainer(container, tokens, prices, animate) {
    container.innerHTML = '';
    if (!tokens || !tokens.length) {
      container.appendChild(buildEmptyState(currentQuery));
      return;
    }
    tokens.forEach(function (token, i) {
      var row = buildTokenRow(token, prices ? prices[token.address] : null);
      if (animate) {
        row.style.opacity   = '0';
        row.style.transform = 'translateY(4px)';
      }
      container.appendChild(row);
      if (animate) {
        setTimeout(function (r) {
          r.style.transition = 'opacity 220ms var(--ease-out), transform 220ms var(--ease-spr)';
          r.style.opacity    = '1';
          r.style.transform  = 'translateY(0)';
        }.bind(null, row), i * 40);
      }
    });
  }

  function renderBoth(tokens, prices, animate) {
    renderToContainer(desktopList, tokens, prices, animate);
    renderToContainer(mobileList,  tokens, prices, animate);
  }

  function showSkeletons() {
    [desktopList, mobileList].forEach(function (c) {
      c.innerHTML = '';
      for (var s = 0; s < 3; s++) { c.appendChild(buildSkeletonRow()); }
    });
  }

  function fadeSkeletonsThenRender(tokens, prices) {
    var skeletons = Array.from(desktopList.querySelectorAll('.token-row--skeleton'))
      .concat(Array.from(mobileList.querySelectorAll('.token-row--skeleton')));
    if (!skeletons.length) { renderBoth(tokens, prices, true); return; }
    skeletons.forEach(function (s) {
      s.style.transition = 'opacity 160ms var(--ease-in)';
      s.style.opacity    = '0';
    });
    setTimeout(function () { renderBoth(tokens, prices, true); }, 160);
  }

  function applyFilter(query) {
    currentQuery = query;
    var all    = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    var lower  = query.toLowerCase().trim();
    var filtered = lower ? all.filter(function (t) {
      return t.name.toLowerCase().indexOf(lower)    > -1
          || t.symbol.toLowerCase().indexOf(lower)  > -1
          || t.address.toLowerCase().indexOf(lower) > -1;
    }) : all;
    renderBoth(filtered, prices, false);
  }

  function wireSearch(input, peer) {
    if (!input) return;
    input.addEventListener('input', function () {
      if (peer) peer.value = input.value;
      applyFilter(input.value);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        input.value = '';
        if (peer) peer.value = '';
        applyFilter('');
      }
    });
  }

  document.addEventListener('state:tokenList', function () {
    var tokens = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    if (!tokens.length) return;
    currentQuery = '';
    if (desktopSearch) desktopSearch.value = '';
    if (mobileSearch)  mobileSearch.value  = '';
    fadeSkeletonsThenRender(tokens, prices);
  });

  document.addEventListener('state:prices', function () {
    var tokens = (STATE && STATE.tokenList) ? STATE.tokenList : [];
    var prices = (STATE && STATE.prices)    ? STATE.prices    : {};
    if (!tokens.length) return;
    if (currentQuery) { applyFilter(currentQuery); }
    else              { renderBoth(tokens, prices, false); }
  });

  function boot() {
    showSkeletons();
    setTimeout(function () {
      setState({ tokenList: MOCK_TOKEN_LIST, prices: MOCK_PRICES });
    }, 800);
  }

  wireSearch(desktopSearch, mobileSearch);
  wireSearch(mobileSearch,  desktopSearch);
  boot();

}());
</script>

<!-- ── Phase 4B — Price Chart ───────────────────────────────────── -->
<script>
(function () {
  'use strict';

  var MOCK_PRICE_HISTORY = (function () {
    var now = Date.now();

    function pr(n) {
      var x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }
    function randn(seed) {
      var u1 = Math.max(1e-10, pr(seed));
      var u2 = pr(seed + 0.5);
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    }

    function walk(base, count, stepMs, stepVol, seed) {
      var pts   = [];
      var kappa = 0.08;
      var p = base * (1 + randn(seed) * stepVol);
      for (var i = count; i >= 0; i--) {
        p = Math.max(base * 0.001, p);
        pts.push([now - i * stepMs, +(p.toFixed(p >= 1 ? 2 : 6))]);
        var drift = kappa * (base - p) / base;
        var noise = randn(seed + i * 3 + 7) * stepVol;
        p = p * (1 + drift + noise);
      }
      pts[pts.length - 1][1] = base;
      return { prices: pts };
    }

    var T = {
      '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2': { b: 3247.82,  s: 10,  dv: 0.044  },
      '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599': { b: 67420.00, s: 20,  dv: 0.035  },
      '0x514910771AF9Ca656af840dff83E8264EcF986CA': { b: 14.23,    s: 30,  dv: 0.057  },
      '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984': { b: 8.20,     s: 40,  dv: 0.060  },
      '0x6B175474E89094C44Da98b954EedeAC495271d0F': { b: 1.00,     s: 50,  dv: 0.0006 },
      '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48': { b: 1.00,     s: 60,  dv: 0.0003 },
    };

    var h = {};
    for (var addr in T) {
      var t = T[addr];
      h[addr] = {
        '24H': walk(t.b, 24, 3600000,  t.dv / Math.sqrt(24), t.s),
        '7D':  walk(t.b, 28, 21600000, t.dv / 2,             t.s + 100),
        '30D': walk(t.b, 30, 86400000, t.dv,                 t.s + 200),
      };
    }
    return h;
  }());

  (function () {
    var h = (window.STATE && STATE.priceHistory) || {};
    for (var addr in MOCK_PRICE_HISTORY) {
      if (!h[addr]) h[addr] = MOCK_PRICE_HISTORY[addr];
    }
    setState({ priceHistory: h });
  }());

  function fmtP(usd) {
    if (usd === null || usd === undefined) return '\u2014';
    if (usd >= 10000) return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (usd >= 1)     return '$' + usd.toFixed(2);
    return '$' + usd.toFixed(6);
  }

  function fmtTs(ts, tf) {
    var d  = new Date(ts);
    var M  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
    var dy = d.getDate();
    var hh = String(d.getHours()).padStart(2, '0');
    var mn = String(d.getMinutes()).padStart(2, '0');
    if (tf === '24H' || tf === '7D') return M + '\u2009' + dy + '  ' + hh + ':' + mn;
    return M + '\u2009' + dy + ',\u2009' + d.getFullYear();
  }

  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

  var _C = null;
  function C() {
    if (_C) return _C;
    var s = getComputedStyle(document.documentElement);
    function hex(v) {
      v = v.trim();
      if (!v || v[0] !== '#') return [156, 61, 187];
      var n = parseInt(v.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    _C = {
      em:  hex(s.getPropertyValue('--em')  || '#9C3DBB'),
      br:  hex(s.getPropertyValue('--br')  || '#DEE4F4'),
    };
    return _C;
  }

  function renderChart(slot, address, tf) {
    slot.innerHTML =
      '<div class="chart-section">'
      +   '<div class="chart-toggles">'
      +     '<div class="chart-toggle-indicator"></div>'
      +     '<button class="chart-toggle-btn active" data-tf="24H">24H</button>'
      +     '<button class="chart-toggle-btn" data-tf="7D">7D</button>'
      +     '<button class="chart-toggle-btn" data-tf="30D">30D</button>'
      +   '</div>'
      +   '<div class="chart-wrap"><canvas class="chart-canvas"></canvas></div>'
      + '</div>';

    var indicator = slot.querySelector('.chart-toggle-indicator');
    var btns      = Array.from(slot.querySelectorAll('.chart-toggle-btn'));
    var activeTf  = tf;

    function posInd(btn) {
      indicator.style.left  = btn.offsetLeft  + 'px';
      indicator.style.width = btn.offsetWidth + 'px';
    }

    btns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        btns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        activeTf = btn.dataset.tf;
        posInd(btn);
        mountChart(slot, address, activeTf);
      });
    });

    requestAnimationFrame(function () {
      posInd(slot.querySelector('.chart-toggle-btn.active'));
      mountChart(slot, address, activeTf);
    });
  }

  function mountChart(slot, address, tf) {
    return; /* neutralized — prices.js (Lightweight Charts) owns chart mounting */
    var wrap = slot.querySelector('.chart-wrap');
    if (!wrap) return;

    var old = wrap.querySelector('.chart-canvas');
    var cv  = old ? old.cloneNode(false) : document.createElement('canvas');
    cv.className = 'chart-canvas';
    if (old) wrap.replaceChild(cv, old);
    else     wrap.appendChild(cv);

    var dpr = window.devicePixelRatio || 1;
    var W   = wrap.clientWidth  || 400;
    var H   = wrap.clientHeight || 220;

    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';

    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);

    var raw = (window.STATE &&
               STATE.priceHistory &&
               STATE.priceHistory[address] &&
               STATE.priceHistory[address][tf] &&
               STATE.priceHistory[address][tf].prices) || [];

    var points = raw
      .filter(function (p) { return Array.isArray(p) && p.length >= 2 && typeof p[1] === 'number'; })
      .map(function (p)    { return { ts: p[0], val: p[1] }; })
      .sort(function (a, b){ return a.ts - b.ts; });

    var padL = 0, padR = 76, padT = 18, padB = 10;
    var cW   = W - padL - padR;
    var cH   = H - padT - padB;

    var minVal = 0, maxVal = 1;
    if (points.length) {
      minVal = Math.min.apply(null, points.map(function (p) { return p.val; }));
      maxVal = Math.max.apply(null, points.map(function (p) { return p.val; }));
      var mid  = (minVal + maxVal) / 2;
      var rng  = maxVal - minVal;
      var minRng = mid * 0.012;
      if (rng < minRng) {
        minVal = mid - minRng / 2;
        maxVal = mid + minRng / 2;
        rng    = minRng;
      }
      var pad = rng * 0.10;
      minVal -= pad;
      maxVal += pad;
    }

    var tsMin   = points.length ? points[0].ts                    : 0;
    var tsMax   = points.length ? points[points.length - 1].ts    : 1;
    var tSpan   = Math.max(tsMax - tsMin, 1);
    var valSpan = Math.max(maxVal - minVal, 0.000001);

    var T = {
      toX: function (ts)  { return padL + ((ts  - tsMin) / tSpan)   * cW; },
      toY: function (val) { return padT + cH - ((val - minVal) / valSpan) * cH; },
    };
    function toX(ts)  { return T.toX(ts); }
    function toY(val) { return T.toY(val); }

    var V = { lo: minVal, hi: maxVal };

    function nearest(x) {
      var best = null, bd = Infinity;
      for (var i = 0; i < points.length; i++) {
        var d = Math.abs(toX(points[i].ts) - x);
        if (d < bd) { bd = d; best = points[i]; }
      }
      return best;
    }

    var col = C();
    var er  = col.em[0], eg = col.em[1], eb = col.em[2];
    var brr = col.br[0], brg = col.br[1], brb = col.br[2];

    function draw(clipPct, xhair) {
      ctx.clearRect(0, 0, W, H);

      if (!points.length) {
        ctx.font      = "9px 'Electrolize'";
        ctx.fillStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.20)';
        ctx.textAlign = 'center';
        ctx.fillText('NO DATA', W / 2, H / 2);
        return;
      }

      ctx.font      = "9px 'Electrolize'";
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.26)';
      ctx.fillText(fmtP(V.hi), W - 2, padT + 7);
      ctx.fillStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.16)';
      ctx.fillText(fmtP(V.lo), W - 2, padT + cH - 2);

      ctx.save();
      if (clipPct < 1) {
        ctx.beginPath();
        ctx.rect(0, 0, padL + cW * clipPct + 12, H);
        ctx.clip();
      }

      var grd = ctx.createLinearGradient(0, padT, 0, padT + cH);
      grd.addColorStop(0, 'rgba(' + er + ',' + eg + ',' + eb + ',.13)');
      grd.addColorStop(1, 'rgba(' + er + ',' + eg + ',' + eb + ',0)');

      if (points.length >= 2) {
        ctx.beginPath();
        ctx.moveTo(toX(points[0].ts), toY(points[0].val));
        for (var i = 1; i < points.length; i++) {
          var x0 = toX(points[i-1].ts), y0 = toY(points[i-1].val);
          var x1 = toX(points[i].ts),   y1 = toY(points[i].val);
          ctx.bezierCurveTo((x0+x1)/2, y0, (x0+x1)/2, y1, x1, y1);
        }
        ctx.lineTo(toX(points[points.length-1].ts), padT + cH);
        ctx.lineTo(toX(points[0].ts),               padT + cH);
        ctx.closePath();
        ctx.fillStyle = grd;
        ctx.fill();
      }

      ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',.60)';
      ctx.shadowBlur  = 6;
      ctx.strokeStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.90)';
      ctx.lineWidth   = 1.5;
      ctx.lineJoin    = 'round';
      ctx.lineCap     = 'round';
      ctx.beginPath();
      ctx.moveTo(toX(points[0].ts), toY(points[0].val));
      for (var j = 1; j < points.length; j++) {
        var ax0 = toX(points[j-1].ts), ay0 = toY(points[j-1].val);
        var ax1 = toX(points[j].ts),   ay1 = toY(points[j].val);
        ctx.bezierCurveTo((ax0+ax1)/2, ay0, (ax0+ax1)/2, ay1, ax1, ay1);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();

      if (clipPct >= 1 && !xhair) {
        var lx = toX(points[points.length-1].ts);
        var ly = toY(points[points.length-1].val);
        ctx.beginPath();
        ctx.arc(lx, ly, 3, 0, Math.PI * 2);
        ctx.fillStyle   = 'rgba(' + er + ',' + eg + ',' + eb + ',.95)';
        ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowBlur  = 12;
        ctx.fill();
        ctx.shadowBlur  = 0;
      }

      if (xhair) {
        var cx = xhair.cx, cy = xhair.cy;
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(' + brr + ',' + brg + ',' + brb + ',.10)';
        ctx.lineWidth   = 1;
        ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, padT + cH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(padL, cy); ctx.lineTo(W - padR, cy); ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fillStyle   = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowColor = 'rgba(' + er + ',' + eg + ',' + eb + ',1)';
        ctx.shadowBlur  = 14;
        ctx.fill();
        ctx.shadowBlur  = 0;

        ctx.beginPath();
        ctx.arc(cx, cy, 7.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(' + er + ',' + eg + ',' + eb + ',.28)';
        ctx.lineWidth   = 1;
        ctx.stroke();
      }
    }

    var panel    = slot.closest('.token-panel');
    var priceEl  = panel && panel.querySelector('.token-panel-usd');
    var changeEl = panel && panel.querySelector('.token-panel-change');

    var _price  = null;
    var _change = null;
    var _class  = null;

    function onMove(e) {
      if (!cv._animDone) return;
      var touch  = e.touches ? e.touches[0] : e;
      var rect   = cv.getBoundingClientRect();
      var x      = touch.clientX - rect.left;
      var pt = nearest(x);
      if (!pt) return;
      draw(1, { cx: toX(pt.ts), cy: toY(pt.val) });
      if (priceEl) {
        if (_price === null) _price = priceEl.textContent;
        priceEl.textContent = fmtP(pt.val);
      }
      if (changeEl) {
        if (_change === null) {
          _change = changeEl.innerHTML;
          _class  = changeEl.className;
        }
        changeEl.className = 'token-panel-change';
        changeEl.innerHTML =
          '<span class="token-panel-change-period"'
          + ' style="font-size:.76rem;letter-spacing:.06em;color:var(--bd)">'
          + fmtTs(pt.ts, tf)
          + '</span>';
      }
    }

    function onLeave() {
      if (!cv._animDone) return;
      draw(1, null);
      if (priceEl && _price !== null) { priceEl.textContent = _price; _price = null; }
      if (changeEl && _change !== null) {
        changeEl.innerHTML = _change;
        changeEl.className = _class;
        _change = null; _class = null;
      }
    }

    cv.addEventListener('mousemove',  onMove);
    cv.addEventListener('mouseleave', onLeave);
    cv.addEventListener('touchstart', function (e) { e.preventDefault(); onMove(e);  }, { passive: false });
    cv.addEventListener('touchmove',  function (e) { e.preventDefault(); onMove(e);  }, { passive: false });
    cv.addEventListener('touchend',   function (e) { e.preventDefault(); onLeave();  }, { passive: false });

    cv._animDone = false;
    var t0  = performance.now();
    var DUR = 600;

    function frame(now) {
      var p = Math.min(1, (now - t0) / DUR);
      draw(easeOut(p), null);
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        cv._animDone = true;
        draw(1, null);
        cv._4b = {
          points: points, T: T, V: V,
          padL: padL, padR: padR, padT: padT, padB: padB,
          cW: cW, cH: cH, W: W, H: H,
          redraw: function (xhair) { draw(1, xhair); },
        };
        document.dispatchEvent(new CustomEvent('chart:mounted', { detail: cv }));
      }
    }
    requestAnimationFrame(frame);
  }

  var rightContent    = document.getElementById('right-panel-content');
  var mobileTokenView = document.getElementById('mobile-token');

  function tryMount(container, address, tf) { /* neutralized — prices.js (Lightweight Charts) owns chart mounting */ }

  document.addEventListener('panel:render', function (e) {
    if (e.detail !== 'token') return;
    tryMount(rightContent, window.STATE && STATE.token, '24H');
  });

  document.addEventListener('state:mobileView', function (e) {
    if (e.detail !== 'token') return;
    tryMount(mobileTokenView, window.STATE && STATE.token, '24H');
  });

  document.addEventListener('state:token', function (e) {
    var address = e.detail;
    if (window.STATE && STATE.rightPanel === 'token') tryMount(rightContent,    address, '24H');
    if (window.STATE && STATE.mobileView === 'token') tryMount(mobileTokenView, address, '24H');
  });

  document.addEventListener('state:priceHistory', function () {
    var address = window.STATE && STATE.token;
    if (!address) return;
    if (STATE.rightPanel === 'token') {
      var slot = rightContent.querySelector('.token-panel-chart-slot');
      var btn  = slot && slot.querySelector('.chart-toggle-btn.active');
      if (slot) mountChart(slot, address, btn ? btn.dataset.tf : '24H');
    }
    if (STATE.mobileView === 'token') {
      var mslot = mobileTokenView.querySelector('.token-panel-chart-slot');
      var mbtn  = mslot && mslot.querySelector('.chart-toggle-btn.active');
      if (mslot) mountChart(mslot, address, mbtn ? mbtn.dataset.tf : '24H');
    }
  });

}());
</script>

<!-- ── Phase 4A + 4C — Token Panel: Header · Price · Chart · Stats · Swap ── -->
<script>
(function () {

   * marketCapSub / volumeSub / supplySub: hover reveal details.
   * Real data replaces these in Phase 7C; shapes are final.
   * ─────────────────────────────────────────────────────────────── */
  var MOCK_STATS = {
    '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2': {
      marketCap: '$389.2B', marketCapSub: 'Rank #2 by market cap',
      volume:    '$18.4B',  volumeSub:    '4.7% of market cap',

    '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599': {

      volume:    '$2.3B',   volumeSub:    '0.17% of market cap',
      supply:    '19.7M WBTC', supplySub: '21M max supply',
    },
    '0x514910771AF9Ca656af840dff83E8264EcF986CA': {
      marketCap: '$8.08B',  marketCapSub: 'Rank #14 by market cap',
      volume:    '$450M',   volumeSub:    '5.6% of market cap',

    '0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984': {

    '0x6B175474E89094C44Da98b954EedeAC495271d0F': {
      marketCap: '$5.2B',   marketCapSub: 'Fully collateralised',

      supply:    '5.2B DAI', supplySub:   'Algorithmically managed',

    '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48': {

      supply:    '34.2B USDC', supplySub: 'Regulated fiat-backed',
